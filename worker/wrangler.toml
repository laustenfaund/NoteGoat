name = "note-goat-assistant"
main = "src/index.js"
compatibility_date = "2025-01-01"

# --- Non-secret config ---
# Exact origin the hosted/index.html clone is served from (no trailing
# slash). Requests from any other Origin are rejected before the passcode
# is even checked. Example: "https://yourname.github.io"
[vars]
ALLOWED_ORIGIN = "https://REPLACE-WITH-YOUR-ORIGIN"

# Cents, not dollars. $2.50/day per passcode, $10.00/month total.
# Sized for small single-shot cleanups (700-800 max_tokens, sonnet only) —
# the lightest usage profile of the four apps with this proxy.
PER_USER_DAILY_CAP_CENTS = "250"
GLOBAL_MONTHLY_CAP_CENTS = "1000"

# --- KV namespaces ---
# Create with `wrangler kv namespace create USAGE` and
# `wrangler kv namespace create PASSCODES`, then paste the printed ids below.
[[kv_namespaces]]
binding = "USAGE"
id = "REPLACE-WITH-USAGE-NAMESPACE-ID"

[[kv_namespaces]]
binding = "PASSCODES"
id = "REPLACE-WITH-PASSCODES-NAMESPACE-ID"

# --- Secret ---
# Set with: wrangler secret put ANTHROPIC_API_KEY
# Never put the real key in this file.

# --- Rate limits (no KV writes) ---
# Workers rate-limit bindings. namespace_id must be unique per binding
# within your Cloudflare account. If your wrangler is too old to know
# [[ratelimits]], the Worker falls back to its KV-based counters.
[[ratelimits]]
name = "IP_LIMITER"
namespace_id = "1031"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "PASSCODE_LIMITER"
namespace_id = "1032"
simple = { limit = 10, period = 60 }
