const SYNC_REFUSE_MESSAGES = {
  'table|calendar':     'Not offered — a table of records has no single date/time to schedule.',
  'notes|calendar':     'Not offered — freeform notes have no date/time to schedule.',
  'checklist|docx':     'Not offered — a checklist\'s done/not-done state doesn\'t have a good home in a document; that\'s the whole point of a checklist.',
  'checklist|calendar': 'Not offered — a checklist has no date/time to schedule.',
  'event|docx':         'Not offered — scheduled things belong on a calendar, not in a document.',
  'files|sheets':       'Not offered — files/photos stay on this device, not Drive; there\'s no file data here to put in a spreadsheet.',
  'files|docx':         'Not offered — files/photos stay on this device, not Drive.',
  'files|calendar':     'Not offered — files/photos have no date/time to schedule.',
};

function openSyncModal(mod){
  openModal('Sync — ' + mod.name, (body) => {
    const statusBox = el('div', ''); statusBox.id = 'syncStatusBox';
    Object.keys(SYNC_TARGET_LABELS).forEach(target => {
      const rule = SYNC_RULES[mod.shape][target];
      const row = el('div', 'schema-field-row');
      row.style.alignItems = 'flex-start';
      const info = el('div', ''); info.style.flex = '1';
      info.appendChild(el('div', '', SYNC_TARGET_LABELS[target]));
      if (rule === 'refuse'){
        info.appendChild(el('div', 'field-hint', SYNC_REFUSE_MESSAGES[mod.shape + '|' + target]));
      } else if (rule === 'warn'){
        info.appendChild(el('div', 'field-hint', SYNC_WARN_MESSAGES[mod.shape + '|' + target]));
      } else {
        info.appendChild(el('div', 'field-hint', 'A natural fit for this module\'s shape.'));
      }
      if (target === 'calendar' && rule !== 'refuse'){
        const remLabel = document.createElement('label');
        remLabel.style.display = 'flex'; remLabel.style.alignItems = 'center'; remLabel.style.gap = '6px';
        remLabel.style.marginTop = '6px'; remLabel.style.fontSize = '13.5px';
        const remCb = document.createElement('input'); remCb.type = 'checkbox'; remCb.style.width = 'auto';
        remCb.checked = mod.calendarReminder !== false;
        remCb.onchange = () => { mod.calendarReminder = remCb.checked; saveState(); };
        remLabel.appendChild(remCb);
        remLabel.appendChild(document.createTextNode('Reminder — 9am the day before (all-day events) or 24h before (timed events)'));
        info.appendChild(remLabel);
      }
      row.appendChild(info);
      const btn = document.createElement('button');
      btn.className = 'btn ' + (rule === 'refuse' ? 'btn-secondary' : 'btn-primary');
      btn.textContent = rule === 'refuse' ? 'Not available' : 'Sync now';
      btn.disabled = (rule === 'refuse');
      btn.onclick = async () => {
        if (rule === 'warn'){
          const ok = await confirmModal(SYNC_WARN_MESSAGES[mod.shape + '|' + target]);
          if (!ok) return;
        }
        runSync(mod, target, statusBox);
      };
      row.appendChild(btn);
      body.appendChild(row);
    });
    body.appendChild(statusBox);
  }, [ buttonEl('Close', 'btn-secondary', closeModal) ]);
}

function syncStatus(box, text, isError){
  box.innerHTML = '';
  box.appendChild(el('div', isError ? 'error-box' : 'shape-note', text));
}

async function runSync(mod, target, statusBox){
  if (!state.settings.googleClientId || !state.settings.googleApiKey){
    syncStatus(statusBox, 'Google isn\'t configured yet — add your Client ID and API key under Connections first.', true);
    return;
  }
  if (!googleRt.connected){
    syncStatus(statusBox, 'Connecting to Google…', false);
    tryInitGoogle(true,
      () => runSync(mod, target, statusBox),
      (msg) => syncStatus(statusBox, msg, true));
    return;
  }
  syncStatus(statusBox, 'Syncing…', false);
  try {
    if (target === 'sheets') await syncModuleToSheets(mod);
    else if (target === 'docx') await syncModuleToDocx(mod);
    else if (target === 'calendar') await syncModuleToCalendar(mod);
    saveState();
    syncStatus(statusBox, 'Synced just now.', false);
  } catch(err){
    console.error('Sync failed', err);
    syncStatus(statusBox, 'Sync didn\'t go through (' + (err.message || 'unknown error') + '). Nothing was changed here locally.', true);
  }
}

function fieldValueForExport(f, rec){
  if (f.type === 'link-one' || f.type === 'link-many') return linkFieldDisplay(f, rec);
  if (f.type === 'date') return rec.fields[f.id] ? formatDate(rec.fields[f.id]) : '';
  if (f.type === 'checkbox') return rec.fields[f.id] ? 'Yes' : 'No';
  return rec.fields[f.id] || '';
}

async function findOrCreateFolder(name, parentId){
  const safeName = name.replace(/'/g, "\\'");
  const parentClause = parentId ? (" and '" + parentId + "' in parents") : " and 'root' in parents";
  const q = "mimeType='application/vnd.google-apps.folder' and name='" + safeName + "' and trashed=false" + parentClause;
  const listRes = await gapi.client.drive.files.list({ q, fields: 'files(id,name)' });
  if (listRes.result.files && listRes.result.files.length) return listRes.result.files[0].id;
  const createRes = await gapi.client.drive.files.create({
    resource: { name, mimeType: 'application/vnd.google-apps.folder', parents: parentId ? [parentId] : [] },
    fields: 'id',
  });
  return createRes.result.id;
}

async function syncModuleToSheets(mod){
  if (!state.settings.spreadsheetId){
    const folderId = await findOrCreateFolder('Note Goat', null);
    const res = await gapi.client.sheets.spreadsheets.create({ properties: { title: 'Note Goat Sync' } });
    state.settings.spreadsheetId = res.result.spreadsheetId;
    await gapi.client.drive.files.update({ fileId: state.settings.spreadsheetId, addParents: folderId, removeParents: 'root', fields: 'id,parents' });
  }
  const ssId = state.settings.spreadsheetId;
  const meta = await gapi.client.sheets.spreadsheets.get({ spreadsheetId: ssId });
  const existingTitles = (meta.result.sheets || []).map(s => s.properties.title);
  const tabName = mod.name.slice(0, 95); // Sheets tab title limit
  if (!existingTitles.includes(tabName)){
    await gapi.client.sheets.spreadsheets.batchUpdate({
      spreadsheetId: ssId,
      resource: { requests: [{ addSheet: { properties: { title: tabName } } }] },
    });
  }
  const headers = mod.fields.map(f => f.label).concat('Notes');
  const rows = moduleRecords(mod.id).map(rec => mod.fields.map(f => fieldValueForExport(f, rec)).concat(rec.notes || ''));
  await gapi.client.sheets.spreadsheets.values.update({
    spreadsheetId: ssId,
    range: "'" + tabName + "'!A1",
    valueInputOption: 'RAW',
    resource: { values: [headers, ...rows] },
  });
}

async function syncModuleToDocx(mod){
  if (!mod.docId){
    const folderId = await findOrCreateFolder('Note Goat', null);
    const res = await gapi.client.docs.documents.create({ resource: { title: 'Note Goat — ' + mod.name } });
    mod.docId = res.result.documentId;
    await gapi.client.drive.files.update({ fileId: mod.docId, addParents: folderId, removeParents: 'root', fields: 'id,parents' });
  }
  const doc = await gapi.client.docs.documents.get({ documentId: mod.docId });
  const content = doc.result.body.content || [];
  const endIndex = content.length ? content[content.length - 1].endIndex : 1;
  const requests = [];
  if (endIndex > 2) requests.push({ deleteContentRange: { range: { startIndex: 1, endIndex: endIndex - 1 } } });
  const parts = moduleRecords(mod.id).map(rec => {
    const title = recordTitle(mod, rec);
    const body = rec.notes || (mod.fields.map(f => f.label + ': ' + fieldValueForExport(f, rec)).join('\n'));
    return title + '\n' + body;
  });
  const text = parts.length ? parts.join('\n\n---\n\n') + '\n' : '(no records yet)\n';
  requests.push({ insertText: { location: { index: 1 }, text } });
  await gapi.client.docs.documents.batchUpdate({ documentId: mod.docId, resource: { requests } });
}

// A "local" YYYY-MM-DDTHH:MM:SS string (no offset/Z) for a date+time
// that's `hours` after dateVal/timeVal, read back using the wall-clock
// components — the timeZone field on the request is what pins it to a
// real instant, not this string.
function addHoursToLocalDateTime(dateVal, timeVal, hours){
  const [y, mo, d] = dateVal.split('-').map(Number);
  const [h, mi] = timeVal.split(':').map(Number);
  const dt = new Date(y, mo - 1, d, h, mi, 0);
  dt.setHours(dt.getHours() + hours);
  const pad = n => String(n).padStart(2, '0');
  return dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate()) +
    'T' + pad(dt.getHours()) + ':' + pad(dt.getMinutes()) + ':00';
}

async function syncModuleToCalendar(mod){
  const df = dateField(mod);
  if (!df) throw new Error('this module has no date field');
  const tf = timeField(mod);
  for (const rec of moduleRecords(mod.id)){
    const dateVal = rec.fields[df.id];
    if (!dateVal) continue;
    const timeVal = tf ? rec.fields[tf.id] : '';
    let eventResource;
    if (timeVal){
      // Has a time of day too — push as a timed, 1-hour event instead of
      // all-day, in the browser's own timezone.
      const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
      eventResource = {
        summary: recordTitle(mod, rec),
        description: rec.notes || '',
        start: { dateTime: dateVal + 'T' + timeVal + ':00', timeZone },
        end: { dateTime: addHoursToLocalDateTime(dateVal, timeVal, 1), timeZone },
      };
    } else {
      // Date only — keep the existing all-day behavior.
      eventResource = {
        summary: recordTitle(mod, rec),
        description: rec.notes || '',
        start: { date: dateVal },
        end: { date: dateVal },
      };
    }
    // Reminder minutes are measured from event start, so a timed event
    // (start = the actual time) needs a longer lead than an all-day one
    // (start = midnight) to land at a sensible moment.
    if (mod.calendarReminder !== false){
      eventResource.reminders = {
        useDefault: false,
        overrides: [{ method: 'popup', minutes: timeVal ? CALENDAR_REMINDER_MINUTES_TIMED : CALENDAR_REMINDER_MINUTES_ALLDAY }],
      };
    }
    if (rec.calendarEventId){
      await gapi.client.calendar.events.update({ calendarId: 'primary', eventId: rec.calendarEventId, resource: eventResource });
    } else {
      const res = await gapi.client.calendar.events.insert({ calendarId: 'primary', resource: eventResource });
      rec.calendarEventId = res.result.id;
    }
  }
}

/* =========================================================
   Small helpers
   ========================================================= */
function el(tag, cls, text){
  const e = document.createElement(tag || 'div');
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const WC_PALETTE = ['var(--wc-1)','var(--wc-2)','var(--wc-3)','var(--wc-4)','var(--wc-5)','var(--wc-6)'];
function colorForKey(str){
  const s = String(str || '');
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return WC_PALETTE[h % WC_PALETTE.length];
}
function formatDate(iso){
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return iso;
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
}
function formatDateTime(ts){
  const d = new Date(ts);
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric' }) + ', ' + d.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
}

        <p>A module you've created lives in the sidebar. Click its ⚙ to edit its fields later.</p>
      </section>

      <section id="records">
        <p class="sec-num">03</p>
        <h2>Records &amp; notes</h2>
        <p>Inside a module, <b>+ Add record</b> opens a form for that module's fields. Every record — regardless of shape — also gets a built-in <b>Notes</b> field automatically; you never have to add it yourself.</p>
        <p>How a module's records are shown depends on its shape: a table for repeating rows, a checklist with checkboxes, note cards for freeform notes, a date-sorted list for scheduled things, and a thumbnail grid for files (see below).</p>
      </section>

      <section id="schema">
        <p class="sec-num">04</p>
        <h2>Editing a module later</h2>
        <p>Open a module's ⚙ any time to add, rename, retype, or remove fields — even after it already has records in it.</p>
        <ul class="plain">
          <li>Adding a field, reordering, or a plain rename applies immediately.</li>
          <li>Deleting a field <i>with data in it</i>, or narrowing its type in a way some existing values don't fit, asks you to confirm first — naming exactly how many records are affected.</li>
          <li>If a type change genuinely can't apply to existing data (turning a field with "555-CALL-DOC" in it into a Number, say), it's refused outright with an error naming the problem record — never applied halfway.</li>
        </ul>
        <p>A module's <b>shape</b> can't be changed after creation — make a new module if you need a different one.</p>
      </section>

      <section id="links">
        <p class="sec-num">05</p>
        <h2>Links between modules</h2>
        <p>A field can be a <b>Link — one record</b> or <b>Link — many records</b>, pointing at records in another module (add one from a module's ⚙, same as any field, then choose which module it links to). You always pick the link yourself from a list — nothing is guessed or inferred from content.</p>
        <p>Open any record and you'll see two things beyond its own fields: what it links <i>to</i>, and — if anything points at it — a <b>Linked from</b> section showing what links <i>to it</i>. Every row is clickable, so you can hop from a Doctor to an Appointment to that appointment's Notes to Bring and back.</p>
        <div class="note">Deleting something other records link to warns you first, naming how many. If a link ever goes stale another way, it shows as "linked record no longer exists" rather than silently disappearing.</div>
      </section>

      <section id="files">
        <p class="sec-num">06</p>
        <h2>File / photo modules</h2>
        <p>A module can have the <b>File / photo</b> shape — one uploaded file or photo per record, for things you want to keep, like a scanned insurance card or a piece of referral paperwork. Every record of this shape has a built-in upload field, the same way every record has a built-in Notes field.</p>
        <p>Files are stored on this device, in your browser's local file storage (IndexedDB) — never uploaded to Google Drive or anywhere else. Open a record to view or download its file, or remove it.</p>
        <div class="note">This is a completely separate feature from Quick Capture's photo input (below). Quick Capture's photo is used once, to help AI write a clean note, and then discarded — nothing about it is kept. A File / photo module record keeps the actual file, on purpose, with no AI involved at all.</div>
      </section>

      <section id="capture">
        <p class="sec-num">07</p>
        <h2>Quick Capture &amp; AI cleanup</h2>
        <p>The card at the top of Home. Type or paste a quick note and <b>Save note</b> — it's filed straight into your Personal Notes module, no AI required.</p>
        <p>If you'd rather hand it a photo of messy handwritten or typed notes, attach one, then <b>Clean up with AI</b>. It reads the photo (and any typed text alongside it) and rewrites it into one organized note, shown in the box for you to edit — nothing saves until you click Save note. Needs your Anthropic key under Settings; the photo itself is never kept, only the resulting text.</p>
        <p>If a photo is genuinely illegible, the note says so rather than guessing at what it can't read.</p>
      </section>

      <section id="sync">
        <p class="sec-num">08</p>
        <h2>Sync</h2>
        <p>Open a module and click <b>Sync</b> to push it to Google Sheets, Docs, or Calendar — one-way only, on demand. Nothing is ever read back from Google; editing something on the Google side won't reflect back here.</p>
        <p>Which targets are offered depends on the module's shape: a natural fit (a table to Sheets, a dated module to Calendar) syncs straight away; a workable-but-lossy fit (a checklist to Sheets, say) asks you to confirm first and says exactly what will be lost; anything that wouldn't make sense at all (files, or anything without a date, to Calendar) isn't offered, with a reason shown. Needs your own Google Cloud project, connected under Settings.</p>
        <p>Calendar sync adds a popup reminder to every event it pushes — 9am the day before for an all-day event (a Date field only), or 24 hours before for a timed one (see below). It's on by default; the <b>Reminder</b> checkbox next to Google Calendar in this Sync screen turns it off for this module, remembered from then on.</p>
        <p>A dated/scheduled module can add an optional <b>Time</b> field alongside its Date field. Fill one in on a record and that record syncs as a real 1-hour timed event instead of all-day, in your browser's own timezone; records with no time keep syncing all-day, unchanged.</p>
      </section>

      <section id="settings">
        <p class="sec-num">09</p>
        <h2>Settings: keys &amp; connections</h2>
        <p>The ⚙ Settings button (sidebar) holds two keys, both stored only in this browser and used only for the direct calls this app makes:</p>
        <ol class="steps">
          <li><b>Anthropic API key</b> — powers Quick Capture's AI cleanup and AI-assisted module creation.</li>
          <li><b>Google Client ID + API key</b>, from your own free Google Cloud project — powers Sync. Click Connect / Sign in each session; the sign-in itself doesn't persist across a reload, by design.</li>
        </ol>
      </section>

      <section id="backup">
        <p class="sec-num">10</p>
        <h2>Backup &amp; transfer</h2>
        <p>Also under Settings. <b>Export</b> writes one file with everything in the app — every module, every record, every file/photo — except your keys, which never leave this device. Move that file however you'd move any file (AirDrop, email to yourself, a cloud-drive folder) and use <b>Import</b> on the other device to read it back in.</p>
        <p>Import always asks you to confirm first, naming what it's about to replace — it's a full restore, not a merge, and it's the only way data moves between devices; nothing syncs automatically.</p>
        <p>Set Export to <b>Daily</b> or <b>Weekly</b> instead of Manual and the app checks, once, the next time you open it — if it's overdue, it exports quietly with a small confirmation, no prompt. That's not a true background schedule (nothing can run while the app is closed, especially on iPhone) — it's "checked whenever you happen to open it," which works out the same in practice if you use the app regularly.</p>
      </section>

      <section id="privacy">
        <p class="sec-num">11</p>
        <h2>Data &amp; privacy</h2>
        <p>Everything lives in this browser: module and record data in <code>localStorage</code>, file/photo bytes in IndexedDB. No account, no server of ours. The only network calls this app makes are the ones you trigger — an Anthropic call for AI capture or module setup, a Google call when you click Sync — using the keys you supplied.</p>
      </section>

      <section id="phone">
        <p class="sec-num">12</p>
        <h2>Installing on your phone</h2>
        <p>Once this app is hosted somewhere over <code>https://</code> (e.g. GitHub Pages), your browser's "Add to Home Screen" / "Install app" option gives it a real icon and name instead of just a bookmark, plus a minimal offline shell.</p>
      </section>

      <section id="limits">
        <p class="sec-num">13</p>
        <h2>Known limits</h2>
        <ul class="plain">
          <li>Nothing here can stop a browser's own "clear site data" from wiping everything — that's a browser boundary, not something any web page can override. Regular Export is the real protection.</li>
          <li>Import replaces everything currently in the app; it doesn't merge two devices' changes together.</li>
          <li>A backup file with lots of large photos in it will itself be large — no compression is attempted.</li>
          <li>AI cleanup quality depends on how legible the input is; a genuinely illegible photo produces a note that says so, not a confident guess.</li>
        </ul>
      </section>

      <footer>Note Goat is a self-contained page — this manual describes its behavior as installed, based on how the app itself is built. It has no version number to cite.</footer>
    </main>
  </div>
</div>
<script>
  // Handle TOC clicks ourselves instead of native #hash navigation — inside
  // a srcdoc iframe, native anchor-jumps can resolve against the parent
  // page's URL instead of this document, which can end up loading the real
  // app into this iframe instead of just scrolling to the section.
  document.querySelectorAll('.toc a[href^="#"]').forEach((a) => {
    a.addEventListener('click', (e) => {
      e.preventDefault();
      const target = document.getElementById(a.getAttribute('href').slice(1));
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
<\/script>
