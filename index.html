<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Note Goat</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="icon" href="icons/icon-192.png" />
<meta name="theme-color" content="#2C6E7E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Note Goat" />
<!-- Fonts ship with the app (fonts/, SIL Open Font License) so opening it contacts no font service. -->
<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/inter-latin-400-normal.woff2) format('woff2');}
@font-face{font-family:'Inter';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/inter-latin-500-normal.woff2) format('woff2');}
@font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/inter-latin-600-normal.woff2) format('woff2');}
@font-face{font-family:'Inter';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/inter-latin-700-normal.woff2) format('woff2');}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format('woff2');}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2');}
</style>
<style>
:root{
  /* Interface panels — solid, calm, easy to read. The stripes live in the
     page background only; nothing you have to read sits on top of them. */
  --panel: #FFFCF5;
  --surface: #FFFFFF;
  --surface-sunk: #F3EEE1;
  --ink: #2B2A27;
  --ink-dim: #6E6A62;
  --ink-faint: #9A958A;
  --line: #E9E2D2;
  --line-strong: #DCD1B6;
  --accent: #2C6E7E;
  --accent-soft: rgba(44,110,126,0.12);
  --accent-ink: #1F4E5A;
  --warn: #A8843F;
  --warn-soft: rgba(168,132,63,0.14);
  --danger: #A13E63;
  --danger-soft: rgba(161,62,99,0.1);
  --font: 'Inter', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
  --radius: 10px;

  /* Watercolor stripe palette — pulled from the reference swatch. Used for
     the page background and, sparingly, for per-item type-color dots. */
  --wc-1: #2FB4C2; /* turquoise */
  --wc-2: #3E6FA6; /* blue */
  --wc-3: #2C7A68; /* teal */
  --wc-4: #A13E63; /* magenta */
  --wc-5: #7C8A4A; /* olive */
  --wc-6: #C39A52; /* gold */
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  color:var(--ink);
  font-family:var(--font);
  font-size:14px;
  line-height:1.5;
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:22px;
  /* Straight-edged stripes, flush (no gaps), Value at 57.5% of the original
     watercolor swatch — dark enough to sit behind white text without a
     softening overlay. */
  background-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='312'%20height='400'%20viewBox='0%200%20312%20400'%3E%3Crect%20x='0'%20y='0'%20width='312'%20height='400'%20fill='%23908C83'/%3E%3Crect%20x='0'%20y='0'%20width='29.4'%20height='400'%20fill='%231B6870'/%3E%3Crect%20x='29.4'%20y='0'%20width='38.4'%20height='400'%20fill='%2324405F'/%3E%3Crect%20x='67.8'%20y='0'%20width='31.7'%20height='400'%20fill='%2319463C'/%3E%3Crect%20x='99.5'%20y='0'%20width='24.9'%20height='400'%20fill='%235D2439'/%3E%3Crect%20x='124.4'%20y='0'%20width='27.1'%20height='400'%20fill='%23474F2B'/%3E%3Crect%20x='151.5'%20y='0'%20width='29.4'%20height='400'%20fill='%231B6870'/%3E%3Crect%20x='180.9'%20y='0'%20width='40.7'%20height='400'%20fill='%2370592F'/%3E%3Crect%20x='221.6'%20y='0'%20width='33.9'%20height='400'%20fill='%2324405F'/%3E%3Crect%20x='255.5'%20y='0'%20width='31.7'%20height='400'%20fill='%2319463C'/%3E%3Crect%20x='287.2'%20y='0'%20width='24.8'%20height='400'%20fill='%235D2439'/%3E%3C/svg%3E");
  background-repeat: repeat;
  background-size: 312px 400px;
  background-attachment: fixed;
}
button{font-family:var(--font);cursor:pointer;}
input,textarea,select{font-family:var(--font);font-size:14px;}
h1,h2,h3{margin:0;}
::selection{background:var(--accent-soft);}

/* The shell is the whole visible interface — one solid, legible panel
   floating over the watercolor stripe field painted on <body>. The stripes
   are the app's personality; nothing you have to read sits directly on
   top of them. */
.shell{
  display:flex;
  width:100%;max-width:1360px;
  min-height:calc(100vh - 44px);
  border-radius:20px;
  box-shadow:0 24px 60px rgba(35,30,20,0.16), 0 2px 8px rgba(35,30,20,0.06);
  overflow:hidden;
  /* clip, not hidden, where supported: hidden makes the shell a scroll
     container, which would stop the sidebar below from sticking. */
  overflow:clip;
  align-self:flex-start;
}

/* ---------- Sidebar ----------
   Sticky and one screen tall, so Library / Manual / Settings stay in the
   same place at the bottom however long the page is, and don't move when
   the page's content changes height. The module list scrolls if needed. */
.sidebar{
  width:230px;flex-shrink:0;
  display:flex;flex-direction:column;
  position:sticky;top:22px;align-self:flex-start;
  height:calc(100vh - 44px);height:calc(100dvh - 44px);
}
.brand{padding:22px 18px 16px;position:relative;overflow:hidden;}
.brand-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-end;}
.brand-mark-wrap{display:flex;align-items:center;gap:8px;}
.brand-icon{height:29px;width:29px;display:block;flex-shrink:0;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.4));}
.brand-mark{
  font-size:14px;font-weight:700;letter-spacing:-0.01em;white-space:nowrap;
  background:rgba(255,252,245,0.82);backdrop-filter:blur(4px);
  display:inline-block;padding:4px 10px;border-radius:7px;
}
.brand-sub{font-family:var(--font-mono);font-size:10px;color:var(--ink-dim);margin-top:5px;text-transform:uppercase;letter-spacing:0.06em;
  background:rgba(255,252,245,0.82);display:inline-block;padding:2px 8px;border-radius:6px;}

.nav-section{padding:6px 10px;}
.nav-btn{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:none;border:none;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.35);
  padding:8px 10px;font-size:13.5px;border-radius:7px;margin-bottom:1px;
}
.nav-btn:hover{background:var(--surface-sunk);color:var(--ink);text-shadow:none;}
.nav-btn.active{background:var(--surface);color:var(--accent-ink);font-weight:600;text-shadow:none;box-shadow:0 2px 6px rgba(0,0,0,0.18);}
.nav-btn .dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex-shrink:0;background:currentColor;opacity:0.7;}

nav.module-list{flex:1;overflow-y:auto;padding:8px 10px;}
.nav-label{font-family:var(--font-mono);font-size:10px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.35);text-transform:uppercase;letter-spacing:0.06em;padding:10px 10px 4px;}
.module-row{display:flex;align-items:stretch;margin-bottom:1px;}
.module-row .nav-btn{flex:1;}
.module-row .gear{
  background:none;border:none;color:rgba(255,255,255,0.75);text-shadow:0 1px 2px rgba(0,0,0,0.35);
  width:26px;border-radius:6px;font-size:12px;flex-shrink:0;
}
.module-row .gear:hover{background:var(--surface-sunk);color:var(--ink);text-shadow:none;}
.module-row.active .nav-btn{background:var(--surface);color:var(--accent-ink);font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,0.18);}

.sidebar-footer{padding:10px;border-top:1px solid var(--line);}
.btn-library{
  width:100%;background:var(--surface-sunk);border:1px solid var(--line-strong);
  color:var(--ink);padding:9px;font-size:13px;border-radius:8px;font-weight:600;
}
.btn-library:hover{border-color:var(--accent);color:var(--accent-ink);}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;padding:28px 34px 60px;max-width:960px;background:var(--panel);overflow-y:auto;}
/* The page title sits on the solid cream panel, not the stripes, so it
   uses ink colors (white text here was close to invisible). */
.page-title{font-size:22px;font-weight:700;margin:0 0 2px;color:var(--ink);}
.page-sub{color:var(--ink-dim);font-size:13px;margin-bottom:22px;}

/* Visible keyboard focus for everything you can tab to. */
button:focus-visible, [role="button"]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* ---------- Cards (home) ---------- */
.cards{display:flex;flex-direction:column;gap:12px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.card-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 18px;cursor:pointer;
}
.card-head:hover{background:var(--surface-sunk);}
.card-head-left{display:flex;flex-direction:column;gap:2px;min-width:0;}
.card-title{font-size:14px;font-weight:600;}
.card-preview{font-size:12.5px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-count{
  font-family:var(--font-mono);font-size:12px;color:var(--ink-dim);
  background:var(--surface-sunk);border-radius:20px;padding:3px 10px;flex-shrink:0;
}
.card-chevron{color:var(--ink-faint);font-size:12px;transition:transform .15s;flex-shrink:0;}
.card.open .card-chevron{transform:rotate(90deg);}
.card-body{display:none;border-top:1px solid var(--line);padding:6px 18px 14px;}
.card.open .card-body{display:block;}
.card-body .empty{color:var(--ink-faint);font-size:13px;padding:12px 2px;}

.item-row{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);}
.item-row:last-child{border-bottom:none;}
.type-dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--ink-faint);}
.item-row .item-main{flex:1;min-width:0;cursor:pointer;}
.item-row .item-title{font-size:13.5px;font-weight:500;}
.item-row .item-meta{font-size:11.5px;color:var(--ink-dim);}
.item-row .item-title:hover{color:var(--accent-ink);text-decoration:underline;}

/* ---------- Drive sync bar ---------- */
.sync-bar{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:9px 14px;margin-bottom:16px;font-size:13px;color:var(--ink-dim);
}
.sync-bar:hover{border-color:var(--accent);color:var(--accent-ink);}
.sync-bar .sync-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--ink-faint);}
.sync-bar.ok .sync-dot{background:var(--accent);}
.sync-bar.busy .sync-dot{background:var(--warn);}
.sync-bar.err{color:var(--danger);}
.sync-bar.err .sync-dot{background:var(--danger);}
.sync-bar.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--ink);}
.sync-bar.warn .sync-dot{background:var(--warn);}

/* ---------- Dashboard ---------- */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:12px;}
.dash-grid .card-preview{white-space:normal;}
.dash-controls{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;margin-bottom:12px;font-size:13px;color:var(--ink-dim);}
.dash-controls label{display:flex;align-items:center;gap:6px;}
.dash-controls input{width:64px;border:1px solid var(--line-strong);border-radius:8px;padding:6px 8px;background:var(--surface);color:var(--ink);}
.dash-controls input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);}
.dash-group-label{font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-faint);margin:12px 0 2px;}

/* Quick capture */
.quick-capture{padding:16px 18px 18px;}
.quick-capture textarea{
  width:100%;min-height:70px;resize:vertical;border:1px solid var(--line-strong);
  border-radius:8px;padding:10px 12px;background:var(--surface-sunk);color:var(--ink);
}
.quick-capture textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);}
.quick-capture-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:10px;}
.quick-capture-hint{font-size:11.5px;color:var(--ink-faint);}

/* ---------- Buttons ---------- */
.btn{border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-ink);}
.btn-secondary{background:var(--surface-sunk);color:var(--ink);border:1px solid var(--line-strong);}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent-ink);}
.btn-danger{background:var(--danger-soft);color:var(--danger);border:1px solid transparent;}
.btn-danger:hover{border-color:var(--danger);}
.btn-text{background:none;border:none;color:var(--ink-dim);font-size:13px;padding:6px 8px;}
.btn-text:hover{color:var(--accent-ink);}
.btn[disabled]{opacity:0.5;cursor:not-allowed;}

/* ---------- Module view ---------- */
.module-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
.module-toolbar-actions{display:flex;gap:8px;}

/* Wide tables scroll inside their own box instead of pushing the page
   sideways. Data columns get a minimum width so short columns like
   Status don't collapse into a tall, narrow strip. */
.table-wrap{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--radius);}
table.record-table td:not(.actions){min-width:6.5em;}
table.record-table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
table.record-table th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-faint);
  padding:10px 12px;background:var(--surface-sunk);border-bottom:1px solid var(--line);
}
table.record-table td{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:top;}
table.record-table tr:last-child td{border-bottom:none;}
table.record-table tr:hover{background:var(--surface-sunk);}
table.record-table td.actions{white-space:nowrap;width:1%;}
.note-excerpt{color:var(--ink-dim);font-size:12px;}

.record-cards{display:flex;flex-direction:column;gap:10px;}
.record-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
.record-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.record-card-title{font-weight:600;font-size:14px;}
.record-card-meta{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}
.record-card-body{font-size:13.5px;color:var(--ink-dim);margin-top:8px;white-space:pre-wrap;}
.record-card-actions{display:flex;gap:6px;flex-shrink:0;}

.checklist-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);}
.checklist-row:last-child{border-bottom:none;}
.checklist-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);}
.checklist-row .cl-title{flex:1;font-size:13.5px;}
.checklist-row.done .cl-title{color:var(--ink-faint);text-decoration:line-through;}
.tag-chip{
  font-family:var(--font-mono);font-size:10.5px;background:var(--surface-sunk);color:var(--ink-dim);
  padding:2px 8px;border-radius:20px;flex-shrink:0;
}

.empty-state{
  text-align:center;padding:50px 20px;color:var(--ink-faint);
  background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--radius);
}
.empty-state p{margin:0 0 12px;}

/* ---------- Modal ---------- */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(43,42,39,0.35);
  display:flex;align-items:flex-start;justify-content:center;padding:6vh 20px;z-index:50;overflow-y:auto;
}
.modal{
  background:var(--surface);border-radius:14px;max-width:560px;width:100%;
  box-shadow:0 20px 50px rgba(0,0,0,0.18);
}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.modal-head h2{font-size:16px;}

.manual-overlay{
  display:none;position:fixed;inset:0;background:rgba(43,42,39,0.45);
  align-items:center;justify-content:center;padding:4vh 20px;z-index:60;
}
.manual-overlay.open{display:flex;}
.manual-overlay-box{
  background:var(--panel);border-radius:14px;width:100%;max-width:960px;height:92vh;
  display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,0.25);overflow:hidden;
}
.manual-overlay-head{
  padding:14px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;
  font-weight:600;flex-shrink:0;
}
.manual-overlay-box iframe{flex:1;width:100%;border:none;}
.modal-close{background:none;border:none;font-size:18px;color:var(--ink-faint);line-height:1;}
.modal-close:hover{color:var(--ink);}
.modal-body{padding:20px 22px;max-height:64vh;overflow-y:auto;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;}

.field-group{margin-bottom:14px;}
.field-label{font-size:12px;font-weight:600;color:var(--ink-dim);display:block;margin-bottom:5px;}
.field-input, .field-group input[type=text], .field-group input[type=date], .field-group select, .field-group textarea{
  width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:9px 11px;
  background:var(--surface);color:var(--ink);
}
.field-group textarea{min-height:80px;resize:vertical;}
.field-input:focus, .field-group input:focus, .field-group select:focus, .field-group textarea:focus{
  outline:2px solid var(--accent-soft);border-color:var(--accent);
}
.field-hint{font-size:11.5px;color:var(--ink-faint);margin-top:4px;}

.tpl-group-label{font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-faint);margin:16px 0 8px;}
.tpl-group-label:first-child{margin-top:0;}
.tpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.tpl-card{
  text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:11px 13px;display:flex;flex-direction:column;gap:2px;
}
.tpl-card:hover{border-color:var(--accent);background:var(--accent-soft);}
.tpl-card .tpl-name{font-weight:600;font-size:13.5px;}
.tpl-card .tpl-shape{font-size:11px;color:var(--ink-faint);}
.tpl-custom-btn{
  width:100%;text-align:left;background:var(--surface-sunk);border:1px dashed var(--line-strong);border-radius:10px;
  padding:12px 14px;font-weight:600;font-size:13.5px;color:var(--ink);
}
.tpl-custom-btn:hover{border-color:var(--accent);color:var(--accent-ink);}

.schema-field-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;background:var(--surface-sunk);padding:8px;border-radius:8px;}
.schema-field-row input, .schema-field-row select{flex:1;min-width:0;border:1px solid var(--line-strong);border-radius:7px;padding:7px 9px;background:var(--surface);color:var(--ink);}
.schema-field-row input:focus, .schema-field-row select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);}
.schema-field-row .rm-field{flex:0 0 auto;background:none;border:none;color:var(--ink-faint);font-size:16px;padding:2px 6px;}
.schema-field-row .rm-field:hover{color:var(--danger);}
.add-field-btn{margin-top:4px;}

.confirm-msg{font-size:13.5px;line-height:1.55;margin-bottom:6px;}
.confirm-msg strong{color:var(--ink);}
.error-box{background:var(--danger-soft);color:var(--danger);border-radius:8px;padding:10px 12px;font-size:13px;margin-top:10px;}

.shape-note{
  font-size:12px;color:var(--ink-faint);background:var(--surface-sunk);border-radius:8px;padding:9px 11px;margin-top:14px;
}

.roadmap-note{
  font-size:11.5px;color:var(--ink-faint);text-align:center;margin-top:26px;padding-top:14px;border-top:1px solid var(--line);
}

/* ---------- Portrait and landscape (phones and tablets) ----------
   Added 2026-09-24. Desktop layout above is unchanged; these rules only
   take over on narrow screens (phone portrait) and short screens
   (phone landscape). */

/* Phone portrait / narrow windows: sidebar becomes a compact top bar —
   brand, then Home + modules as one sideways-scrolling row, then the
   Library / Manual / Settings buttons side by side. */
@media (max-width: 700px){
  body{padding:0;}

<script>
'use strict';

/* =========================================================
   Data model
   ========================================================= */
const STORE_KEY = 'notegoat_state_v1';

const FIELD_TYPES = {
  text:      { label: 'Short text' },
  longtext:  { label: 'Long text' },
  date:      { label: 'Date' },
  time:      { label: 'Time' },
  number:    { label: 'Number' },
  select:    { label: 'Choice list' },
  checkbox:  { label: 'Checkbox' },
  'link-one':  { label: 'Link — one record', isLink: true, multi: false },
  'link-many': { label: 'Link — many records', isLink: true, multi: true },
};

const SHAPES = {
  table:     { label: 'Repeating rows', hint: 'A table of similar records — e.g. Medications.' },
  notes:     { label: 'Freeform notes', hint: 'Long-form entries. No custom fields needed — the built-in notes field is the content.' },
  checklist: { label: 'Checklist', hint: 'Simple done / not-done items.' },
  event:     { label: 'Dated / scheduled', hint: 'Things with a date — e.g. Appointments. Include one Date field.' },
  files:     { label: 'File / photo', hint: 'One uploaded file or photo per record — e.g. a scanned insurance card. Stored on this device (not Drive), and travels with your Backup export.' },
};

/* Per-shape sync-target compatibility. 'ok' offers the target with no
   warning; 'warn' offers it but discloses the degradation before syncing;
   'refuse' doesn't offer it at all — a combination that would silently
   lose or corrupt the data's meaning. */
const SYNC_RULES = {
  table:     { sheets:'ok',    docx:'warn',   calendar:'refuse' },
  notes:     { sheets:'warn',  docx:'ok',     calendar:'refuse' },
  checklist: { sheets:'warn',  docx:'refuse', calendar:'refuse' },
  event:     { sheets:'warn',  docx:'refuse', calendar:'ok' },
  files:     { sheets:'refuse',docx:'refuse', calendar:'refuse' },
};
const SYNC_WARN_MESSAGES = {
  'table|docx':     'This will flatten each record into a plain paragraph in the document — table structure won’t carry over. Sync anyway?',
  'notes|sheets':    'This will put one note per row in a single cell — you’ll lose the longer, readable layout. Sync anyway?',
  'checklist|sheets':'This will flatten checked/unchecked state into plain text columns. Sync anyway?',
  'event|sheets':    'This will sync as a flat log of appointments, not a live calendar. Sync anyway?',
};
const SYNC_TARGET_LABELS = { sheets:'Google Sheets', docx:'Google Docs', calendar:'Google Calendar' };

/* Calendar reminder defaults, in minutes before the event start. An
   all-day event's "start" is midnight, so 900 lands the popup at 9am the
   day before; a timed event's start is the actual time, so 24h before
   reads naturally instead. */
const CALENDAR_REMINDER_MINUTES_ALLDAY = 900;
const CALENDAR_REMINDER_MINUTES_TIMED = 1440;

// The keys live in the Settings window (its first section is headed
// Connections). Messages name the button you actually click.
const NO_ANTHROPIC_KEY_MSG = 'No Anthropic API key set yet — add one in Settings first (⚙ Settings, bottom of the sidebar).';

function uid(prefix){ return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

// Templates shown in the Library. `role` (optional) wires a template's
// instances into the home page cards generically — any module created
// from a role-carrying template counts toward that card, not just the
// first one.
const STARTER_TEMPLATES = [
  { group:'Starters', name:'Checklist', shape:'checklist', fields:[ {id:'title',label:'Item',type:'text'} ] },
  { group:'Starters', name:'Notes', shape:'notes', fields:[] , role:null},
  { group:'Starters', name:'Next Steps', shape:'checklist', role:'next-steps',
    fields:[ {id:'title',label:'Task',type:'text'}, {id:'group',label:'Group tag',type:'text'} ] },
  { group:'Starters', name:'Unanswered Questions', shape:'checklist', role:'unanswered',
    fields:[ {id:'question',label:'Question',type:'text'}, {id:'askedOf',label:'Asked of',type:'text'},
             {id:'status',label:'Status',type:'select',options:['Open','Resolved']} ] },
  { group:'Starters', name:'Files & Photos', shape:'files', fields:[ {id:'title',label:'Title',type:'text'} ] },
  { group:'Starters', name:'Appointments', shape:'event',
    fields:[ {id:'title',label:'What',type:'text'}, {id:'date',label:'Date',type:'date'},
             {id:'time',label:'Time',type:'time'}, {id:'where',label:'Where',type:'text'} ] },
];
const ALL_TEMPLATES = STARTER_TEMPLATES;

function seedState(){
  const s = { modules: [], records: {}, view: {type:'home'},
    settings: { anthropicKey:'', googleClientId:'', googleApiKey:'', spreadsheetId:'',
      exportSchedule:'manual', lastExportedAt:null, dashDueDays:14, dashQuietDays:21 } };
  const seedFrom = (name, tplName) => {
    const tpl = STARTER_TEMPLATES.find(t => t.name === tplName);
    const mod = instantiateModule(s, tpl, name);
    return mod;
  };
  seedFrom('Next Steps', 'Next Steps');
  seedFrom('Unanswered Questions', 'Unanswered Questions');
  seedFrom('Personal Notes', 'Notes');
  return s;
}

function instantiateModule(s, tpl, name){
  const mod = {
    id: uid('m'),
    name: name,
    shape: tpl.shape,
    role: tpl.role || null,
    fields: JSON.parse(JSON.stringify(tpl.fields)),
    createdAt: Date.now(),
  };
  s.modules.push(mod);
  s.records[mod.id] = [];
  return mod;
}

let state = loadState();
function loadState(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      const defaults = { anthropicKey:'', googleClientId:'', googleApiKey:'', spreadsheetId:'', exportSchedule:'manual', lastExportedAt:null, dashDueDays:14, dashQuietDays:21 };
      s.settings = Object.assign({}, defaults, s.settings || {});
      return s;
    }
  } catch(e){ console.warn('Could not read saved data', e); }
  return seedState();
}
function saveState(){
  try { noteDataChange(); } catch(e){ console.warn('Could not check for changes', e); }
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch(e){ console.warn('Could not save data', e); }
}

/* ---------- File storage (IndexedDB) ----------
   File/photo bytes never go through localStorage — its quota is a few MB,
   fine for text and short tables, not for photos (same reasoning PM's own
   design doc gives for staying Sheets-links-only). IndexedDB has real
   room. Only `state` (module/record metadata, including which IDB key a
   record's attachment lives under) persists in localStorage; the bytes
   themselves live here, and travel separately through Backup export as
   base64, not through localStorage at all. */
const IDB_NAME = 'notegoat_files_v1';
const IDB_STORE = 'blobs';
let idbOpenPromise = null;
function openIdb(){
  if (idbOpenPromise) return idbOpenPromise;
  idbOpenPromise = new Promise((resolve, reject) => {
    if (!('indexedDB' in window)){ reject(new Error('This browser doesn\'t support local file storage.')); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE, { keyPath: 'id' }); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return idbOpenPromise;
}
async function idbPutBlob(id, blob, name, mimeType){
  const db = await openIdb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put({ id, blob, name, mimeType });
    tx.oncomplete = () => resolve(id);
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGetBlob(id){
  const db = await openIdb();
  return new Promise((resolve, reject) => {
    const req = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function idbDeleteBlob(id){
  const db = await openIdb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
function blobToBase64(blob){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(blob);
  });
}
// File types safe to open in a tab from a blob: URL (none can run script).
const SAFE_INLINE_MIME = /^(image\/(png|jpe?g|gif|webp|avif|bmp|heic|heif)|application\/pdf|text\/plain)$/;

function base64ToBlob(base64, mimeType){
  const bytes = atob(base64);
  const arr = new Uint8Array(bytes.length);
  for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
  return new Blob([arr], { type: mimeType });
}
function humanFileSize(bytes){
  if (!bytes) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return Math.round(bytes/1024) + ' KB';
  return (bytes/(1024*1024)).toFixed(1) + ' MB';
}

function getModule(id){ return state.modules.find(m => m.id === id); }
function moduleRecords(id){ return state.records[id] || []; }

/* Primary display field for a record: first text-type field, else first field, else null. */
function primaryField(mod){
  return mod.fields.find(f => f.type === 'text') || mod.fields[0] || null;
}
function recordTitle(mod, rec){
  const pf = primaryField(mod);
  if (pf && rec.fields[pf.id]) return String(rec.fields[pf.id]);
  if (rec.notes) return rec.notes.slice(0, 40) + (rec.notes.length > 40 ? '…' : '');
  return '(untitled)';
}
function dateField(mod){ return mod.fields.find(f => f.type === 'date') || null; }
function timeField(mod){ return mod.fields.find(f => f.type === 'time') || null; }

/* ---------- Links & backlinks ----------
   A link field's value is a record id (link-one) or array of record ids
   (link-many), always chosen manually by the person — never inferred.
   Backlinks are computed on demand by scanning every module's records for
   a link field pointing at the record in question, rather than kept as a
   separately-maintained reverse index — same end result (a record can show
   what points at it), simpler to keep correct at this scale. */
function findRecordById(moduleId, recId){
  return moduleRecords(moduleId).find(r => r.id === recId) || null;
}
function linkFieldValueIds(f, rec){
  const v = rec.fields[f.id];
  if (f.type === 'link-many') return Array.isArray(v) ? v : [];
  return v ? [v] : [];
}
function getBacklinks(targetMod, targetRec){
  const out = [];
  state.modules.forEach(mod => {
    mod.fields.filter(f => f.type === 'link-one' || f.type === 'link-many').forEach(f => {
      if (f.targetModuleId !== targetMod.id) return;
      moduleRecords(mod.id).forEach(rec => {
        if (linkFieldValueIds(f, rec).includes(targetRec.id)) out.push({ mod, rec, field: f });
      });
    });
  });
  return out;
}
function backlinksForModule(mod){
  // Every backlink pointing at any record currently in this module — used
  // for the module-delete warning.
  let count = 0;
  moduleRecords(mod.id).forEach(rec => { count += getBacklinks(mod, rec).length; });
  return count;
}
function linkFieldDisplay(f, rec){
  const targetMod = getModule(f.targetModuleId);
  if (!targetMod) return '—';
  const ids = linkFieldValueIds(f, rec);
  if (!ids.length) return '—';
  const titles = ids.map(id => {
    const r = findRecordById(targetMod.id, id);
    return r ? recordTitle(targetMod, r) : '(linked record no longer exists)';
  });
  return titles.join(', ');
}

/* =========================================================
   Rendering
   ========================================================= */
const mainArea = document.getElementById('mainArea');
const moduleListEl = document.getElementById('moduleList');
const modalRoot = document.getElementById('modalRoot');

let lastViewKey = null;
function render(){
  saveState();
  renderSidebar();
  if (state.view.type === 'home') renderHome();
  else if (state.view.type === 'dashboard') renderDashboard();
  else if (state.view.type === 'module') renderModule(state.view.moduleId);
  mainArea.prepend(syncBarEl);
  // Going to a different page starts at its top; re-rendering the same
  // page (ticking a box, opening a card) keeps your place.
  const viewKey = state.view.type + ':' + (state.view.moduleId || '');
  if (lastViewKey !== null && viewKey !== lastViewKey){ window.scrollTo(0, 0); mainArea.scrollTop = 0; }
  lastViewKey = viewKey;
}

function renderSidebar(){
  const homeBtn = document.getElementById('homeNavBtn');
  homeBtn.classList.toggle('active', state.view.type === 'home');
  document.getElementById('dashboardNavBtn').classList.toggle('active', state.view.type === 'dashboard');
  const setCurrent = (b, on) => { if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); };
  setCurrent(homeBtn, state.view.type === 'home');
  setCurrent(document.getElementById('dashboardNavBtn'), state.view.type === 'dashboard');

  moduleListEl.innerHTML = '';
  state.modules.forEach(mod => {
    const row = document.createElement('div');
    row.className = 'module-row' + (state.view.type === 'module' && state.view.moduleId === mod.id ? ' active' : '');
    const btn = document.createElement('button');
    btn.className = 'nav-btn';
    btn.innerHTML = '<span class="dot" style="background:' + colorForKey(mod.name) + '"></span>' + escapeHtml(mod.name);
    btn.onclick = () => { state.view = {type:'module', moduleId: mod.id}; render(); };
    if (state.view.type === 'module' && state.view.moduleId === mod.id) btn.setAttribute('aria-current', 'page');
    const gear = document.createElement('button');
    gear.className = 'gear'; gear.title = 'Edit module'; gear.textContent = '⚙';
    gear.setAttribute('aria-label', 'Edit module ' + mod.name);
    gear.onclick = (e) => { e.stopPropagation(); openSchemaModal(mod); };
    row.appendChild(btn); row.appendChild(gear);
    moduleListEl.appendChild(row);
  });
}

homeNavBtnListener();
function homeNavBtnListener(){
  document.getElementById('homeNavBtn').onclick = () => { state.view = {type:'home'}; render(); };
  document.getElementById('dashboardNavBtn').onclick = () => { state.view = {type:'dashboard'}; render(); };
  document.getElementById('openLibraryBtn').onclick = () => openLibraryModal();
  document.getElementById('openConnectionsBtn').onclick = () => openConnectionsModal();
}

/* ---------- Home ---------- */
let cardOpenState = { capture:true, coming:false, next:false, unanswered:false };

function renderHome(){
  mainArea.innerHTML = '';
  const title = el('div', 'page-title', 'Home');
  const sub = el('div', 'page-sub', 'What’s pending, at a glance.');
  mainArea.appendChild(title); mainArea.appendChild(sub);

  const cards = el('div', 'cards');
  cards.appendChild(renderQuickCaptureCard());
  cards.appendChild(renderComingUpCard());
  cards.appendChild(renderNextStepsCard());
  cards.appendChild(renderUnansweredCard());
  mainArea.appendChild(cards);

  const roadmap = el('div', 'roadmap-note',
    'Add your Anthropic and Google keys under Settings to light up AI capture, AI-assisted module setup, and Sheets/Docs/Calendar sync. Click Manual for a full walkthrough of every feature.');
  mainArea.appendChild(roadmap);
}

function personalNotesModule(){
  return state.modules.find(m => m.role === 'personal-notes') || null;
}
function findFirstNotesModule(){
  // Fallback: any 'notes' shape module, in case the role tag was lost.
  return state.modules.find(m => m.role === 'personal-notes') || state.modules.find(m => m.shape === 'notes');
}

function renderQuickCaptureCard(){
  const card = el('div', 'card open');
  const body = el('div', 'quick-capture');
  const label = el('div', 'card-title', 'Quick capture');
  const hint = el('div', 'quick-capture-hint', 'Jot something down, or attach a photo of messy notes and let AI turn it into one clean, organized note — review it before it saves.');
  const ta = document.createElement('textarea');
  ta.placeholder = 'Type or paste a quick note…';
  body.appendChild(label); body.appendChild(hint); body.appendChild(ta);

  const photoRow = el('div', ''); photoRow.style.marginTop = '8px'; photoRow.style.display = 'flex'; photoRow.style.alignItems = 'center'; photoRow.style.gap = '10px';
  const fileInput = document.createElement('input'); fileInput.type = 'file'; fileInput.accept = 'image/*'; fileInput.style.display = 'none';
  const attachBtn = buttonEl('📷 Attach photo', 'btn-secondary', () => fileInput.click());
  const thumb = document.createElement('img'); thumb.style.height = '32px'; thumb.style.borderRadius = '6px'; thumb.style.display = 'none';
  let photoData = null; // {base64, mediaType}
  fileInput.onchange = async () => {
    const file = fileInput.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      photoData = { base64: dataUrl.split(',')[1], mediaType: file.type };
      thumb.src = dataUrl; thumb.style.display = 'inline-block';
    };
    reader.readAsDataURL(file);
  };
  photoRow.appendChild(fileInput); photoRow.appendChild(attachBtn); photoRow.appendChild(thumb);
  body.appendChild(photoRow);

  const errBox = el('div', ''); body.appendChild(errBox);

  const row = el('div', 'quick-capture-row');
  const aiBtn = buttonEl('✨ Clean up with AI', 'btn-secondary', async () => {
    if (!state.settings.anthropicKey){
      errBox.innerHTML = ''; errBox.appendChild(el('div', 'error-box', NO_ANTHROPIC_KEY_MSG));
      return;
    }
    if (!ta.value.trim() && !photoData){
      alert('Type something or attach a photo first.');
      return;
    }
    const origText = aiBtn.textContent; aiBtn.disabled = true; aiBtn.textContent = 'Reading…'; errBox.innerHTML = '';
    try {
      const cleaned = await cleanUpCapture(ta.value.trim(), photoData);
      ta.value = cleaned; // shown for review — not saved yet
    } catch(err){
      const msg = err.message === 'NO_KEY' ? NO_ANTHROPIC_KEY_MSG
        : 'Couldn\'t clean this up (' + err.message + '). Your original text is untouched — you can still save it as-is.';
      errBox.appendChild(el('div', 'error-box', msg));
    } finally {
      aiBtn.disabled = false; aiBtn.textContent = origText;
    }
  });
  const saveBtn = document.createElement('button');
  saveBtn.className = 'btn btn-primary'; saveBtn.textContent = 'Save note';
  saveBtn.onclick = () => {
    const val = ta.value.trim();
    if (!val) return;
    const mod = findFirstNotesModule();
    if (!mod){ alert('Add a Notes module from the Library first.'); return; }
    state.records[mod.id].push({ id: uid('r'), fields:{}, notes: val, createdAt: Date.now(), updatedAt: Date.now() });
    ta.value = ''; photoData = null; thumb.style.display = 'none'; fileInput.value = '';
    render();
  };
  row.appendChild(aiBtn);
  row.appendChild(saveBtn);
  body.appendChild(row);
  card.appendChild(body);
  return card;
}

async function cleanUpCapture(text, photoData){
  const system = [
    'You clean up someone\'s messy captured notes (typed shorthand, or notes photographed off paper) into one clean, organized, legible note.',
    'Reorganize and clarify — fix obvious structure, group related points, spell out clear abbreviations — but do not invent facts, dates, names, or details that aren\'t actually there or clearly implied.',
    'If part of the photo or text is genuinely illegible or unclear, say so briefly in the note rather than guessing or silently leaving it out.',
    'Respond with only the cleaned-up note itself — no preamble, no "Here is your cleaned up note:", nothing else.',
  ].join('\n');
  const content = [];
  content.push({ type: 'text', text: text ? ('Raw notes:\n' + text) : 'Read the attached photo of handwritten/typed notes and clean them up.' });
  if (photoData) content.push({ type: 'image', source: { type: 'base64', media_type: photoData.mediaType, data: photoData.base64 } });
  return (await callClaude({ system, userContent: content, maxTokens: 800 })).trim();
}

function collapsibleCard(key, title, countText, previewText, bodyRenderer, openState){
  const st = openState || cardOpenState;
  const isOpen = st[key];
  const card = el('div', 'card' + (isOpen ? ' open' : ''));
  const head = el('div', 'card-head');
  const left = el('div', 'card-head-left');
  left.appendChild(el('div', 'card-title', title));
  left.appendChild(el('div', 'card-preview', previewText));
  head.appendChild(left);
  const right = el('div', '');
  right.style.display='flex'; right.style.alignItems='center'; right.style.gap='10px';
  right.appendChild(el('div', 'card-count', countText));
  right.appendChild(el('div', 'card-chevron', '›'));
  head.appendChild(right);
  head.dataset.cardKey = key;
  makeActivatable(head, () => {
    st[key] = !st[key];
    render();
    // render() rebuilds the page, so put keyboard focus back on this header.
    const again = mainArea.querySelector('[data-card-key="' + key + '"]');
    if (again && document.activeElement === document.body) again.focus();
  });
  head.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  card.appendChild(head);
  const body = el('div', 'card-body');
  bodyRenderer(body);
  card.appendChild(body);
  return card;
}

/* Coming up and Next steps read every module, using the same field
   conventions as the Dashboard (Due = field id "due", else the module's
   first Date field; Next step = id "next" or label "Next step"; Done =
   rec.fields.done). */
function renderComingUpCard(){
  const today = localIsoDate(new Date());
  const items = [];
  state.modules.forEach(mod => {
    moduleRecords(mod.id).forEach(rec => {
      const date = dueValueOf(mod, rec);
      if (!date || isDone(rec)) return;
      // A past date in a Dated / scheduled module is an appointment that
      // already happened, so it drops off. Anywhere else a past date is
      // something still open, so it stays at the top instead of vanishing.
      const past = date < today;
      if (past && mod.shape === 'event') return;
      items.push({ mod, rec, date, past });
    });
  });
  items.sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  const when = i => (i.past ? 'was due ' : '') + formatDate(i.date);
  const first = items[0];
  const preview = first ? (recordTitle(first.mod, first.rec) + ', ' + when(first) +
    (items.length > 1 ? ' — ' + (items.length - 1) + ' more' : '')) : 'Nothing scheduled';
  return collapsibleCard('coming', 'Coming up', String(items.length), preview, (body) => {
    if (!items.length){ body.appendChild(el('div','empty','Nothing scheduled yet.')); return; }
    items.forEach(i => body.appendChild(itemRow(i.mod, i.rec, when(i).replace(/^was/, 'Was'))));
  });
}

function renderNextStepsCard(){
  const rows = [];
  // Next Steps–template modules: their items are the steps, tickable here.
  state.modules.filter(m => m.role === 'next-steps').forEach(mod => {
    moduleRecords(mod.id).forEach(rec => { if (!rec.fields.done) rows.push({ mod, rec, tick: true }); });
  });
  // Every other module: records with a Next step filled in.
  state.modules.filter(m => m.role !== 'next-steps').forEach(mod => {
    moduleRecords(mod.id).forEach(rec => {
      const next = nextValueOf(mod, rec);
      if (next && !isDone(rec)) rows.push({ mod, rec, next });
    });
  });
  const preview = rows.length ? recordTitle(rows[0].mod, rows[0].rec) + (rows.length > 1 ? ' — ' + (rows.length-1) + ' more' : '') : 'Nothing pending';
  return collapsibleCard('next', 'Next steps', String(rows.length), preview, (body) => {
    if (!rows.length){ body.appendChild(el('div','empty','Nothing pending.')); return; }
    rows.forEach(({mod, rec, tick, next}) => {
      if (!tick){
        const due = dueValueOf(mod, rec);
        const row = itemRow(mod, rec, (due ? 'Due ' + formatDate(due) + ' · ' : '') + 'Next: ' + next);
        row.querySelector('.type-dot').style.background = colorForKey(mod.name);
        body.appendChild(row);
        return;
      }
      const row = el('div', 'checklist-row');
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!rec.fields.done;
      cb.setAttribute('aria-label', 'Done: ' + recordTitle(mod, rec));
      cb.onchange = () => { rec.fields.done = cb.checked; rec.updatedAt = Date.now(); render(); };
      row.appendChild(cb);
      const dot = el('span', 'type-dot', '');
      dot.style.background = colorForKey(rec.fields.group || mod.name);
      dot.style.display = 'inline-block';
      row.appendChild(dot);
      const titleSpan = el('span', 'cl-title', recordTitle(mod, rec));
      titleSpan.style.cursor='pointer';
      makeActivatable(titleSpan, () => openRecordModal(mod, rec));
      row.appendChild(titleSpan);
      if (rec.fields.group) row.appendChild(el('span', 'tag-chip', rec.fields.group));
      body.appendChild(row);
    });
  });
}

function renderUnansweredCard(){
  const rows = [];
  state.modules.filter(m => m.role === 'unanswered').forEach(mod => {
    moduleRecords(mod.id).forEach(rec => { if ((rec.fields.status || 'Open') === 'Open') rows.push({mod, rec}); });
  });
  const preview = rows.length ? recordTitle(rows[0].mod, rows[0].rec) + (rows.length > 1 ? ' — ' + (rows.length-1) + ' more' : '') : 'Nothing open';
  return collapsibleCard('unanswered', 'Unanswered questions', String(rows.length), preview, (body) => {
    if (!rows.length){ body.appendChild(el('div','empty','Nothing open.')); return; }
    rows.forEach(({mod, rec}) => body.appendChild(itemRow(mod, rec, rec.fields.askedOf ? ('Asked: ' + rec.fields.askedOf) : '')));
  });
}

function itemRow(mod, rec, metaText){
  const row = el('div', 'item-row');
  row.appendChild(el('span', 'type-dot', ''));
  const mainDiv = el('div', 'item-main');
  const t = el('div', 'item-title', recordTitle(mod, rec));
  makeActivatable(t, () => openRecordModal(mod, rec));
  mainDiv.appendChild(t);
  mainDiv.appendChild(el('div', 'item-meta', mod.name + (metaText ? ' · ' + metaText : '')));
  row.appendChild(mainDiv);
  return row;
}

/* Something clickable that isn't a <button>: make it reachable with Tab,
   announced as a button by screen readers, and usable with Enter / Space. */
function makeActivatable(node, onActivate){
  node.setAttribute('role', 'button');
  node.tabIndex = 0;
  node.onclick = onActivate;
  node.onkeydown = (e) => {
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); onActivate(e); }
  };
  return node;
}

/* ---------- Dashboard ----------
   One screen across every module. It only reads records — nothing is
   added to module or record shapes. Which field means what is found by
   convention (see the Manual and DESIGN.md), never configured:
   Due date = field id "due", else the module's first Date field.
   Next step = field id "next" or label "Next step".
   List = Choice list field with id "list" or label "List".
   Done = rec.fields.done is true. */
let dashOpenState = { overdue:true, soon:true, quiet:true, next:true };

function dueFieldOf(mod){ return mod.fields.find(f => f.id === 'due') || dateField(mod); }
function nextFieldOf(mod){ return mod.fields.find(f => f.id === 'next' || String(f.label || '').trim().toLowerCase() === 'next step') || null; }
function listFieldOf(mod){ return mod.fields.find(f => f.type === 'select' && (f.id === 'list' || String(f.label || '').trim().toLowerCase() === 'list')) || null; }
function isDone(rec){ return rec.fields.done === true; }
// Next step set to a placeholder ("—" / "None set"): left out of Gone quiet.
function nextIsPlaceholder(mod, rec){
  const f = nextFieldOf(mod);
  if (!f) return false;
  const v = String(rec.fields[f.id] == null ? '' : rec.fields[f.id]).trim();
  return v === '—' || v.toLowerCase() === 'none set';
}
// A Choice list with nothing picked shows its first option in the form, so count it as that.
function listValueOf(mod, rec){
  const lf = listFieldOf(mod);
  if (!lf) return null;
  return rec.fields[lf.id] || (lf.options || [])[0] || null;
}
function dueValueOf(mod, rec){
  const f = dueFieldOf(mod);
  const v = f ? rec.fields[f.id] : null;
  return (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) ? v : null;
}
function nextValueOf(mod, rec){
  const f = nextFieldOf(mod);
  const v = f ? String(rec.fields[f.id] == null ? '' : rec.fields[f.id]).trim() : '';
  if (!v || v === '—' || v.toLowerCase() === 'none set') return null;
  return v;
}
// Local calendar date, not UTC, so "today" matches the person's own day.
function localIsoDate(d){
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function dashDays(key, fallback){
  const n = parseInt(state.settings[key], 10);
  return Number.isFinite(n) && n >= 0 ? n : fallback;
}

function dashRow(mod, rec){
  const due = dueValueOf(mod, rec), next = nextValueOf(mod, rec);
  const meta = [];
  if (due) meta.push('Due ' + formatDate(due));
  if (next) meta.push('Next: ' + next);
  return itemRow(mod, rec, meta.join(' · '));
}

function renderDashboard(){
  mainArea.innerHTML = '';
  mainArea.appendChild(el('div', 'page-title', 'Dashboard'));
  mainArea.appendChild(el('div', 'page-sub', 'Everything across all modules, on one screen.'));

  const dueDays = dashDays('dashDueDays', 14);
  const quietDays = dashDays('dashQuietDays', 21);

  // Settings for N and M — saved on this device only, like the rest of Settings.
  const controls = el('div', 'dash-controls');
  const numInput = (labelText, key, value) => {
    // An empty or negative entry is ignored and the box shows the last good
    // value again; the open/closed state of the sections below is kept.
    const lab = el('label', '');
    lab.appendChild(document.createTextNode(labelText));
    const inp = document.createElement('input');
    inp.type = 'number'; inp.min = '0'; inp.step = '1'; inp.inputMode = 'numeric'; inp.value = String(value);
    inp.onchange = () => {
      const n = parseInt(inp.value, 10);
      if (Number.isFinite(n) && n >= 0) state.settings[key] = n;
      render();
    };
    lab.appendChild(inp);
    lab.appendChild(document.createTextNode('days'));
    return lab;
  };
  controls.appendChild(numInput('Due soon: next', 'dashDueDays', dueDays));
  controls.appendChild(numInput('Gone quiet: no change in', 'dashQuietDays', quietDays));
  mainArea.appendChild(controls);

  const all = [];
  state.modules.forEach(mod => moduleRecords(mod.id).forEach(rec => all.push({ mod, rec })));

  // (1) Area cards
  const grid = el('div', 'dash-grid');
  state.modules.forEach(mod => {
    const recs = moduleRecords(mod.id);
    if (!recs.length) return;
    const card = el('div', 'card');
    const head = el('div', 'card-head');
    const left = el('div', 'card-head-left');
    const titleRow = el('div', 'card-title');
    const dot = el('span', 'type-dot', '');
    dot.style.background = colorForKey(mod.name); dot.style.marginRight = '7px';
    titleRow.appendChild(dot);
    titleRow.appendChild(document.createTextNode(mod.name));
    left.appendChild(titleRow);
    const lf = listFieldOf(mod);
    if (lf){
      const counts = (lf.options || []).map(opt => opt + ' ' + recs.filter(r => listValueOf(mod, r) === opt).length);
      left.appendChild(el('div', 'card-preview', counts.join(' · ')));
    }
    head.appendChild(left);
    head.appendChild(el('div', 'card-count', String(recs.length)));
    makeActivatable(head, () => { state.view = {type:'module', moduleId: mod.id}; render(); });
    head.setAttribute('aria-label', 'Open ' + mod.name + ', ' + recs.length + ' record' + (recs.length === 1 ? '' : 's'));
    card.appendChild(head);
    grid.appendChild(card);
  });
  if (grid.children.length) mainArea.appendChild(grid);

  const today = localIsoDate(new Date());
  const soonEnd = new Date(); soonEnd.setDate(soonEnd.getDate() + dueDays);
  const soonLimit = localIsoDate(soonEnd);
  const quietCutoff = Date.now() - quietDays * 86400000;

  const withDue = all.map(i => Object.assign({ due: dueValueOf(i.mod, i.rec) }, i)).filter(i => i.due && !isDone(i.rec));
  const overdue = withDue.filter(i => i.due < today).sort((a,b) => a.due < b.due ? -1 : a.due > b.due ? 1 : 0);
  const soon = withDue.filter(i => i.due >= today && i.due <= soonLimit).sort((a,b) => a.due < b.due ? -1 : a.due > b.due ? 1 : 0);
  const quiet = all.map(i => Object.assign({ ts: i.rec.updatedAt || i.rec.createdAt || 0 }, i))
    .filter(i => i.ts && i.ts < quietCutoff && !isDone(i.rec) && listValueOf(i.mod, i.rec) !== 'Unclear' && !nextIsPlaceholder(i.mod, i.rec))
    .sort((a,b) => a.ts - b.ts);
  const nexts = all.filter(i => nextValueOf(i.mod, i.rec));

  const preview = (list, emptyText) => list.length
    ? recordTitle(list[0].mod, list[0].rec) + (list.length > 1 ? ' — ' + (list.length - 1) + ' more' : '')
    : emptyText;
  const section = (key, title, list, emptyText, bodyFn) =>
    collapsibleCard(key, title, String(list.length), preview(list, emptyText), (body) => {
      if (!list.length){ body.appendChild(el('div', 'empty', emptyText)); return; }
      bodyFn(body);
    }, dashOpenState);

  const cards = el('div', 'cards');
  cards.appendChild(section('overdue', 'Overdue', overdue, 'Nothing overdue.',
    body => overdue.forEach(i => body.appendChild(dashRow(i.mod, i.rec)))));
  cards.appendChild(section('soon', 'Due soon — next ' + dueDays + ' day' + (dueDays === 1 ? '' : 's'), soon, 'Nothing due soon.',
    body => soon.forEach(i => body.appendChild(dashRow(i.mod, i.rec)))));
  cards.appendChild(section('quiet', 'Gone quiet — no change in ' + quietDays + ' day' + (quietDays === 1 ? '' : 's'), quiet, 'Nothing has gone quiet.',
    body => quiet.forEach(i => body.appendChild(dashRow(i.mod, i.rec)))));
  cards.appendChild(section('next', 'Next steps', nexts, 'No next steps set.', body => {
    state.modules.forEach(mod => {
      const rows = nexts.filter(i => i.mod === mod);
      if (!rows.length) return;
      body.appendChild(el('div', 'dash-group-label', mod.name));
      rows.forEach(i => body.appendChild(dashRow(i.mod, i.rec)));
    });
  }));
  mainArea.appendChild(cards);
}

/* ---------- Module view ---------- */
function renderModule(moduleId){
  const mod = getModule(moduleId);
  if (!mod){ state.view = {type:'home'}; renderHome(); return; }
  mainArea.innerHTML = '';
  mainArea.appendChild(el('div', 'page-title', mod.name));
  mainArea.appendChild(el('div', 'page-sub', SHAPES[mod.shape].label));

  const toolbar = el('div', 'module-toolbar');
  const actions = el('div', 'module-toolbar-actions');
  const addBtn = document.createElement('button');
  addBtn.className = 'btn btn-primary'; addBtn.textContent = '+ Add record';
  addBtn.onclick = () => openRecordModal(mod, null);
  const editBtn = document.createElement('button');
  editBtn.className = 'btn btn-secondary'; editBtn.textContent = 'Edit module';
  editBtn.onclick = () => openSchemaModal(mod);
  const syncBtn = document.createElement('button');
  syncBtn.className = 'btn btn-secondary'; syncBtn.textContent = 'Sync';
  syncBtn.onclick = () => openSyncModal(mod);
  actions.appendChild(addBtn); actions.appendChild(editBtn); actions.appendChild(syncBtn);
  toolbar.appendChild(el('div','',''));
  toolbar.appendChild(actions);
  mainArea.appendChild(toolbar);

  const records = moduleRecords(mod.id);
  if (!records.length){
    const empty = el('div', 'empty-state');
    empty.appendChild(el('p', '', 'No records yet.'));
    const btn = document.createElement('button');
    btn.className = 'btn btn-primary'; btn.textContent = '+ Add the first one';
    btn.onclick = () => openRecordModal(mod, null);
    empty.appendChild(btn);
    mainArea.appendChild(empty);
    return;
  }

  if (mod.shape === 'checklist'){
    mainArea.appendChild(renderChecklistView(mod, records));
  } else if (mod.shape === 'notes'){
    mainArea.appendChild(renderNotesView(mod, records));
  } else if (mod.shape === 'event'){
    mainArea.appendChild(renderTableView(mod, records, true));
  } else if (mod.shape === 'files'){
    mainArea.appendChild(renderFilesView(mod, records));
  } else {
    mainArea.appendChild(renderTableView(mod, records, false));
  }
}

function renderFilesView(mod, records){

    thumbWrap.style.alignItems = 'center'; thumbWrap.style.justifyContent = 'center';
    thumbWrap.style.background = 'var(--surface-sunk)'; thumbWrap.style.borderRadius = '8px'; thumbWrap.style.marginBottom = '8px';
    thumbWrap.style.fontSize = '32px';
    thumbWrap.textContent = rec.attachment && (rec.attachment.mimeType || '').startsWith('image/') ? '' : (rec.attachment ? '📎' : '—');

function renderChecklistView(mod, records){
  const wrap = el('div', 'record-cards');

function renderNotesView(mod, records){

function renderTableView(mod, records, isEvent){
  let recs = records.slice();
  if (isEvent){
    const df = dateField(mod);
    if (df) recs.sort((a,b) => (a.fields[df.id]||'') < (b.fields[df.id]||'') ? -1 : 1);
  }
  const table = document.createElement('table');
  table.className = 'record-table';
  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  mod.fields.forEach(f => { const th = document.createElement('th'); th.textContent = f.label; trh.appendChild(th); });
  trh.appendChild(el('th','','Notes'));
  trh.appendChild(el('th','',''));
  thead.appendChild(trh); table.appendChild(thead);
  const tbody = document.createElement('tbody');
  recs.forEach(rec => {
    const tr = document.createElement('tr');
    mod.fields.forEach(f => {
      const td = document.createElement('td');

        // (and counts as it on the Dashboard), so show the same here.
        if (f.type === 'select' && !v) v = (f.options || [])[0];
        td.textContent = v || '—';
      }
      tr.appendChild(td);
    });
    const noteTd = document.createElement('td');

    tr.appendChild(noteTd);

    actTd.appendChild(iconBtn('Edit', () => openRecordModal(mod, rec)));
    tr.appendChild(actTd);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  const wrap = el('div', 'table-wrap');
  wrap.appendChild(table);
  return wrap;
}

function iconBtn(label, onclick){
  const b = document.createElement('button');
  b.className = 'btn-text'; b.textContent = label; b.onclick = onclick;
  return b;
}

/* =========================================================
   Modals
   ========================================================= */
/* The open modal's context. `isDirty` (optional) says whether there are
   unsaved changes; `returnFocus` is where keyboard focus goes back to when
   the modal closes. */
let modalCtx = null;

function openModal(titleText, bodyBuilder, footButtons, opts){
  // Opening one modal straight from another (Library → name it) keeps the
  // original place to return focus to.
  const returnFocus = (modalCtx && modalCtx.returnFocus) || document.activeElement;
  modalRoot.innerHTML = '';
  const backdrop = el('div', 'modal-backdrop');
  const modal = el('div', 'modal');
  modal.setAttribute('role', 'dialog');
  modal.setAttribute('aria-modal', 'true');
  const head = el('div', 'modal-head');
  const h2 = el('h2', '', titleText);
  h2.id = uid('dlg');
  modal.setAttribute('aria-labelledby', h2.id);
  head.appendChild(h2);
  const closeBtn = document.createElement('button');
  closeBtn.className = 'modal-close'; closeBtn.textContent = '✕';
  closeBtn.setAttribute('aria-label', 'Close');
  closeBtn.onclick = requestCloseModal;
  head.appendChild(closeBtn);
  modal.appendChild(head);
  const body = el('div', 'modal-body');
  bodyBuilder(body);
  // Any label in a field group that isn't tied to its field yet gets tied
  // to the group's first field, so screen readers read them together.
  body.querySelectorAll('.field-group').forEach(grp => {
    const lab = grp.querySelector(':scope > label.field-label');
    if (!lab || lab.htmlFor || lab.id) return; // already tied (htmlFor), or names a group (id)
    const field = grp.querySelector('input:not([type=hidden]):not([type=file]), select, textarea');
    if (field && !field.id && !field.getAttribute('aria-labelledby')) linkLabel(lab, field);
  });
  modal.appendChild(body);
  if (footButtons && footButtons.length){
    const foot = el('div', 'modal-foot');
    footButtons.forEach(b => foot.appendChild(b));
    modal.appendChild(foot);
  }
  backdrop.appendChild(modal);
  backdrop.onclick = (e) => { if (e.target === backdrop) requestCloseModal(); };
  modalRoot.appendChild(backdrop);
  modalCtx = { isDirty: (opts && opts.isDirty) || null, returnFocus };
  // Start keyboard focus inside the box: first field, else first button.
  const first = body.querySelector('input:not([type=hidden]):not([disabled]):not([style*="display: none"]), select:not([disabled]), textarea:not([disabled]), button:not([disabled])')
    || modal.querySelector('.modal-foot button') || closeBtn;
  // On touch screens, don't pop the on-screen keyboard just for opening a
  // record — focus the close button instead (screen readers still land in
  // the box).
  const target = (window.matchMedia && matchMedia('(pointer: coarse)').matches) ? closeBtn : first;
  try { target.focus({ preventScroll: true }); } catch(e){}
}
function closeModal(){
  modalRoot.innerHTML = '';
  const back = modalCtx && modalCtx.returnFocus;
  modalCtx = null;
  if (back && back.isConnected && typeof back.focus === 'function'){ try { back.focus({ preventScroll: true }); } catch(e){} }
}
/* Closing without saving — ✕, a click outside the box, or Escape. If the
   box has unsaved changes, ask first instead of silently dropping them.
   (The Cancel button is the explicit "throw this away" and doesn't ask.) */
async function requestCloseModal(){
  if (!modalRoot.firstChild) return;
  if (modalCtx && modalCtx.isDirty && modalCtx.isDirty()){
    const ok = await confirmModal('You have unsaved changes. Close without saving them?');
    if (!ok) return;
  }
  closeModal();
}

/* Keyboard: Escape closes the top-most box (a confirm first, then the
   modal, then the Manual); Tab stays inside an open box. */
document.addEventListener('keydown', (e) => {
  const manual = document.getElementById('manualOverlay');
  const layers = modalRoot.querySelectorAll(':scope > .modal-backdrop');
  const top = layers.length ? layers[layers.length - 1] : null;
  if (e.key === 'Escape'){
    if (top){
      e.preventDefault();
      if (top._cancel) top._cancel(); else requestCloseModal();
    } else if (manual && manual.classList.contains('open')){
      e.preventDefault();
      closeManual();
    }
    return;
  }
  if (e.key === 'Tab' && top){
    const focusables = Array.from(top.querySelectorAll('button, input, select, textarea, [tabindex]:not([tabindex="-1"])'))
      .filter(n => !n.disabled && n.offsetParent !== null);
    if (!focusables.length) return;
    const firstEl = focusables[0], lastEl = focusables[focusables.length - 1];
    if (!top.contains(document.activeElement)){ e.preventDefault(); firstEl.focus(); }
    else if (e.shiftKey && document.activeElement === firstEl){ e.preventDefault(); lastEl.focus(); }
    else if (!e.shiftKey && document.activeElement === lastEl){ e.preventDefault(); firstEl.focus(); }
  }
});

/* Lightweight styled confirm, returns a Promise<boolean>. Appended as an
   overlay on top of modalRoot rather than replacing it, so confirming or
   cancelling a nested "are you sure" step (e.g. inside the schema editor)
   doesn't destroy the modal underneath it. */
function confirmModal(message){
  return new Promise(resolve => {
    const overlay = el('div', 'modal-backdrop');
    overlay.style.zIndex = '60';
    const modal = el('div', 'modal');
    modal.style.maxWidth = '420px';
    modal.setAttribute('role', 'alertdialog');
    modal.setAttribute('aria-modal', 'true');
    const head = el('div', 'modal-head');
    const h2 = el('h2', '', 'Are you sure?');
    h2.id = uid('dlg');
    modal.setAttribute('aria-labelledby', h2.id);
    head.appendChild(h2);
    modal.appendChild(head);
    const body = el('div', 'modal-body');
    const msgDiv = document.createElement('div');
    msgDiv.className = 'confirm-msg';
    msgDiv.innerHTML = message;
    body.appendChild(msgDiv);
    modal.appendChild(body);
    msgDiv.id = uid('dlg');
    modal.setAttribute('aria-describedby', msgDiv.id);
    const returnFocus = document.activeElement;
    const finish = (answer) => {
      overlay.remove();
      if (returnFocus && returnFocus.isConnected){ try { returnFocus.focus({ preventScroll: true }); } catch(e){} }
      resolve(answer);
    };
    const foot = el('div', 'modal-foot');
    const cancelBtn = buttonEl('Cancel', 'btn-secondary', () => finish(false));
    foot.appendChild(cancelBtn);
    foot.appendChild(buttonEl('Continue', 'btn-danger', () => finish(true)));
    modal.appendChild(foot);
    overlay.appendChild(modal);
    overlay.onclick = (e) => { if (e.target === overlay) finish(false); };
    overlay._cancel = () => finish(false); // Escape
    modalRoot.appendChild(overlay);
    // Safer default: Enter on an "are you sure" answers Cancel.
    try { cancelBtn.focus({ preventScroll: true }); } catch(e){}
  });
}
function buttonEl(text, cls, onclick){
  const b = document.createElement('button');
  b.className = 'btn ' + cls; b.textContent = text; b.onclick = onclick;
  return b;
}

/* ---------- AI-assisted module creation ----------
   The AI's job here is the same as everywhere else in this app: propose,

function openAIModuleDialog(){

      'Tell the AI what you want to track — it\'ll propose a name, the right kind of fields, and links to your existing modules where that makes sense. You review and adjust everything before it\'s created.'));

    ta.style.minHeight = '90px';

  }, [
    buttonEl('Cancel', 'btn-secondary', closeModal),
    buttonEl('Ask AI', 'btn-primary', async (e) => {
      const body = document.querySelector('.modal-body');

      if (!desc){ alert('Describe what you need first.'); return; }
      if (!state.settings.anthropicKey){
        body._errBox.innerHTML = '';
        body._errBox.appendChild(el('div', 'error-box', NO_ANTHROPIC_KEY_MSG));
        return;
      }
      const btn = e.target; const origText = btn.textContent;
      btn.disabled = true; btn.textContent = 'Thinking…';
