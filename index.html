<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Note Goat</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="icon" href="icons/icon-192.png" />
<meta name="theme-color" content="#2C6E7E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Note Goat" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js"></script>
<style>
:root{
  /* Interface panels — solid, calm, easy to read. The stripes live in the
     page background only; nothing you have to read sits on top of them. */
  --panel: #FFFCF5;
  --surface: #FFFFFF;
  --surface-sunk: #F3EEE1;
  --ink: #2B2A27;
  --ink-dim: #6E6A62;
  --ink-faint: #9A958A;
  --line: #E9E2D2;
  --line-strong: #DCD1B6;
  --accent: #2C6E7E;
  --accent-soft: rgba(44,110,126,0.12);
  --accent-ink: #1F4E5A;
  --warn: #A8843F;
  --warn-soft: rgba(168,132,63,0.14);
  --danger: #A13E63;
  --danger-soft: rgba(161,62,99,0.1);
  --font: 'Inter', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
  --radius: 10px;

  /* Watercolor stripe palette — pulled from the reference swatch. Used for
     the page background and, sparingly, for per-item type-color dots. */
  --wc-1: #2FB4C2; /* turquoise */
  --wc-2: #3E6FA6; /* blue */
  --wc-3: #2C7A68; /* teal */
  --wc-4: #A13E63; /* magenta */
  --wc-5: #7C8A4A; /* olive */
  --wc-6: #C39A52; /* gold */
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  color:var(--ink);
  font-family:var(--font);
  font-size:14px;
  line-height:1.5;
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:22px;
  background:
    linear-gradient(rgba(255,255,255,0.32), rgba(255,255,255,0.32)),
    url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27312%27%20height%3D%27400%27%20viewBox%3D%270%200%20312%20400%27%3E%0A%3Cfilter%20id%3D%27wc%27%20x%3D%27-15%25%27%20y%3D%27-10%25%27%20width%3D%27130%25%27%20height%3D%27120%25%27%3E%0A%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%270.012%200.009%27%20numOctaves%3D%272%27%20seed%3D%2711%27%20stitchTiles%3D%27stitch%27%20result%3D%27n%27%2F%3E%0A%3CfeDisplacementMap%20in%3D%27SourceGraphic%27%20in2%3D%27n%27%20scale%3D%2716%27%20xChannelSelector%3D%27R%27%20yChannelSelector%3D%27G%27%20result%3D%27disp%27%2F%3E%0A%3CfeGaussianBlur%20in%3D%27disp%27%20stdDeviation%3D%272.4%27%2F%3E%0A%3C%2Ffilter%3E%0A%3Cg%20filter%3D%27url%28%23wc%29%27%3E%0A%3Crect%20x%3D%27-10%27%20y%3D%270%27%20width%3D%27332%27%20height%3D%27400%27%20fill%3D%27%23FBF3E3%27%2F%3E%0A%3Crect%20x%3D%270%27%20%20%20y%3D%270%27%20width%3D%2726%27%20height%3D%27400%27%20fill%3D%27%232FB4C2%27%2F%3E%0A%3Crect%20x%3D%2730%27%20%20y%3D%270%27%20width%3D%2734%27%20height%3D%27400%27%20fill%3D%27%233E6FA6%27%2F%3E%0A%3Crect%20x%3D%2768%27%20%20y%3D%270%27%20width%3D%2728%27%20height%3D%27400%27%20fill%3D%27%232C7A68%27%2F%3E%0A%3Crect%20x%3D%27100%27%20y%3D%270%27%20width%3D%2722%27%20height%3D%27400%27%20fill%3D%27%23A13E63%27%2F%3E%0A%3Crect%20x%3D%27126%27%20y%3D%270%27%20width%3D%2724%27%20height%3D%27400%27%20fill%3D%27%237C8A4A%27%2F%3E%0A%3Crect%20x%3D%27154%27%20y%3D%270%27%20width%3D%2726%27%20height%3D%27400%27%20fill%3D%27%232FB4C2%27%2F%3E%0A%3Crect%20x%3D%27184%27%20y%3D%270%27%20width%3D%2736%27%20height%3D%27400%27%20fill%3D%27%23C39A52%27%2F%3E%0A%3Crect%20x%3D%27224%27%20y%3D%270%27%20width%3D%2730%27%20height%3D%27400%27%20fill%3D%27%233E6FA6%27%2F%3E%0A%3Crect%20x%3D%27258%27%20y%3D%270%27%20width%3D%2728%27%20height%3D%27400%27%20fill%3D%27%232C7A68%27%2F%3E%0A%3Crect%20x%3D%27290%27%20y%3D%270%27%20width%3D%2722%27%20height%3D%27400%27%20fill%3D%27%23A13E63%27%2F%3E%0A%3C%2Fg%3E%0A%3C%2Fsvg%3E")
    repeat;
  background-size: auto, 312px 400px;
  background-attachment: fixed;
}
button{font-family:var(--font);cursor:pointer;}
input,textarea,select{font-family:var(--font);font-size:14px;}
h1,h2,h3{margin:0;}
::selection{background:var(--accent-soft);}

/* The shell is the whole visible interface — one solid, legible panel
   floating over the watercolor stripe field painted on <body>. The stripes
   are the app's personality; nothing you have to read sits directly on
   top of them. */
.shell{
  display:flex;
  width:100%;max-width:1360px;
  min-height:calc(100vh - 44px);
  background:var(--panel);
  border-radius:20px;
  box-shadow:0 24px 60px rgba(35,30,20,0.16), 0 2px 8px rgba(35,30,20,0.06);
  overflow:hidden;
  align-self:flex-start;
}

/* ---------- Sidebar ---------- */
.sidebar{
  width:230px;flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
}
.brand{padding:22px 18px 16px;position:relative;overflow:hidden;}
.brand-watercolor{position:absolute;inset:0;background:
    linear-gradient(rgba(255,255,255,0.18), rgba(255,255,255,0.18)),
    url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27312%27%20height%3D%27400%27%20viewBox%3D%270%200%20312%20400%27%3E%0A%3Cfilter%20id%3D%27wc%27%20x%3D%27-15%25%27%20y%3D%27-10%25%27%20width%3D%27130%25%27%20height%3D%27120%25%27%3E%0A%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%270.012%200.009%27%20numOctaves%3D%272%27%20seed%3D%2711%27%20stitchTiles%3D%27stitch%27%20result%3D%27n%27%2F%3E%0A%3CfeDisplacementMap%20in%3D%27SourceGraphic%27%20in2%3D%27n%27%20scale%3D%2716%27%20xChannelSelector%3D%27R%27%20yChannelSelector%3D%27G%27%20result%3D%27disp%27%2F%3E%0A%3CfeGaussianBlur%20in%3D%27disp%27%20stdDeviation%3D%272.4%27%2F%3E%0A%3C%2Ffilter%3E%0A%3Cg%20filter%3D%27url%28%23wc%29%27%3E%0A%3Crect%20x%3D%27-10%27%20y%3D%270%27%20width%3D%27332%27%20height%3D%27400%27%20fill%3D%27%23FBF3E3%27%2F%3E%0A%3Crect%20x%3D%270%27%20%20%20y%3D%270%27%20width%3D%2726%27%20height%3D%27400%27%20fill%3D%27%232FB4C2%27%2F%3E%0A%3Crect%20x%3D%2730%27%20%20y%3D%270%27%20width%3D%2734%27%20height%3D%27400%27%20fill%3D%27%233E6FA6%27%2F%3E%0A%3Crect%20x%3D%2768%27%20%20y%3D%270%27%20width%3D%2728%27%20height%3D%27400%27%20fill%3D%27%232C7A68%27%2F%3E%0A%3Crect%20x%3D%27100%27%20y%3D%270%27%20width%3D%2722%27%20height%3D%27400%27%20fill%3D%27%23A13E63%27%2F%3E%0A%3Crect%20x%3D%27126%27%20y%3D%270%27%20width%3D%2724%27%20height%3D%27400%27%20fill%3D%27%237C8A4A%27%2F%3E%0A%3Crect%20x%3D%27154%27%20y%3D%270%27%20width%3D%2726%27%20height%3D%27400%27%20fill%3D%27%232FB4C2%27%2F%3E%0A%3Crect%20x%3D%27184%27%20y%3D%270%27%20width%3D%2736%27%20height%3D%27400%27%20fill%3D%27%23C39A52%27%2F%3E%0A%3Crect%20x%3D%27224%27%20y%3D%270%27%20width%3D%2730%27%20height%3D%27400%27%20fill%3D%27%233E6FA6%27%2F%3E%0A%3Crect%20x%3D%27258%27%20y%3D%270%27%20width%3D%2728%27%20height%3D%27400%27%20fill%3D%27%232C7A68%27%2F%3E%0A%3Crect%20x%3D%27290%27%20y%3D%270%27%20width%3D%2722%27%20height%3D%27400%27%20fill%3D%27%23A13E63%27%2F%3E%0A%3C%2Fg%3E%0A%3C%2Fsvg%3E")
    repeat;
  background-size:auto, 156px 200px;
  opacity:0.85;
}
.brand-inner{position:relative;z-index:1;}
.brand-mark{
  font-size:17px;font-weight:700;letter-spacing:-0.01em;
  background:rgba(255,252,245,0.82);backdrop-filter:blur(4px);
  display:inline-block;padding:3px 9px;border-radius:7px;
}
.brand-sub{font-family:var(--font-mono);font-size:10px;color:var(--ink-dim);margin-top:5px;text-transform:uppercase;letter-spacing:0.06em;
  background:rgba(255,252,245,0.82);display:inline-block;padding:2px 8px;border-radius:6px;}

.nav-section{padding:6px 10px;}
.nav-btn{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:none;border:none;color:var(--ink-dim);
  padding:8px 10px;font-size:13.5px;border-radius:7px;margin-bottom:1px;
}
.nav-btn:hover{background:var(--surface-sunk);color:var(--ink);}
.nav-btn.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:600;}
.nav-btn .dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--ink-faint);}

nav.module-list{flex:1;overflow-y:auto;padding:8px 10px;}
.nav-label{font-family:var(--font-mono);font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.06em;padding:10px 10px 4px;}
.module-row{display:flex;align-items:stretch;margin-bottom:1px;}
.module-row .nav-btn{flex:1;}
.module-row .gear{
  background:none;border:none;color:var(--ink-faint);width:26px;border-radius:6px;font-size:12px;flex-shrink:0;
}
.module-row .gear:hover{background:var(--surface-sunk);color:var(--ink);}
.module-row.active .nav-btn{background:var(--accent-soft);color:var(--accent-ink);font-weight:600;}

.sidebar-footer{padding:10px;border-top:1px solid var(--line);}
.btn-library{
  width:100%;background:var(--surface-sunk);border:1px solid var(--line-strong);
  color:var(--ink);padding:9px;font-size:13px;border-radius:8px;font-weight:600;
}
.btn-library:hover{border-color:var(--accent);color:var(--accent-ink);}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;padding:28px 34px 60px;max-width:960px;background:var(--panel);overflow-y:auto;}
.page-title{font-size:22px;font-weight:700;margin-bottom:2px;}
.page-sub{color:var(--ink-dim);font-size:13px;margin-bottom:22px;}

/* ---------- Cards (home) ---------- */
.cards{display:flex;flex-direction:column;gap:12px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.card-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 18px;cursor:pointer;
}
.card-head:hover{background:var(--surface-sunk);}
.card-head-left{display:flex;flex-direction:column;gap:2px;min-width:0;}
.card-title{font-size:14px;font-weight:600;}
.card-preview{font-size:12.5px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-count{
  font-family:var(--font-mono);font-size:12px;color:var(--ink-dim);
  background:var(--surface-sunk);border-radius:20px;padding:3px 10px;flex-shrink:0;
}
.card-chevron{color:var(--ink-faint);font-size:12px;transition:transform .15s;flex-shrink:0;}
.card.open .card-chevron{transform:rotate(90deg);}
.card-body{display:none;border-top:1px solid var(--line);padding:6px 18px 14px;}
.card.open .card-body{display:block;}
.card-body .empty{color:var(--ink-faint);font-size:13px;padding:12px 2px;}

.item-row{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);}
.item-row:last-child{border-bottom:none;}
.type-dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--ink-faint);}
.item-row .item-main{flex:1;min-width:0;cursor:pointer;}
.item-row .item-title{font-size:13.5px;font-weight:500;}
.item-row .item-meta{font-size:11.5px;color:var(--ink-dim);}
.item-row .item-title:hover{color:var(--accent-ink);text-decoration:underline;}

/* Quick capture */
.quick-capture{padding:16px 18px 18px;}
.quick-capture textarea{
  width:100%;min-height:70px;resize:vertical;border:1px solid var(--line-strong);
  border-radius:8px;padding:10px 12px;background:var(--surface-sunk);color:var(--ink);
}
.quick-capture textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);}
.quick-capture-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:10px;}
.quick-capture-hint{font-size:11.5px;color:var(--ink-faint);}

/* ---------- Buttons ---------- */
.btn{border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-ink);}
.btn-secondary{background:var(--surface-sunk);color:var(--ink);border:1px solid var(--line-strong);}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent-ink);}
.btn-danger{background:var(--danger-soft);color:var(--danger);border:1px solid transparent;}
.btn-danger:hover{border-color:var(--danger);}
.btn-text{background:none;border:none;color:var(--ink-dim);font-size:13px;padding:6px 8px;}
.btn-text:hover{color:var(--accent-ink);}
.btn[disabled]{opacity:0.5;cursor:not-allowed;}

/* ---------- Module view ---------- */
.module-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
.module-toolbar-actions{display:flex;gap:8px;}

table.record-table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
table.record-table th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-faint);
  padding:10px 12px;background:var(--surface-sunk);border-bottom:1px solid var(--line);
}
table.record-table td{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:top;}
table.record-table tr:last-child td{border-bottom:none;}
table.record-table tr:hover{background:var(--surface-sunk);}
table.record-table td.actions{white-space:nowrap;width:1%;}
.note-excerpt{color:var(--ink-dim);font-size:12px;}

.record-cards{display:flex;flex-direction:column;gap:10px;}
.record-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
.record-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.record-card-title{font-weight:600;font-size:14px;}
.record-card-meta{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}
.record-card-body{font-size:13.5px;color:var(--ink-dim);margin-top:8px;white-space:pre-wrap;}
.record-card-actions{display:flex;gap:6px;flex-shrink:0;}

.checklist-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);}
.checklist-row:last-child{border-bottom:none;}
.checklist-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);}
.checklist-row .cl-title{flex:1;font-size:13.5px;}
.checklist-row.done .cl-title{color:var(--ink-faint);text-decoration:line-through;}
.tag-chip{
  font-family:var(--font-mono);font-size:10.5px;background:var(--surface-sunk);color:var(--ink-dim);
  padding:2px 8px;border-radius:20px;flex-shrink:0;
}

.empty-state{
  text-align:center;padding:50px 20px;color:var(--ink-faint);
  border:1px dashed var(--line-strong);border-radius:var(--radius);
}
.empty-state p{margin:0 0 12px;}

/* ---------- Modal ---------- */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(43,42,39,0.35);
  display:flex;align-items:flex-start;justify-content:center;padding:6vh 20px;z-index:50;overflow-y:auto;
}
.modal{
  background:var(--surface);border-radius:14px;max-width:560px;width:100%;
  box-shadow:0 20px 50px rgba(0,0,0,0.18);
}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.modal-head h2{font-size:16px;}

.manual-overlay{
  display:none;position:fixed;inset:0;background:rgba(43,42,39,0.45);
  align-items:center;justify-content:center;padding:4vh 20px;z-index:60;
}
.manual-overlay.open{display:flex;}
.manual-overlay-box{
  background:var(--panel);border-radius:14px;width:100%;max-width:960px;height:92vh;
  display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,0.25);overflow:hidden;
}
.manual-overlay-head{
  padding:14px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;
  font-weight:600;flex-shrink:0;
}
.manual-overlay-box iframe{flex:1;width:100%;border:none;}
.modal-close{background:none;border:none;font-size:18px;color:var(--ink-faint);line-height:1;}
.modal-close:hover{color:var(--ink);}
.modal-body{padding:20px 22px;max-height:64vh;overflow-y:auto;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}

.field-group{margin-bottom:14px;}
.field-label{font-size:12px;font-weight:600;color:var(--ink-dim);display:block;margin-bottom:5px;}
.field-input, .field-group input[type=text], .field-group input[type=date], .field-group select, .field-group textarea{
  width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:9px 11px;
  background:var(--surface);color:var(--ink);
}
.field-group textarea{min-height:80px;resize:vertical;}
.field-input:focus, .field-group input:focus, .field-group select:focus, .field-group textarea:focus{
  outline:2px solid var(--accent-soft);border-color:var(--accent);
}
.field-hint{font-size:11.5px;color:var(--ink-faint);margin-top:4px;}

.tpl-group-label{font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-faint);margin:16px 0 8px;}
.tpl-group-label:first-child{margin-top:0;}
.tpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.tpl-card{
  text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:11px 13px;display:flex;flex-direction:column;gap:2px;
}
.tpl-card:hover{border-color:var(--accent);background:var(--accent-soft);}
.tpl-card .tpl-name{font-weight:600;font-size:13.5px;}
.tpl-card .tpl-shape{font-size:11px;color:var(--ink-faint);}
.tpl-custom-btn{
  width:100%;text-align:left;background:var(--surface-sunk);border:1px dashed var(--line-strong);border-radius:10px;
  padding:12px 14px;font-weight:600;font-size:13.5px;color:var(--ink);
}
.tpl-custom-btn:hover{border-color:var(--accent);color:var(--accent-ink);}

.schema-field-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;background:var(--surface-sunk);padding:8px;border-radius:8px;}
.schema-field-row input, .schema-field-row select{flex:1;min-width:0;}

<script>
'use strict';

/* =========================================================
   Data model
   ========================================================= */
const STORE_KEY = 'tc_state_v1';

const FIELD_TYPES = {
  text:      { label: 'Short text' },
  longtext:  { label: 'Long text' },
  date:      { label: 'Date' },
  time:      { label: 'Time' },
  number:    { label: 'Number' },
  select:    { label: 'Choice list' },
  checkbox:  { label: 'Checkbox' },
  'link-one':  { label: 'Link — one record', isLink: true, multi: false },
  'link-many': { label: 'Link — many records', isLink: true, multi: true },
};

const SHAPES = {
  table:     { label: 'Repeating rows', hint: 'A table of similar records — e.g. Medications.' },
  notes:     { label: 'Freeform notes', hint: 'Long-form entries. No custom fields needed — the built-in notes field is the content.' },
  checklist: { label: 'Checklist', hint: 'Simple done / not-done items.' },
  event:     { label: 'Dated / scheduled', hint: 'Things with a date — e.g. Appointments. Include one Date field.' },
  files:     { label: 'File / photo', hint: 'One uploaded file or photo per record — e.g. a scanned insurance card. Stored on this device (not Drive), and travels with your Backup export.' },
};

/* Per-shape sync-target compatibility. 'ok' offers the target with no
   warning; 'warn' offers it but discloses the degradation before syncing;
   'refuse' doesn't offer it at all — a combination that would silently
   lose or corrupt the data's meaning. */
const SYNC_RULES = {
  table:     { sheets:'ok',    docx:'warn',   calendar:'refuse' },
  notes:     { sheets:'warn',  docx:'ok',     calendar:'refuse' },
  checklist: { sheets:'warn',  docx:'refuse', calendar:'refuse' },
  event:     { sheets:'warn',  docx:'refuse', calendar:'ok' },
  files:     { sheets:'refuse',docx:'refuse', calendar:'refuse' },
};
const SYNC_WARN_MESSAGES = {
  'table|docx':     'This will flatten each record into a plain paragraph in the document — table structure won’t carry over. Sync anyway?',
  'notes|sheets':    'This will put one note per row in a single cell — you’ll lose the longer, readable layout. Sync anyway?',
  'checklist|sheets':'This will flatten checked/unchecked state into plain text columns. Sync anyway?',
  'event|sheets':    'This will sync as a flat log of appointments, not a live calendar. Sync anyway?',
};
const SYNC_TARGET_LABELS = { sheets:'Google Sheets', docx:'Google Docs', calendar:'Google Calendar' };

/* Calendar reminder defaults, in minutes before the event start. An
   all-day event's "start" is midnight, so 900 lands the popup at 9am the
   day before; a timed event's start is the actual time, so 24h before
   reads naturally instead. */
const CALENDAR_REMINDER_MINUTES_ALLDAY = 900;
const CALENDAR_REMINDER_MINUTES_TIMED = 1440;

function uid(prefix){ return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

// Templates shown in the Library. `role` (optional) wires a template's
// instances into the home page cards generically — any module created
// from a role-carrying template counts toward that card, not just the
// first one.
const STARTER_TEMPLATES = [
  { group:'Starters', name:'Checklist', shape:'checklist', fields:[ {id:'title',label:'Item',type:'text'} ] },
  { group:'Starters', name:'Notes', shape:'notes', fields:[] , role:null},
  { group:'Starters', name:'Next Steps', shape:'checklist', role:'next-steps',
    fields:[ {id:'title',label:'Task',type:'text'}, {id:'group',label:'Group tag',type:'text'} ] },
  { group:'Starters', name:'Unanswered Questions', shape:'checklist', role:'unanswered',
    fields:[ {id:'question',label:'Question',type:'text'}, {id:'askedOf',label:'Asked of',type:'text'},
             {id:'status',label:'Status',type:'select',options:['Open','Resolved']} ] },
  { group:'Starters', name:'Files & Photos', shape:'files', fields:[ {id:'title',label:'Title',type:'text'} ] },
];
const MEDICAL_TEMPLATES = [
  { group:'Medical', name:'Doctors', shape:'table',
    fields:[ {id:'name',label:'Name',type:'text'}, {id:'specialty',label:'Specialty / Title',type:'text'},
             {id:'phone',label:'Phone',type:'text'}, {id:'address',label:'Address',type:'text'} ] },
  { group:'Medical', name:'Appointments', shape:'event',
    fields:[ {id:'title',label:'Reason',type:'text'}, {id:'doctor',label:'Doctor',type:'text'},
             {id:'date',label:'Date',type:'date'}, {id:'time',label:'Time',type:'time'} ] },
  { group:'Medical', name:'Referrals', shape:'table',
    fields:[ {id:'toDoctor',label:'Referred to',type:'text'}, {id:'fromDoctor',label:'Referred by',type:'text'},
             {id:'reason',label:'Reason',type:'text'}, {id:'status',label:'Status',type:'select',options:['Pending','Scheduled','Completed']} ] },
  { group:'Medical', name:'Medications', shape:'table',
    fields:[ {id:'name',label:'Medication',type:'text'}, {id:'dosage',label:'Dosage',type:'text'},
             {id:'prescribedBy',label:'Prescribed by',type:'text'}, {id:'startDate',label:'Start date',type:'date'} ] },
  { group:'Medical', name:'Notes to Bring', shape:'checklist',
    fields:[ {id:'item',label:'Item',type:'text'}, {id:'forAppointment',label:'For appointment',type:'text'} ] },
];
const ALL_TEMPLATES = STARTER_TEMPLATES.concat(MEDICAL_TEMPLATES);

function seedState(){
  const s = { modules: [], records: {}, view: {type:'home'},
    settings: { anthropicKey:'', googleClientId:'', googleApiKey:'', spreadsheetId:'',
      exportSchedule:'manual', lastExportedAt:null } };
  const seedFrom = (name, tplName) => {
    const tpl = STARTER_TEMPLATES.find(t => t.name === tplName);
    const mod = instantiateModule(s, tpl, name);
    return mod;
  };
  seedFrom('Next Steps', 'Next Steps');
  seedFrom('Unanswered Questions', 'Unanswered Questions');
  seedFrom('Personal Notes', 'Notes');
  return s;
}

function instantiateModule(s, tpl, name){
  const mod = {
    id: uid('m'),
    name: name,
    shape: tpl.shape,
    role: tpl.role || null,
    fields: JSON.parse(JSON.stringify(tpl.fields)),
    createdAt: Date.now(),
  };
  s.modules.push(mod);
  s.records[mod.id] = [];
  return mod;
}

let state = loadState();
function loadState(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      const defaults = { anthropicKey:'', googleClientId:'', googleApiKey:'', spreadsheetId:'', exportSchedule:'manual', lastExportedAt:null };
      s.settings = Object.assign({}, defaults, s.settings || {});
      return s;
    }
  } catch(e){ console.warn('Could not read saved data', e); }
  return seedState();
}
function saveState(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch(e){ console.warn('Could not save data', e); }
}

/* ---------- File storage (IndexedDB) ----------
   File/photo bytes never go through localStorage — its quota is a few MB,
   fine for text and short tables, not for photos (same reasoning PM's own
   design doc gives for staying Sheets-links-only). IndexedDB has real
   room. Only `state` (module/record metadata, including which IDB key a
   record's attachment lives under) persists in localStorage; the bytes
   themselves live here, and travel separately through Backup export as
   base64, not through localStorage at all. */
const IDB_NAME = 'tc_files_v1';
const IDB_STORE = 'blobs';
let idbOpenPromise = null;
function openIdb(){
  if (idbOpenPromise) return idbOpenPromise;
  idbOpenPromise = new Promise((resolve, reject) => {
    if (!('indexedDB' in window)){ reject(new Error('This browser doesn\'t support local file storage.')); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE, { keyPath: 'id' }); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return idbOpenPromise;
}
async function idbPutBlob(id, blob, name, mimeType){
  const db = await openIdb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put({ id, blob, name, mimeType });
    tx.oncomplete = () => resolve(id);
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGetBlob(id){
  const db = await openIdb();
  return new Promise((resolve, reject) => {
    const req = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function idbDeleteBlob(id){
  const db = await openIdb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
function blobToBase64(blob){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(blob);
  });
}
function base64ToBlob(base64, mimeType){
  const bytes = atob(base64);
  const arr = new Uint8Array(bytes.length);
  for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
  return new Blob([arr], { type: mimeType });
}
function humanFileSize(bytes){
  if (!bytes) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return Math.round(bytes/1024) + ' KB';
  return (bytes/(1024*1024)).toFixed(1) + ' MB';
}

function getModule(id){ return state.modules.find(m => m.id === id); }
function moduleRecords(id){ return state.records[id] || []; }

/* Primary display field for a record: first text-type field, else first field, else null. */
function primaryField(mod){
  return mod.fields.find(f => f.type === 'text') || mod.fields[0] || null;
}
function recordTitle(mod, rec){
  const pf = primaryField(mod);
  if (pf && rec.fields[pf.id]) return String(rec.fields[pf.id]);
  if (rec.notes) return rec.notes.slice(0, 40) + (rec.notes.length > 40 ? '…' : '');
  return '(untitled)';
}
function dateField(mod){ return mod.fields.find(f => f.type === 'date') || null; }
function timeField(mod){ return mod.fields.find(f => f.type === 'time') || null; }

/* ---------- Links & backlinks ----------
   A link field's value is a record id (link-one) or array of record ids
   (link-many), always chosen manually by the person — never inferred.
   Backlinks are computed on demand by scanning every module's records for
   a link field pointing at the record in question, rather than kept as a
   separately-maintained reverse index — same end result (a record can show
   what points at it), simpler to keep correct at this scale. */
function findRecordById(moduleId, recId){
  return moduleRecords(moduleId).find(r => r.id === recId) || null;
}
function linkFieldValueIds(f, rec){
  const v = rec.fields[f.id];
  if (f.type === 'link-many') return Array.isArray(v) ? v : [];
  return v ? [v] : [];
}
function getBacklinks(targetMod, targetRec){
  const out = [];
  state.modules.forEach(mod => {
    mod.fields.filter(f => f.type === 'link-one' || f.type === 'link-many').forEach(f => {
      if (f.targetModuleId !== targetMod.id) return;
      moduleRecords(mod.id).forEach(rec => {
        if (linkFieldValueIds(f, rec).includes(targetRec.id)) out.push({ mod, rec, field: f });
      });
    });
  });
  return out;
}
function backlinksForModule(mod){
  // Every backlink pointing at any record currently in this module — used
  // for the module-delete warning.
  let count = 0;
  moduleRecords(mod.id).forEach(rec => { count += getBacklinks(mod, rec).length; });
  return count;
}
function linkFieldDisplay(f, rec){
  const targetMod = getModule(f.targetModuleId);
  if (!targetMod) return '—';
  const ids = linkFieldValueIds(f, rec);
  if (!ids.length) return '—';
  const titles = ids.map(id => {
    const r = findRecordById(targetMod.id, id);
    return r ? recordTitle(targetMod, r) : '(linked record no longer exists)';
  });
  return titles.join(', ');
}

/* =========================================================
   Rendering
   ========================================================= */
const mainArea = document.getElementById('mainArea');
const moduleListEl = document.getElementById('moduleList');
const modalRoot = document.getElementById('modalRoot');

function render(){
  saveState();
  renderSidebar();
  if (state.view.type === 'home') renderHome();
  else if (state.view.type === 'module') renderModule(state.view.moduleId);
}

function renderSidebar(){
  const homeBtn = document.getElementById('homeNavBtn');
  homeBtn.classList.toggle('active', state.view.type === 'home');

  moduleListEl.innerHTML = '';
  state.modules.forEach(mod => {
    const row = document.createElement('div');
    row.className = 'module-row' + (state.view.type === 'module' && state.view.moduleId === mod.id ? ' active' : '');
    const btn = document.createElement('button');
    btn.className = 'nav-btn';
    btn.innerHTML = '<span class="dot" style="background:' + colorForKey(mod.name) + '"></span>' + escapeHtml(mod.name);
    btn.onclick = () => { state.view = {type:'module', moduleId: mod.id}; render(); };
    const gear = document.createElement('button');
    gear.className = 'gear'; gear.title = 'Edit module'; gear.textContent = '⚙';
    gear.onclick = (e) => { e.stopPropagation(); openSchemaModal(mod); };
    row.appendChild(btn); row.appendChild(gear);
    moduleListEl.appendChild(row);
  });
}

homeNavBtnListener();
function homeNavBtnListener(){
  document.getElementById('homeNavBtn').onclick = () => { state.view = {type:'home'}; render(); };
  document.getElementById('openLibraryBtn').onclick = () => openLibraryModal();
  document.getElementById('openConnectionsBtn').onclick = () => openConnectionsModal();
}

/* ---------- Home ---------- */
let cardOpenState = { capture:true, coming:false, next:false, unanswered:false };

function renderHome(){
  mainArea.innerHTML = '';
  const title = el('div', 'page-title', 'Home');
  const sub = el('div', 'page-sub', 'What’s pending, at a glance.');
  mainArea.appendChild(title); mainArea.appendChild(sub);

  const cards = el('div', 'cards');
  cards.appendChild(renderQuickCaptureCard());
  cards.appendChild(renderComingUpCard());
  cards.appendChild(renderNextStepsCard());
  cards.appendChild(renderUnansweredCard());
  mainArea.appendChild(cards);

  const roadmap = el('div', 'roadmap-note',
    'Add your Anthropic and Google keys under Settings to light up AI capture, AI-assisted module setup, and Sheets/Docs/Calendar sync. Click Manual for a full walkthrough of every feature.');
  mainArea.appendChild(roadmap);
}

function personalNotesModule(){
  return state.modules.find(m => m.role === 'personal-notes') || null;
}
function findFirstNotesModule(){
  // Fallback: any 'notes' shape module, in case the role tag was lost.
  return state.modules.find(m => m.role === 'personal-notes') || state.modules.find(m => m.shape === 'notes');
}

function renderQuickCaptureCard(){
  const card = el('div', 'card open');
  const body = el('div', 'quick-capture');
  const label = el('div', 'card-title', 'Quick capture');
  const hint = el('div', 'quick-capture-hint', 'Jot something down, or attach a photo of messy notes and let AI turn it into one clean, organized note — review it before it saves.');
  const ta = document.createElement('textarea');
  ta.placeholder = 'Type or paste a quick note…';
  body.appendChild(label); body.appendChild(hint); body.appendChild(ta);

  const photoRow = el('div', ''); photoRow.style.marginTop = '8px'; photoRow.style.display = 'flex'; photoRow.style.alignItems = 'center'; photoRow.style.gap = '10px';
  const fileInput = document.createElement('input'); fileInput.type = 'file'; fileInput.accept = 'image/*'; fileInput.style.display = 'none';
  const attachBtn = buttonEl('📷 Attach photo', 'btn-secondary', () => fileInput.click());
  const thumb = document.createElement('img'); thumb.style.height = '32px'; thumb.style.borderRadius = '6px'; thumb.style.display = 'none';
  let photoData = null; // {base64, mediaType}
  fileInput.onchange = async () => {
    const file = fileInput.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      photoData = { base64: dataUrl.split(',')[1], mediaType: file.type };
      thumb.src = dataUrl; thumb.style.display = 'inline-block';
    };
    reader.readAsDataURL(file);
  };
  photoRow.appendChild(fileInput); photoRow.appendChild(attachBtn); photoRow.appendChild(thumb);
  body.appendChild(photoRow);

  const errBox = el('div', ''); body.appendChild(errBox);

  const row = el('div', 'quick-capture-row');
  const aiBtn = buttonEl('✨ Clean up with AI', 'btn-secondary', async () => {
    if (!state.settings.anthropicKey){
      errBox.innerHTML = ''; errBox.appendChild(el('div', 'error-box', 'No Anthropic API key set yet — add one under Connections first.'));
      return;
    }
    if (!ta.value.trim() && !photoData){
      alert('Type something or attach a photo first.');
      return;
    }
    const origText = aiBtn.textContent; aiBtn.disabled = true; aiBtn.textContent = 'Reading…'; errBox.innerHTML = '';
    try {
      const cleaned = await cleanUpCapture(ta.value.trim(), photoData);
      ta.value = cleaned; // shown for review — not saved yet
    } catch(err){
      const msg = err.message === 'NO_KEY' ? 'No Anthropic API key set yet — add one under Connections first.'
        : 'Couldn\'t clean this up (' + err.message + '). Your original text is untouched — you can still save it as-is.';
      errBox.appendChild(el('div', 'error-box', msg));
    } finally {
      aiBtn.disabled = false; aiBtn.textContent = origText;
    }
  });
  const saveBtn = document.createElement('button');
  saveBtn.className = 'btn btn-primary'; saveBtn.textContent = 'Save note';
  saveBtn.onclick = () => {
    const val = ta.value.trim();
    if (!val) return;
    const mod = findFirstNotesModule();
    if (!mod){ alert('Add a Notes module from the Library first.'); return; }
    state.records[mod.id].push({ id: uid('r'), fields:{}, notes: val, createdAt: Date.now(), updatedAt: Date.now() });
    ta.value = ''; photoData = null; thumb.style.display = 'none'; fileInput.value = '';
    render();
  };
  row.appendChild(aiBtn);
  row.appendChild(saveBtn);
  body.appendChild(row);
  card.appendChild(body);
  return card;
}

async function cleanUpCapture(text, photoData){
  const system = [
    'You clean up someone\'s messy captured notes (typed shorthand, or notes photographed off paper) into one clean, organized, legible note.',
    'Reorganize and clarify — fix obvious structure, group related points, spell out clear abbreviations — but do not invent facts, dates, names, or details that aren\'t actually there or clearly implied.',
    'If part of the photo or text is genuinely illegible or unclear, say so briefly in the note rather than guessing or silently leaving it out.',
    'Respond with only the cleaned-up note itself — no preamble, no "Here is your cleaned up note:", nothing else.',
  ].join('\n');
  const content = [];
  content.push({ type: 'text', text: text ? ('Raw notes:\n' + text) : 'Read the attached photo of handwritten/typed notes and clean them up.' });
  if (photoData) content.push({ type: 'image', source: { type: 'base64', media_type: photoData.mediaType, data: photoData.base64 } });
  return (await callClaude({ system, userContent: content, maxTokens: 800 })).trim();
}

function collapsibleCard(key, title, countText, previewText, bodyRenderer){
  const isOpen = cardOpenState[key];
  const card = el('div', 'card' + (isOpen ? ' open' : ''));
  const head = el('div', 'card-head');
  const left = el('div', 'card-head-left');
  left.appendChild(el('div', 'card-title', title));
  left.appendChild(el('div', 'card-preview', previewText));
  head.appendChild(left);
  const right = el('div', '');
  right.style.display='flex'; right.style.alignItems='center'; right.style.gap='10px';
  right.appendChild(el('div', 'card-count', countText));
  right.appendChild(el('div', 'card-chevron', '›'));
  head.appendChild(right);
  head.onclick = () => { cardOpenState[key] = !cardOpenState[key]; render(); };
  card.appendChild(head);
  const body = el('div', 'card-body');
  bodyRenderer(body);
  card.appendChild(body);
  return card;
}

function renderComingUpCard(){
  const items = [];
  state.modules.filter(m => m.shape === 'event').forEach(mod => {
    const df = dateField(mod);
    if (!df) return;
    moduleRecords(mod.id).forEach(rec => {
      const raw = rec.fields[df.id];
      if (!raw) return;
      items.push({ mod, rec, date: raw });
    });
  });
  const today = new Date().toISOString().slice(0,10);
  const upcoming = items.filter(i => i.date >= today).sort((a,b) => a.date < b.date ? -1 : 1);
  const soonest = upcoming[0];
  const preview = soonest ? ('Next: ' + recordTitle(soonest.mod, soonest.rec) + ', ' + formatDate(soonest.date) +
    (upcoming.length > 1 ? ' — ' + (upcoming.length - 1) + ' more' : '')) : 'Nothing scheduled';
  return collapsibleCard('coming', 'Coming up', String(upcoming.length), preview, (body) => {
    if (!upcoming.length){ body.appendChild(el('div','empty','Nothing scheduled yet.')); return; }
    upcoming.forEach(i => body.appendChild(itemRow(i.mod, i.rec, formatDate(i.date))));
  });
}

function renderNextStepsCard(){
  const rows = [];
  state.modules.filter(m => m.role === 'next-steps').forEach(mod => {
    moduleRecords(mod.id).forEach(rec => { if (!rec.fields.done) rows.push({mod, rec}); });
  });
  const preview = rows.length ? recordTitle(rows[0].mod, rows[0].rec) + (rows.length > 1 ? ' — ' + (rows.length-1) + ' more' : '') : 'Nothing pending';
  return collapsibleCard('next', 'Next steps', String(rows.length), preview, (body) => {
    if (!rows.length){ body.appendChild(el('div','empty','Nothing pending.')); return; }
    rows.forEach(({mod, rec}) => {
      const row = el('div', 'checklist-row');
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!rec.fields.done;
      cb.onchange = () => { rec.fields.done = cb.checked; rec.updatedAt = Date.now(); render(); };
      row.appendChild(cb);
      const dot = el('span', 'type-dot', '');
      dot.style.background = colorForKey(rec.fields.group || mod.name);
      dot.style.display = 'inline-block';
      row.appendChild(dot);

/* Lightweight styled confirm, returns a Promise<boolean>. Appended as an
   overlay on top of modalRoot rather than replacing it, so confirming or
   cancelling a nested "are you sure" step (e.g. inside the schema editor)
   doesn't destroy the modal underneath it. */
function confirmModal(message){
  return new Promise(resolve => {
    const overlay = el('div', 'modal-backdrop');
    overlay.style.zIndex = '60';
    const modal = el('div', 'modal');
    modal.style.maxWidth = '420px';
    const head = el('div', 'modal-head');
    head.appendChild(el('h2', '', 'Are you sure?'));
    modal.appendChild(head);
    const body = el('div', 'modal-body');
    const msgDiv = document.createElement('div');
    msgDiv.className = 'confirm-msg';
    msgDiv.innerHTML = message;
    body.appendChild(msgDiv);
    modal.appendChild(body);
    const foot = el('div', 'modal-foot');
    foot.appendChild(buttonEl('Cancel', 'btn-secondary', () => { overlay.remove(); resolve(false); }));
    foot.appendChild(buttonEl('Continue', 'btn-danger', () => { overlay.remove(); resolve(true); }));
    modal.appendChild(foot);
    overlay.appendChild(modal);
    overlay.onclick = (e) => { if (e.target === overlay){ overlay.remove(); resolve(false); } };
    modalRoot.appendChild(overlay);
  });
}
function buttonEl(text, cls, onclick){
  const b = document.createElement('button');
  b.className = 'btn ' + cls; b.textContent = text; b.onclick = onclick;
  return b;
}

const AI_FIELD_TYPE_NAMES = 'text (short text), longtext (long text), date, time, number, select (choice list), checkbox, link-one (links to one record in another module), link-many (links to several records in another module)';

async function proposeModuleFromAI(description){
  const moduleNames = state.modules.map(m => m.name);
  const system = [
    'You are helping someone design a new module (a record type) for Note Goat, a personal organizer app.',
    'A module has a name, a "shape" (table = repeating rows of similar records; notes = freeform long-form entries with no custom fields; checklist = simple done/not-done items; event = things with a date; files = one uploaded file/photo per record, e.g. scanned documents), and a list of fields.',
    'Available field types: ' + AI_FIELD_TYPE_NAMES + '.',
    'Existing modules the person already has, that new fields can link to if it genuinely makes sense: ' + (moduleNames.length ? moduleNames.join(', ') : '(none yet)') + '.',
    'Only propose a link-one/link-many field when it clearly matches one of those existing module names — otherwise just use a plain text field instead.',
    'Keep the field list focused — only what the description actually asks for, not everything imaginable.',
    '',
    'Respond in exactly this format and nothing else:',
    'NAME: <a short module name>',
    'SHAPE: <table|notes|checklist|event>',
    'FIELDS:',
    '- <field label> | <type> | <for select: comma-separated options — for link-one/link-many: the exact existing module name it links to — otherwise blank>',
    '(one line per field; if shape is notes, this section can be empty)',
    'RATIONALE: <one sentence explaining the shape and field choices, written to the person, e.g. "A table works well since you\'ll have one row per..."> ',
  ].join('\n');
  const text = await callClaude({ system, userContent: description, maxTokens: 700 });
  return parseAIModuleProposal(text);
}

function parseAIModuleProposal(text){
  const lines = text.split('\n');
  let name = '', shape = 'table', rationale = '';
  const fields = [];
  let inFields = false;
  lines.forEach(line => {
    const l = line.trim();
    if (/^NAME:/i.test(l)) { name = l.replace(/^NAME:/i, '').trim(); inFields = false; }
    else if (/^SHAPE:/i.test(l)) { const s = l.replace(/^SHAPE:/i, '').trim().toLowerCase(); if (SHAPES[s]) shape = s; inFields = false; }
    else if (/^FIELDS:/i.test(l)) { inFields = true; }
    else if (/^RATIONALE:/i.test(l)) { rationale = l.replace(/^RATIONALE:/i, '').trim(); inFields = false; }
    else if (inFields && l.startsWith('-')) {
      const parts = l.slice(1).split('|').map(p => p.trim());
      const label = parts[0] || 'Field';
      let type = (parts[1] || 'text').toLowerCase();
      if (!FIELD_TYPES[type]) type = 'text';
      const field = { id: uid('f'), label, type };
      const extra = parts[2] || '';
      if (type === 'select' && extra) field.options = extra.split(',').map(s => s.trim()).filter(Boolean);
      if ((type === 'link-one' || type === 'link-many') && extra){
        const targetMod = state.modules.find(m => m.name.toLowerCase() === extra.toLowerCase());
        if (targetMod) field.targetModuleId = targetMod.id;
        else field.type = 'text'; // named a module we don't actually have — degrade rather than create a dangling link
      }
      fields.push(field);
    }
  });
  if (!name) throw new Error('couldn\'t make sense of the response');
  return { name, shape, fields, rationale: rationale || 'Here\'s a proposed module based on what you described.' };
}

/* ---------- Schema (create / edit module) modal ----------
   `prefill` (create mode only) seeds the form from an AI-proposed draft
   {name, shape, fields, rationale} — still fully editable, nothing is
   created until the person reviews it and clicks Create, same as picking
   a Library template. */
function openSchemaModal(mod, prefill){
  const isEdit = !!mod;
  let draftFields = isEdit ? JSON.parse(JSON.stringify(mod.fields)) : (prefill ? prefill.fields : []);
  let draftShape = isEdit ? mod.shape : (prefill ? prefill.shape : 'table');

  openModal(isEdit ? 'Edit module' : 'Build a module', (body) => {
    if (prefill && prefill.rationale){
      body.appendChild(el('div', 'shape-note', '✨ ' + prefill.rationale + ' Review and adjust anything below before creating it.'));
    }
    const nameGrp = el('div', 'field-group');
    nameGrp.appendChild(el('label', 'field-label', 'Module name'));
    const nameInput = document.createElement('input');
    nameInput.type = 'text'; nameInput.className = 'field-input';
    nameInput.value = isEdit ? mod.name : (prefill ? prefill.name : '');
    nameGrp.appendChild(nameInput);
    body.appendChild(nameGrp);

    const shapeGrp = el('div', 'field-group');
    shapeGrp.appendChild(el('label', 'field-label', 'Shape'));
    const shapeSelect = document.createElement('select');
    Object.keys(SHAPES).forEach(k => {
      const opt = document.createElement('option'); opt.value = k; opt.textContent = SHAPES[k].label;
      if (k === draftShape) opt.selected = true;
      shapeSelect.appendChild(opt);
    });
    if (isEdit) shapeSelect.disabled = true;
    shapeGrp.appendChild(shapeSelect);
    const shapeHint = el('div', 'field-hint', isEdit ? 'A module’s shape can’t be changed after it’s created — make a new module if you need a different shape.' : SHAPES[draftShape].hint);
    shapeGrp.appendChild(shapeHint);
    shapeSelect.onchange = () => { draftShape = shapeSelect.value; shapeHint.textContent = SHAPES[draftShape].hint; };
    body.appendChild(shapeGrp);

    const fieldsLabel = el('label', 'field-label', 'Fields');
    body.appendChild(fieldsLabel);
    const fieldsList = el('div', '');
    body.appendChild(fieldsList);

    function renderFieldsList(){
      fieldsList.innerHTML = '';
      draftFields.forEach((f, idx) => {
        const wrapper = el('div', '');
        const row = el('div', 'schema-field-row');
        const labelInput = document.createElement('input');
        labelInput.type = 'text'; labelInput.value = f.label; labelInput.placeholder = 'Field label';
        labelInput.oninput = () => { f.label = labelInput.value; };
        row.appendChild(labelInput);
        const typeSelect = document.createElement('select');
        Object.keys(FIELD_TYPES).forEach(tk => {
          const opt = document.createElement('option'); opt.value = tk; opt.textContent = FIELD_TYPES[tk].label;
          if (tk === f.type) opt.selected = true;
          typeSelect.appendChild(opt);
        });
        typeSelect.onchange = () => {
          attemptFieldTypeChange(f, typeSelect.value, typeSelect);
          renderFieldsList();
        };
        row.appendChild(typeSelect);
        const rm = document.createElement('button');
        rm.className = 'rm-field'; rm.textContent = '✕'; rm.title = 'Remove field';
        rm.onclick = async () => { await attemptFieldRemoval(f, idx); };
        row.appendChild(rm);
        wrapper.appendChild(row);

        if (FIELD_TYPES[f.type] && FIELD_TYPES[f.type].isLink){
          const linkRow = el('div', 'schema-field-row');
          linkRow.style.marginTop = '-4px';
          const targetSelect = document.createElement('select');
          const noneOpt = document.createElement('option');
          noneOpt.value = ''; noneOpt.textContent = 'Links to… (choose a module)';
          targetSelect.appendChild(noneOpt);
          state.modules.forEach(m => {
            const opt = document.createElement('option'); opt.value = m.id; opt.textContent = m.name;
            if (f.targetModuleId === m.id) opt.selected = true;
            targetSelect.appendChild(opt);
          });
          targetSelect.onchange = () => { f.targetModuleId = targetSelect.value || null; };
          linkRow.appendChild(targetSelect);
          wrapper.appendChild(linkRow);
        }
        fieldsList.appendChild(wrapper);
      });
    }

    async function attemptFieldRemoval(f, idx){
      const recs = isEdit ? moduleRecords(mod.id) : [];
      const withData = recs.filter(r => r.fields[f.id] !== undefined && r.fields[f.id] !== '' && r.fields[f.id] !== false);
      if (withData.length){
        const ok = await confirmModal('<strong>' + withData.length + '</strong> record' + (withData.length===1?'':'s') +
          ' currently ' + (withData.length===1?'has':'have') + ' data in "<strong>' + escapeHtml(f.label) +
          '</strong>." Deleting this field removes that data permanently. Continue?');
        if (!ok) return;
      }
      draftFields.splice(idx, 1);
      renderFieldsList();
    }

    function attemptFieldTypeChange(f, newType, selectEl){
      const recs = isEdit ? moduleRecords(mod.id) : [];
      const badValues = [];
      const wasLink = FIELD_TYPES[f.type] && FIELD_TYPES[f.type].isLink;
      const willBeLink = FIELD_TYPES[newType] && FIELD_TYPES[newType].isLink;
      if (newType === 'number' || newType === 'date' || newType === 'time'){
        recs.forEach(r => {
          const v = r.fields[f.id];
          if (v === undefined || v === '' || v === null) return;
          if (newType === 'number' && isNaN(Number(v))) badValues.push({r, v});
          if (newType === 'date' && isNaN(Date.parse(v))) badValues.push({r, v});
          if (newType === 'time' && !/^\d{2}:\d{2}$/.test(v)) badValues.push({r, v});
        });
      }
      if (willBeLink && !wasLink){
        recs.forEach(r => { if (r.fields[f.id] !== undefined && r.fields[f.id] !== '') badValues.push({r, v: r.fields[f.id]}); });
      }
      if (wasLink && !willBeLink){
        recs.forEach(r => { if (linkFieldValueIds(f, r).length) badValues.push({r, v: '(a link)'}); });
      }
      if (badValues.length){
        showFieldTypeError(f, newType, badValues, mod);
        selectEl.value = f.type; // revert visually, edit refused
        return;
      }
      f.type = newType;
      if (willBeLink && !f.targetModuleId) f.targetModuleId = null;
      if (newType === 'select' && !f.options) f.options = [];
    }

    function showFieldTypeError(f, newType, badValues, mod){
      const box = el('div', 'error-box',
        'Can’t change "' + escapeHtml(f.label) + '" to ' + FIELD_TYPES[newType].label.toLowerCase() + ' — ' +
        badValues.length + ' record' + (badValues.length===1?'':'s') + ' ' + (badValues.length===1?'has':'have') +
        ' a value that doesn’t fit (e.g. "' + escapeHtml(String(badValues[0].v)) + '"). Fix that data first, or leave the field as it is.');
      fieldsList.appendChild(box);
      setTimeout(() => box.remove(), 6000);
    }

    renderFieldsList();

    const addBtn = document.createElement('button');
    addBtn.className = 'btn btn-secondary add-field-btn';
    addBtn.textContent = '+ Add field';
    addBtn.onclick = () => {
      draftFields.push({ id: uid('f'), label: 'New field', type: 'text' });
      renderFieldsList();
    };
    body.appendChild(addBtn);
    body.appendChild(el('div', 'field-hint', 'Every record also gets a built-in Notes field automatically — no need to add one.'));

    body._nameInput = nameInput;
    body._getDraft = () => ({ name: nameInput.value.trim(), shape: draftShape, fields: draftFields });
  }, buildSchemaFooter(mod, isEdit));
}

function buildSchemaFooter(mod, isEdit){
  const buttons = [];
  if (isEdit){
    buttons.push(buttonEl('Delete module', 'btn-danger', async () => {
      const recs = moduleRecords(mod.id);
      const inboundLinks = backlinksForModule(mod);
      let msg;
      if (recs.length && inboundLinks){
        msg = 'This module has <strong>' + recs.length + '</strong> record' + (recs.length===1?'':'s') + ', and <strong>' + inboundLinks +
          '</strong> record' + (inboundLinks===1?'':'s') + ' elsewhere link' + (inboundLinks===1?'s':'') + ' to something in it. ' +
          'Deleting the module deletes all of it permanently and leaves those links broken. Continue?';
      } else if (recs.length){
        msg = 'This module has <strong>' + recs.length + '</strong> record' + (recs.length===1?'':'s') + '. Deleting the module deletes all of them permanently. Continue?';
      } else {
        msg = 'Delete this empty module?';
      }
      const ok = await confirmModal(msg);
      if (!ok) return;
      if (mod.shape === 'files'){
        for (const r of recs) if (r.attachment) await idbDeleteBlob(r.attachment.idbKey).catch(() => {});
      }
      state.modules = state.modules.filter(m => m.id !== mod.id);
      delete state.records[mod.id];
      closeModal();
      state.view = {type:'home'};
      render();
    }));
  }
  buttons.push(buttonEl('Cancel', 'btn-secondary', closeModal));
  buttons.push(buttonEl(isEdit ? 'Save' : 'Create module', 'btn-primary', () => {
    const draft = document.querySelector('.modal-body')._getDraft();
    if (!draft.name){ alert('Give the module a name.'); return; }
    if (isEdit){
      mod.name = draft.name;
      mod.fields = draft.fields;
      closeModal(); render();
    } else {
      const newMod = { id: uid('m'), name: draft.name, shape: draft.shape, role: null, fields: draft.fields, createdAt: Date.now() };
      state.modules.push(newMod);
      state.records[newMod.id] = [];
      closeModal();
      state.view = {type:'module', moduleId: newMod.id};
      render();
    }
  }));
  return buttons;
}

/* ---------- Record modal ---------- */
/* The file-upload field for a 'files'-shape record. Structural, like the
   built-in Notes field — not a configurable schema field, every record of
   this shape has exactly one. Nothing is written to IndexedDB until Save;
   picking a file here just stages it in `draft`. */
function buildAttachmentField(draft){
  const grp = el('div', 'field-group');
  grp.appendChild(el('label', 'field-label', 'File / photo'));
  const box = el('div', '');
  box.style.border = '1px solid var(--line-strong)'; box.style.borderRadius = '8px'; box.style.padding = '10px';

  function renderBox(){
    box.innerHTML = '';
    const hasCurrent = draft.attachment && !draft.removeAttachment;
    const hasPending = !!draft.pendingFile;
    if (hasPending){
      const row = el('div', ''); row.style.display = 'flex'; row.style.alignItems = 'center'; row.style.gap = '10px';
      row.appendChild(el('div', '', '📎 ' + draft.pendingFile.name + ' (' + humanFileSize(draft.pendingFile.size) + ') — will be saved'));
      box.appendChild(row);
    } else if (hasCurrent){
      const row = el('div', ''); row.style.display = 'flex'; row.style.alignItems = 'center'; row.style.gap = '10px';
      const isImg = (draft.attachment.mimeType || '').startsWith('image/');
      row.appendChild(el('div', '', (isImg ? '🖼️ ' : '📎 ') + draft.attachment.name + ' (' + humanFileSize(draft.attachment.size) + ')'));
      const openBtn = buttonEl('Open', 'btn-text', async () => {
        const rec2 = await idbGetBlob(draft.attachment.idbKey);
        if (!rec2){ alert('Couldn\'t find this file locally — it may not have finished saving.'); return; }
        const url = URL.createObjectURL(rec2.blob);
        window.open(url, '_blank');
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      });
      row.appendChild(openBtn);
      const rmBtn = buttonEl('Remove', 'btn-text', () => { draft.removeAttachment = true; renderBox(); });
      row.appendChild(rmBtn);
      box.appendChild(row);
    } else {
      box.appendChild(el('div', 'field-hint', 'No file attached yet.'));
    }
    const fileInput = document.createElement('input');
    fileInput.type = 'file'; fileInput.style.marginTop = '8px';
    fileInput.onchange = () => {
      const f = fileInput.files[0]; if (!f) return;
      draft.pendingFile = f; draft.removeAttachment = false;
      renderBox();
    };
    box.appendChild(fileInput);
  }
  renderBox();
  grp.appendChild(box);
  return grp;
}

function openRecordModal(mod, rec){
  const isEdit = !!rec;
  const draft = {
    fields: isEdit ? Object.assign({}, rec.fields) : {},
    notes: isEdit ? rec.notes : '',
    attachment: isEdit ? rec.attachment : null, // existing attachment metadata, unchanged unless replaced/removed below
    pendingFile: null,      // a newly chosen File, not yet written to IndexedDB
    removeAttachment: false,
  };

  openModal(isEdit ? ('Edit — ' + mod.name) : ('Add to ' + mod.name), (body) => {
    if (mod.shape === 'files'){
      body.appendChild(buildAttachmentField(draft));
    }
    mod.fields.forEach(f => {
      const grp = el('div', 'field-group');
      grp.appendChild(el('label', 'field-label', f.label));
      let input;
      if (f.type === 'longtext'){
        input = document.createElement('textarea');
        input.value = draft.fields[f.id] || '';
        input.oninput = () => draft.fields[f.id] = input.value;
      } else if (f.type === 'select'){
        input = document.createElement('select');
        (f.options||[]).forEach(opt => {
          const o = document.createElement('option'); o.value = opt; o.textContent = opt;
          if (draft.fields[f.id] === opt) o.selected = true;
          input.appendChild(o);
        });
        input.onchange = () => draft.fields[f.id] = input.value;
      } else if (f.type === 'checkbox'){
        input = document.createElement('input'); input.type = 'checkbox';
        input.checked = !!draft.fields[f.id];
        input.style.width = 'auto';
        input.onchange = () => draft.fields[f.id] = input.checked;
      } else if (f.type === 'date'){
        input = document.createElement('input'); input.type = 'date';
        input.value = draft.fields[f.id] || '';
        input.oninput = () => draft.fields[f.id] = input.value;
      } else if (f.type === 'time'){
        input = document.createElement('input'); input.type = 'time';
        input.value = draft.fields[f.id] || '';
        input.oninput = () => draft.fields[f.id] = input.value;
      } else if (f.type === 'number'){
        input = document.createElement('input'); input.type = 'number';
        input.value = draft.fields[f.id] || '';
        input.oninput = () => draft.fields[f.id] = input.value;
      } else if (f.type === 'link-one'){
        const targetMod = getModule(f.targetModuleId);
        input = document.createElement('select');
        if (!targetMod){
          input.disabled = true;
          input.appendChild(el('option','','(no target module set — edit this field in the schema first)'));
        } else {
          input.appendChild(el('option','','— none —'));
          moduleRecords(targetMod.id).forEach(r => {
            const o = document.createElement('option'); o.value = r.id; o.textContent = recordTitle(targetMod, r);
            if (draft.fields[f.id] === r.id) o.selected = true;
            input.appendChild(o);
          });
          input.onchange = () => draft.fields[f.id] = input.value || null;
        }
      } else if (f.type === 'link-many'){
        const targetMod = getModule(f.targetModuleId);
        input = el('div', '');
        input.style.border = '1px solid var(--line-strong)'; input.style.borderRadius = '8px';
        input.style.padding = '8px 10px'; input.style.maxHeight = '140px'; input.style.overflowY = 'auto';
        if (!targetMod || !moduleRecords(targetMod.id).length){
          input.appendChild(el('div', 'field-hint', targetMod ? 'No records in "' + escapeHtml(targetMod.name) + '" yet to link to.' : '(no target module set — edit this field in the schema first)'));
        } else {
          const current = new Set(Array.isArray(draft.fields[f.id]) ? draft.fields[f.id] : []);
          moduleRecords(targetMod.id).forEach(r => {
            const rowLabel = document.createElement('label');
            rowLabel.style.display = 'flex'; rowLabel.style.alignItems = 'center'; rowLabel.style.gap = '8px';
            rowLabel.style.padding = '4px 0'; rowLabel.style.fontSize = '13.5px';
            const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = current.has(r.id);
            cb.onchange = () => {
              if (cb.checked) current.add(r.id); else current.delete(r.id);
              draft.fields[f.id] = Array.from(current);
            };
            rowLabel.appendChild(cb);
            rowLabel.appendChild(document.createTextNode(recordTitle(targetMod, r)));
            input.appendChild(rowLabel);
          });
        }
      } else {
        input = document.createElement('input'); input.type = 'text';
        input.value = draft.fields[f.id] || '';
        input.oninput = () => draft.fields[f.id] = input.value;
      }
      grp.appendChild(input);
      body.appendChild(grp);
    });

    if (isEdit){
      const backlinks = getBacklinks(mod, rec);
      if (backlinks.length){
        const blGrp = el('div', 'field-group');
        blGrp.appendChild(el('label', 'field-label', 'Linked from'));
        const box = el('div', '');
        box.style.border = '1px solid var(--line)'; box.style.borderRadius = '8px'; box.style.padding = '4px 10px'; box.style.background = 'var(--surface-sunk)';
        backlinks.forEach(({mod: bMod, rec: bRec, field: bField}) => {
          const row = el('div', 'item-row');
          row.style.borderBottom = '1px solid var(--line)';
          const mainDiv = el('div', 'item-main');
          const t = el('div', 'item-title', recordTitle(bMod, bRec));
          t.onclick = () => { closeModal(); openRecordModal(bMod, bRec); };
          mainDiv.appendChild(t);
          mainDiv.appendChild(el('div', 'item-meta', bMod.name + ' · via "' + bField.label + '"'));
          row.appendChild(mainDiv);
          box.appendChild(row);
        });
        blGrp.appendChild(box);
        body.appendChild(blGrp);
      }
    }

    const notesGrp = el('div', 'field-group');
    notesGrp.appendChild(el('label', 'field-label', 'Notes'));
    const notesArea = document.createElement('textarea');
    notesArea.value = draft.notes || '';
    notesArea.placeholder = 'Anything else about this specific record.';
    notesArea.oninput = () => draft.notes = notesArea.value;
    notesGrp.appendChild(notesArea);
    body.appendChild(notesGrp);
  }, buildRecordFooter(mod, rec, draft));
}

function buildRecordFooter(mod, rec, draft){
  const buttons = [];
  if (rec){
    buttons.push(buttonEl('Delete', 'btn-danger', async () => {
      const backlinks = getBacklinks(mod, rec);
      const msg = backlinks.length
        ? '<strong>' + backlinks.length + '</strong> record' + (backlinks.length===1?'':'s') + ' link' + (backlinks.length===1?'s':'') +
          ' to this one. Deleting it leaves those links pointing at something that no longer exists — they’ll show as broken, not be cleaned up automatically. Delete anyway?'
        : 'Delete this record? This can’t be undone.';
      const ok = await confirmModal(msg);
      if (!ok) return;
      if (rec.attachment) await idbDeleteBlob(rec.attachment.idbKey).catch(() => {});
      state.records[mod.id] = moduleRecords(mod.id).filter(r => r.id !== rec.id);
      closeModal(); render();
    }));
  }
  buttons.push(buttonEl('Cancel', 'btn-secondary', closeModal));
  const saveBtn = buttonEl(rec ? 'Save' : 'Add', 'btn-primary', async () => {
    saveBtn.disabled = true;
    try {
      let attachment = draft.attachment;
      if (draft.pendingFile){
        // A new file replaces whatever was there before — clean up the old one.
        if (attachment) await idbDeleteBlob(attachment.idbKey).catch(() => {});
        const idbKey = uid('file');
        await idbPutBlob(idbKey, draft.pendingFile, draft.pendingFile.name, draft.pendingFile.type);
        attachment = { idbKey, name: draft.pendingFile.name, mimeType: draft.pendingFile.type, size: draft.pendingFile.size };
      } else if (draft.removeAttachment && attachment){
        await idbDeleteBlob(attachment.idbKey).catch(() => {});
        attachment = null;
      }
      if (rec){
        rec.fields = draft.fields; rec.notes = draft.notes; rec.attachment = attachment; rec.updatedAt = Date.now();
      } else {
        state.records[mod.id].push({ id: uid('r'), fields: draft.fields, notes: draft.notes, attachment, createdAt: Date.now(), updatedAt: Date.now() });
      }
      closeModal(); render();
    } catch(err){
      saveBtn.disabled = false;
      alert('Couldn\'t save the file (' + err.message + '). Everything else is unsaved too — try again.');
    }
  });
  buttons.push(saveBtn);
  return buttons;
}

function formatLastExported(){
  const ts = state.settings.lastExportedAt;
  if (!ts) return 'never';
  return formatDateTime(ts);
}

async function buildExportPayload(){
  // Deliberately excludes `settings` entirely — API keys and this device's
  // export schedule stay device-specific, never travel in a portable file.
  // File/photo attachments live in IndexedDB, not `state` — pull each one
  // in and base64-embed it so a single file is still the whole backup.
  // Known tradeoff, not hidden: lots of large photos means a large export
  // file. No attempt at compression or splitting into multiple files here.
  const modules = JSON.parse(JSON.stringify(state.modules));
  const records = JSON.parse(JSON.stringify(state.records));
  for (const mod of modules){
    if (mod.shape !== 'files') continue;
    for (const rec of (records[mod.id] || [])){
      if (!rec.attachment) continue;
      const stored = await idbGetBlob(rec.attachment.idbKey);
      if (stored) rec.attachment.data = await blobToBase64(stored.blob);
    }
  }
  return JSON.stringify({
    appVersion: 'note-goat-v1',
    exportedAt: Date.now(),
    modules,
    records,
  }, null, 2);
}

async function triggerExportDownload(auto){
  const payload = await buildExportPayload();
  const blob = new Blob([payload], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const dateStr = new Date().toISOString().slice(0, 10);
  const a = document.createElement('a');
  a.href = url; a.download = 'note-goat-backup-' + dateStr + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  state.settings.lastExportedAt = Date.now();
  saveState();
  showToast(auto ? 'Backup exported automatically.' : 'Backup exported.');
}

function openImportPicker(onDone){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'application/json,.json';
  input.onchange = async () => {
    const file = input.files[0]; if (!file) return;
    let parsed;
    try {
      const text = await file.text();
      parsed = JSON.parse(text);
      if (!parsed || !Array.isArray(parsed.modules) || typeof parsed.records !== 'object') throw new Error('not a Note Goat backup file');
    } catch(e){
      alert('Couldn\'t read that file as a Note Goat backup (' + e.message + ').');
      return;
    }
    const ok = await confirmModal('This replaces <strong>everything</strong> currently in Note Goat — ' +
      state.modules.length + ' module' + (state.modules.length===1?'':'s') + ' — with what\'s in this file (from ' +
      (parsed.exportedAt ? formatDateTime(parsed.exportedAt) : 'an unknown time') + '). This can\'t be undone. Continue?');
    if (!ok) return;
    // Attachments carry as base64 inside the file; re-store each one into
    // this device's IndexedDB under a fresh key (never trust an imported
    // key to still be free) before dropping the metadata into state.
    for (const mod of parsed.modules){
      if (mod.shape !== 'files') continue;
      for (const rec of (parsed.records[mod.id] || [])){
        if (!rec.attachment || !rec.attachment.data) continue;
        const blob = base64ToBlob(rec.attachment.data, rec.attachment.mimeType);
        const newKey = uid('file');
        try { await idbPutBlob(newKey, blob, rec.attachment.name, rec.attachment.mimeType); }
        catch(e){ console.warn('Could not restore attachment for', rec.id, e); }
        rec.attachment = { idbKey: newKey, name: rec.attachment.name, mimeType: rec.attachment.mimeType, size: rec.attachment.size };
      }
    }
    state.modules = parsed.modules;
    state.records = parsed.records;
    saveState();
    render();
    showToast('Import complete.');
    if (onDone) onDone();
  };
  input.click();
}

/* Checked once at startup: if a schedule is set and enough time has
   passed since the last export, export right now, quietly. Never prompts
   — the whole point of choosing a schedule over Manual is not having to
   decide each time. */
function checkScheduledExport(){
  const sched = state.settings.exportSchedule;
  if (!sched || sched === 'manual') return;
  const intervalMs = sched === 'daily' ? 24*60*60*1000 : 7*24*60*60*1000;
  const last = state.settings.lastExportedAt || 0;
  if (Date.now() - last >= intervalMs) triggerExportDownload(true);
}

function showToast(text){
  const t = document.createElement('div');
  t.textContent = text;
  t.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);' +
    'background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:20px;font-size:12.5px;' +

function tryInitGoogle(promptSignIn, onConnected, onFailed, _attempt){
  _attempt = _attempt || 0;
  if (!state.settings.googleClientId || !state.settings.googleApiKey){
    if (onFailed) onFailed('Google isn\'t configured — add a Client ID and API key under Connections first.');
    return;
  }
  if (typeof gapi === 'undefined' || typeof google === 'undefined'){
    // Google's own scripts may still be loading — retry briefly, but give up
    // and report failure rather than looping forever if they never show up
    // (offline, blocked, or the scripts genuinely failed to load).
    if (_attempt >= 10){
      if (onFailed) onFailed('Couldn\'t reach Google\'s sign-in — check your connection and try again.');
      return;
    }
    setTimeout(() => tryInitGoogle(promptSignIn, onConnected, onFailed, _attempt + 1), 500);
    return;
  }
  if (googleRt.tokenClient){
    if (promptSignIn) googleRt.tokenClient.requestAccessToken();
    return;
  }
  gapi.load('client', async () => {
    try {
      await gapi.client.init({
        apiKey: state.settings.googleApiKey,
        discoveryDocs: [
          'https://sheets.googleapis.com/$discovery/rest?version=v4',
          'https://www.googleapis.com/discovery/v1/apis/drive/v3/rest',
          'https://docs.googleapis.com/$discovery/rest?version=v1',
          'https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest',
        ],
      });
    } catch(e){
      console.warn('Google client init failed', e);
      if (onFailed) onFailed('Couldn\'t set up the Google connection (' + (e.message || 'check your API key') + ').');
      return;
    }
    googleRt.tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: state.settings.googleClientId,
      scope: 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/documents https://www.googleapis.com/auth/calendar.events',
      callback: (resp) => {
        if (resp.access_token){
          googleRt.accessToken = resp.access_token;
          googleRt.connected = true;
          gapi.client.setToken({ access_token: resp.access_token });
          if (onConnected) onConnected();
        }
      },
      error_callback: (err) => {
        console.error('Google sign-in error', err);
        if (onFailed) onFailed('Google sign-in didn\'t complete. If your browser blocked a popup, allow popups for this site and try again.');
        else alert('Google sign-in didn\'t complete. If your browser blocked a popup, allow popups for this site and try again.');
      },
    });
    if (promptSignIn) googleRt.tokenClient.requestAccessToken();
  });
}

/* ---------- Claude API (BYOK) ---------- */
const CLAUDE_API_URL = 'https://api.anthropic.com/v1/messages';
async function callClaude({ system, userContent, maxTokens }){
  if (!state.settings.anthropicKey) throw new Error('NO_KEY');
  const res = await fetch(CLAUDE_API_URL, {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': state.settings.anthropicKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-sonnet-5',
      max_tokens: maxTokens || 1024,
      system: system,
      messages: [{ role: 'user', content: userContent }],
    }),
  });
  if (!res.ok){
    let detail = '';
    try { detail = (await res.json()).error?.message || ''; } catch(e){}
    throw new Error(detail || ('HTTP ' + res.status));
  }
  const json = await res.json();
  const block = (json.content || []).find(b => b.type === 'text');
  return block ? block.text : '';
}
