      <section id="home">
        <p class="sec-num">01</p>
        <h2>The Home page</h2>
        <p>Four cards, deliberately not a dashboard trying to show everything: <b>Quick capture</b> (see below), and three collapsed cards — <b>Coming up</b> (every record in any module with a due date and not done, soonest first; a date that has already passed stays at the top marked "was due", except in Dated / scheduled modules, where a past appointment simply drops off), <b>Next steps</b> (unticked items from modules made with the Next Steps template — tick them done right on the card — plus every record in any other module with a Next step filled in), and <b>Unanswered questions</b> (open items from modules made with the Unanswered Questions template). Coming up and Next steps find the due date and next step the same way the Dashboard does — see "Which fields the Dashboard reads". Click a card's header to expand it into the full list; click a row's title to open that record.</p>
        <p>A bare count is avoided on purpose — you'll always see the soonest item alongside the number, not just a number with no content behind it.</p>
      </section>

      <section id="dashboard">
        <p class="sec-num">01b</p>
        <h2>The Dashboard</h2>
        <p>One screen across every module. Open it from <b>Dashboard</b> in the sidebar, next to Home. It only reads your records — it never changes them.</p>
        <ul class="plain">
          <li><b>Area cards</b> — one per module that has records: its name, how many records, and, if it has a List field, how many are in each choice (e.g. Current / Possibly dropped / Unclear). Tap a card to open that module.</li>
          <li><b>Overdue</b> — due date before today and not done. Oldest first.</li>
          <li><b>Due soon</b> — due date from today to <i>N</i> days ahead (14 to start with), not done. Soonest first.</li>
          <li><b>Gone quiet</b> — not changed in <i>M</i> days (21 to start with). Leaves out done records, records whose List is Unclear, and records whose Next step is "—" or "None set". Oldest first.</li>
          <li><b>Next steps</b> — every record with a Next step filled in, grouped by module. A Next step of "—" or "None set" counts as empty.</li>
        </ul>
        <p>Each row shows the record's title, its module, its due date and its next step. Tap the title to open the record. Change <i>N</i> and <i>M</i> at the top of the Dashboard; they're saved on this device only, like Settings, and don't go into a backup.</p>
        <h3>Which fields the Dashboard reads</h3>
        <p>It finds fields by name, so any module can take part — you don't set anything up:</p>
        <ul class="plain">
          <li><b>Due date</b> — a field with the id <code>due</code>; if there isn't one, the module's first Date field (so Appointments works as-is).</li>
          <li><b>Next step</b> — a field with the id <code>next</code>, or labelled "Next step" (any capitals).</li>
          <li><b>List</b> — a Choice list field with the id <code>list</code>, or labelled "List". A record with nothing picked counts as the first choice, the same as the form shows.</li>
          <li><b>Done</b> — the record's <code>done</code> checkbox is ticked (as in checklist modules).</li>
        </ul>
        <p>"Changed" means the last time the record was saved. Only templates set ids like <code>due</code> or <code>done</code>; a field you add yourself gets a random id, so for those the label is what counts — and its Due date is simply the module's first Date field.</p>
      </section>

      <section id="modules">
        <p class="sec-num">02</p>
        <h2>Modules &amp; the Library</h2>
        <p>A <b>module</b> is a named category with its own fields — Contacts, Bills, Projects, whatever you need. Every module has a <b>shape</b> that decides how its records are displayed and which sync targets make sense for it: repeating rows (a table), freeform notes, a checklist, a dated/scheduled thing, or a file/photo.</p>
        <p>Open the <b>Library</b> (sidebar) to add one. Three ways in:</p>
        <ol class="steps">
          <li><b>Pick a template</b> — the Starters: Checklist, Notes, Next Steps, Unanswered Questions, Files &amp; Photos, and Appointments (What, Date, Time, Where). Unanswered Questions feeds the Home card of the same name, and Next Steps items show on the Next steps card with a tick box. (Coming up and Next steps also read every other module.) Name it whatever you want; templates are a starting point, not a locked configuration.</li>
          <li><b>Describe what you need</b> — the prominent option under Custom. Tell the AI what you're trying to track and it proposes a name, shape, fields, and links to modules you already have. Nothing is created yet — you land in the ordinary module editor with that proposal pre-filled, free to change anything, and you still click Create.</li>
          <li><b>Advanced: build it yourself</b> — the small link under the AI option. Pick a shape and add fields one at a time, no AI involved. Same editor either way.</li>
        </ol>
        <p>A module you've created lives in the sidebar. Click its ⚙ to edit its fields later.</p>
      </section>

      <section id="records">
        <p class="sec-num">03</p>
        <h2>Records &amp; notes</h2>
        <p>Inside a module, <b>+ Add record</b> opens a form for that module's fields. Every record — regardless of shape — also gets a built-in <b>Notes</b> field automatically; you never have to add it yourself.</p>
        <p>How a module's records are shown depends on its shape: a table for repeating rows, a checklist with checkboxes, note cards for freeform notes, a date-sorted list for scheduled things, and a thumbnail grid for files (see below).</p>
      </section>

      <section id="schema">
        <p class="sec-num">04</p>
        <h2>Editing a module later</h2>
        <p>Open a module's ⚙ any time to add, rename, retype, or remove fields — even after it already has records in it. Fields can't be reordered; new ones go at the end.</p>
        <ul class="plain">
          <li>Changes apply when you click <b>Save</b>; <b>Cancel</b> discards them.</li>
          <li>Removing a field <i>with data in it</i> asks you to confirm first, naming how many records have data in it.</li>
          <li>A type change that some existing values don't fit (turning a field with "555-CALL" in it into a Number, say) is refused outright, with an error saying how many records don't fit and showing one of the values — never applied halfway. Fix that data first, then change the type.</li>
        </ul>
        <p>A module's <b>shape</b> can't be changed after creation — make a new module if you need a different one.</p>
      </section>

      <section id="links">
        <p class="sec-num">05</p>
        <h2>Links between modules</h2>
        <p>A field can be a <b>Link — one record</b> or <b>Link — many records</b>, pointing at records in another module (add one from a module's ⚙, same as any field, then choose which module it links to). You always pick the link yourself from a list — nothing is guessed or inferred from content.</p>
        <p>Open any record and you'll see two things beyond its own fields: what it links <i>to</i>, and — if anything points at it — a <b>Linked from</b> section showing what links <i>to it</i>. Every row is clickable, so you can hop from one record to the records it's connected to and back.</p>
        <div class="note">Deleting something other records link to warns you first, naming how many. If a link ever goes stale another way, it shows as "linked record no longer exists" rather than silently disappearing.</div>
      </section>

      <section id="files">
        <p class="sec-num">06</p>
        <h2>File / photo modules</h2>
        <p>A module can have the <b>File / photo</b> shape — one uploaded file or photo per record, for things you want to keep, like a scanned card, a receipt, or a document. Every record of this shape has a built-in upload field, the same way every record has a built-in Notes field.</p>
        <p>Files are stored on this device, in your browser's local file storage (IndexedDB) — never uploaded to Google Drive or anywhere else. Open a record to view or download its file, or remove it. Photos, PDFs and plain text open in a new tab; any other kind of file downloads instead, so a file can never run as part of this app.</p>
        <div class="note">This is a completely separate feature from Quick Capture's photo input (below). Quick Capture's photo is used once, to help AI write a clean note, and then discarded — nothing about it is kept. A File / photo module record keeps the actual file, on purpose, with no AI involved at all.</div>
      </section>

      <section id="capture">
        <p class="sec-num">07</p>
        <h2>Quick Capture &amp; AI cleanup</h2>
        <p>The card at the top of Home. Type or paste a quick note and <b>Save note</b> — it's filed straight into your first Notes module (Personal Notes, to start with), no AI required.</p>
        <p>If you'd rather hand it a photo of messy handwritten or typed notes, attach one, then <b>Clean up with AI</b>. It reads the photo (and any typed text alongside it) and rewrites it into one organized note, shown in the box for you to edit — nothing saves until you click Save note. Needs your Anthropic key under Settings; the photo itself is never kept, only the resulting text.</p>
        <p>If a photo is genuinely illegible, the note says so rather than guessing at what it can't read.</p>
      </section>

      <section id="sync">
        <p class="sec-num">08</p>
        <h2>Sync</h2>
        <p>Open a module and click <b>Sync</b> to push it to Google Sheets, Docs, or Calendar — one-way only, on demand. Nothing is ever read back from Google; editing something on the Google side won't reflect back here.</p>
        <p>Which targets are offered depends on the module's shape. A natural fit syncs straight away; a workable-but-lossy fit asks you to confirm first and says what will be lost; a combination that wouldn't make sense shows as <b>Not available</b>, with the reason.</p>
        <ul class="plain">
          <li><b>Repeating rows</b> — Sheets; Docs asks first; no Calendar.</li>
          <li><b>Freeform notes</b> — Docs; Sheets asks first; no Calendar.</li>
          <li><b>Checklist</b> — Sheets asks first; no Docs or Calendar.</li>
          <li><b>Dated / scheduled</b> — Calendar; Sheets asks first; no Docs.</li>
          <li><b>File / photo</b> — not synced anywhere; files stay on this device.</li>
        </ul>
        <p>Where things land: Sheets sync uses one spreadsheet, <b>Note Goat Sync</b>, with a tab per module, rewritten on every sync; Docs sync makes one document per module, <b>Note Goat — <i>module name</i></b>, also rewritten on every sync. Both go in a <b>Note Goat</b> folder in your Drive. Calendar sync goes to your main calendar: records without a date are skipped, and syncing again updates the events it made before and removes events for records you've since deleted here or whose date you've cleared.</p>
        <p>Needs your own Google Cloud project, connected under Settings. Note Goat can only reach Drive files it created itself, plus your calendar events — a Sheet or Doc made some other way, or with a different Client ID, can't be reached, and syncing to it fails with an error.</p>
        <p>Calendar sync adds a popup reminder to every event it pushes — 9am the day before for an all-day event (a Date field only), or 24 hours before for a timed one (see below). It's on by default; the <b>Reminder</b> checkbox next to Google Calendar in this Sync screen turns it off for this module, remembered from then on.</p>
        <p>A dated/scheduled module can add an optional <b>Time</b> field alongside its Date field. Fill one in on a record and that record syncs as a real 1-hour timed event instead of all-day, in your browser's own timezone; records with no time keep syncing all-day, unchanged.</p>
      </section>

      <section id="settings">
        <p class="sec-num">09</p>
        <h2>Settings: keys &amp; connections</h2>
        <p>The ⚙ Settings button (sidebar) holds two connections, both stored only in this browser and used only for the direct calls this app makes:</p>
        <ol class="steps">
          <li><b>Anthropic API key</b> — powers Quick Capture's AI cleanup and AI-assisted module creation.</li>
          <li><b>Google Client ID + API key</b>, from your own free Google Cloud project — powers Sync. Click Connect / Sign in each session; the sign-in itself doesn't persist across a reload, by design. Google's own window asks you to approve access the first time.</li>
        </ol>
      </section>

      <section id="drivesync">
        <p class="sec-num">10a</p>
        <h2>Sync between devices (Google Drive)</h2>
        <p>Keeps your phone and computer in step through one file in your own Google Drive: <b>Note Goat Sync.json</b>, in the <b>Note Goat</b> folder. It holds exactly what Export makes — every module and record, with files/photos — and never your keys or settings.</p>
        <ol class="steps">
          <li>When the app opens, a bar at the top says <b>Tap to sync</b>. Tap it and sign in to Google. Note Goat asks only to see files it made itself, not the rest of your Drive.</li>
          <li>It compares the Drive copy with this device. If Drive is newer, it loads it. If this device is newer, it saves to Drive.</li>
          <li>If <b>both</b> changed since this device last synced, it shows both dates and <b>what differs</b>: for each module, how many records were added, removed or changed on this device and in Drive. Pick which copy to keep; the other is replaced. Nothing is ever merged, and nothing is overwritten without asking. <b>Export this device first</b> downloads a normal Export of this device and keeps the box open. <b>Decide later</b> leaves both alone.</li>
          <li>After that, while you're signed in, every change saves to Drive a few seconds after you stop editing — or straight away when you switch apps or close the page.</li>
          <li>Every sync first checks there is exactly one sync file in Drive, and that it's the one this device uses. If there are two (say, each device made its own), or a file this device hasn't used before, nothing is saved: it lists each copy with its last-saved date and you pick which one to use. The others aren't deleted — they're renamed "(not in use)" and stop being used. A new device sees this once, on its first sync.</li>
        </ol>
        <p>The bar always says where things stand: <b>Synced at</b> a time, <b>Saving…</b>, <b>Not signed in</b>, <b>Offline</b>, or <b>Error</b> with the reason. If this device has changes that aren't in Drive yet — for example after sign-in expired — the bar turns gold and says <b>Unsynced changes on this device. Tap to sync</b>. If you're offline or sign-in fails, the app keeps working on this device and says so; tap the bar again later.</p>
        <p>Before the first sync, add your Google <b>Client ID</b> under Settings — the same one on every device, or the devices can't see each other's file. Sync needs only the Client ID and the Drive API; the API key is only for Sheets/Docs/Calendar. A device that has nothing in it yet just loads the Drive copy on its first sync; one that already has records asks first.</p>
        <p>The <b>Note Goat</b> folder is found by a hidden tag, not by where it is, so you can move it anywhere in your Drive and Note Goat keeps using it instead of making a new one. The sync file is found the same way.</p>
        <p>If the file gets big (over 10 MB, usually from photos), the bar says so — syncing still works, just slower. Each device remembers when it last synced in its own Settings; that isn't in the file.</p>
      </section>

      <section id="backup">
        <p class="sec-num">10</p>
        <h2>Backup &amp; transfer</h2>
        <p>Also under Settings. <b>Export</b> writes one file with everything in the app — every module, every record, every file/photo — except what's in Settings (your keys, Google setup and export schedule), which stays on this device. Move that file however you'd move any file (AirDrop, email to yourself, a cloud-drive folder) and use <b>Import</b> on the other device to read it back in.</p>
        <p>Import always asks you to confirm first, naming what it's about to replace — it's a full restore, not a merge. (To keep devices in step automatically, use Drive sync, above.) A damaged or hand-edited file is refused with a reason, and nothing is replaced.</p>
        <p>Set Export to <b>Daily</b> or <b>Weekly</b> instead of Manual and the app checks, once, the next time you open it — if it's overdue, it exports quietly with a small confirmation, no prompt. That's not a true background schedule (nothing can run while the app is closed, especially on iPhone) — it's "checked whenever you happen to open it," which works out the same in practice if you use the app regularly.</p>
      </section>

      <section id="privacy">
        <p class="sec-num">11</p>
        <h2>Data &amp; privacy</h2>
        <p>Everything lives in this browser: module and record data in <code>localStorage</code>, file/photo bytes in IndexedDB. No account, no server of ours. The only network calls this app makes are the ones you trigger — an Anthropic call for AI capture or module setup, a Google call when you click Sync — using the keys you supplied. Fonts are built in. Google's sign-in scripts load when the app opens only if a Google Client ID is saved in Settings (so the sync bar's sign-in opens straight away); without one, they load only when you open Settings or a module's Sync window. Drive sync talks only to Google Drive, using your own Google sign-in.</p>
      </section>

      <section id="phone">
        <p class="sec-num">12</p>
        <h2>Installing on your phone</h2>
        <p>Once this app is hosted somewhere over <code>https://</code> (e.g. GitHub Pages), your browser's "Add to Home Screen" / "Install app" option gives it a real icon and name instead of just a bookmark, plus a minimal offline shell.</p>
      </section>

      <section id="limits">
        <p class="sec-num">13</p>
        <h2>Known limits</h2>
        <ul class="plain">
          <li>Nothing here can stop a browser's own "clear site data" from wiping everything — that's a browser boundary, not something any web page can override. Regular Export is the real protection.</li>
          <li>Import replaces everything currently in the app; it doesn't merge two devices' changes together. Drive sync doesn't merge either — when both copies changed, you pick one.</li>
          <li>Drive sync needs one tap each time you open the app, and again after about an hour, because Google's sign-in isn't kept.</li>
          <li>A backup file with lots of large photos in it will itself be large — no compression is attempted.</li>
          <li>Changes reach Google only when you click Sync — deleting a record here takes it out of Sheets, Docs and Calendar at that module's next sync, not straight away.</li>
          <li>On another device, Sheets sync starts a new <b>Note Goat Sync</b> spreadsheet — which spreadsheet to use is a Settings item and doesn't travel in a backup.</li>
          <li>AI cleanup quality depends on how legible the input is; a genuinely illegible photo produces a note that says so, not a confident guess.</li>
        </ul>
      </section>

      <footer>Note Goat is a self-contained page — this manual describes its behavior as installed, based on how the app itself is built. It has no version number to cite.</footer>
    </main>
  </div>
</div>
