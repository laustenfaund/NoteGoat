      } catch(err){
        btn.disabled = false; btn.textContent = origText;
        const msg = err.message === 'NO_KEY' ? NO_ANTHROPIC_KEY_MSG
          : 'Couldn\'t get a proposal (' + err.message + '). You can try again, or build the module manually instead.';
        body._errBox.innerHTML = '';
        body._errBox.appendChild(el('div', 'error-box', msg));
      }
    }),
  ]);
}

const AI_FIELD_TYPE_NAMES = 'text (short text), longtext (long text), date, time, number, select (choice list), checkbox, link-one (links to one record in another module), link-many (links to several records in another module)';

async function proposeModuleFromAI(description){
  const moduleNames = state.modules.map(m => m.name);
  const system = [
    'You are helping someone design a new module (a record type) for Note Goat, a personal organizer app.',
    'A module has a name, a "shape" (table = repeating rows of similar records; notes = freeform long-form entries with no custom fields; checklist = simple done/not-done items; event = things with a date; files = one uploaded file/photo per record, e.g. scanned documents), and a list of fields.',
    'Available field types: ' + AI_FIELD_TYPE_NAMES + '.',
    'Existing modules the person already has, that new fields can link to if it genuinely makes sense: ' + (moduleNames.length ? moduleNames.join(', ') : '(none yet)') + '.',
    'Only propose a link-one/link-many field when it clearly matches one of those existing module names — otherwise just use a plain text field instead.',
    'Keep the field list focused — only what the description actually asks for, not everything imaginable.',
    '',
    'Respond in exactly this format and nothing else:',
    'NAME: <a short module name>',
    'SHAPE: <table|notes|checklist|event>',
    'FIELDS:',
    '- <field label> | <type> | <for select: comma-separated options — for link-one/link-many: the exact existing module name it links to — otherwise blank>',
    '(one line per field; if shape is notes, this section can be empty)',
    'RATIONALE: <one sentence explaining the shape and field choices, written to the person, e.g. "A table works well since you\'ll have one row per..."> ',
  ].join('\n');
  const text = await callClaude({ system, userContent: description, maxTokens: 700 });
  return parseAIModuleProposal(text);
}

function parseAIModuleProposal(text){
  const lines = text.split('\n');
  let name = '', shape = 'table', rationale = '';
  const fields = [];
  let inFields = false;
  lines.forEach(line => {
    const l = line.trim();
    if (/^NAME:/i.test(l)) { name = l.replace(/^NAME:/i, '').trim(); inFields = false; }
    else if (/^SHAPE:/i.test(l)) { const s = l.replace(/^SHAPE:/i, '').trim().toLowerCase(); if (SHAPES[s]) shape = s; inFields = false; }
    else if (/^FIELDS:/i.test(l)) { inFields = true; }
    else if (/^RATIONALE:/i.test(l)) { rationale = l.replace(/^RATIONALE:/i, '').trim(); inFields = false; }
    else if (inFields && l.startsWith('-')) {
      const parts = l.slice(1).split('|').map(p => p.trim());
      const label = parts[0] || 'Field';
      let type = (parts[1] || 'text').toLowerCase();
      if (!FIELD_TYPES[type]) type = 'text';
      const field = { id: uid('f'), label, type };
      const extra = parts[2] || '';
      if (type === 'select' && extra) field.options = extra.split(',').map(s => s.trim()).filter(Boolean);
      if ((type === 'link-one' || type === 'link-many') && extra){
        const targetMod = state.modules.find(m => m.name.toLowerCase() === extra.toLowerCase());
        if (targetMod) field.targetModuleId = targetMod.id;
        else field.type = 'text'; // named a module we don't actually have — degrade rather than create a dangling link
      }
      fields.push(field);
    }
  });
  if (!name) throw new Error('couldn\'t make sense of the response');
  return { name, shape, fields, rationale: rationale || 'Here\'s a proposed module based on what you described.' };
}

/* ---------- Schema (create / edit module) modal ----------
   `prefill` (create mode only) seeds the form from an AI-proposed draft
   {name, shape, fields, rationale} — still fully editable, nothing is
   created until the person reviews it and clicks Create, same as picking
   a Library template. */
function openSchemaModal(mod, prefill){
  const isEdit = !!mod;
  let draftFields = isEdit ? JSON.parse(JSON.stringify(mod.fields)) : (prefill ? prefill.fields : []);
  let draftShape = isEdit ? mod.shape : (prefill ? prefill.shape : 'table');

  openModal(isEdit ? 'Edit module' : 'Build a module', (body) => {
    if (prefill && prefill.rationale){
      body.appendChild(el('div', 'shape-note', '✨ ' + prefill.rationale + ' Review and adjust anything below before creating it.'));
    }
    const nameGrp = el('div', 'field-group');
    const nameLabel = el('label', 'field-label', 'Module name');
    nameGrp.appendChild(nameLabel);
    const nameInput = document.createElement('input');
    nameInput.type = 'text'; nameInput.className = 'field-input';
    nameInput.value = isEdit ? mod.name : (prefill ? prefill.name : '');
    linkLabel(nameLabel, nameInput);
    nameGrp.appendChild(nameInput);
    body.appendChild(nameGrp);

    const shapeGrp = el('div', 'field-group');
    const shapeLabel = el('label', 'field-label', 'Shape');
    shapeGrp.appendChild(shapeLabel);
    const shapeSelect = document.createElement('select');
    linkLabel(shapeLabel, shapeSelect);
    Object.keys(SHAPES).forEach(k => {
      const opt = document.createElement('option'); opt.value = k; opt.textContent = SHAPES[k].label;
      if (k === draftShape) opt.selected = true;
      shapeSelect.appendChild(opt);
    });
    if (isEdit) shapeSelect.disabled = true;
    shapeGrp.appendChild(shapeSelect);
    const shapeHint = el('div', 'field-hint', isEdit ? 'A module’s shape can’t be changed after it’s created — make a new module if you need a different shape.' : SHAPES[draftShape].hint);
    shapeGrp.appendChild(shapeHint);
    shapeSelect.onchange = () => { draftShape = shapeSelect.value; shapeHint.textContent = SHAPES[draftShape].hint; };
    body.appendChild(shapeGrp);

    const fieldsLabel = el('label', 'field-label', 'Fields');
    body.appendChild(fieldsLabel);
    const fieldsList = el('div', '');
    body.appendChild(fieldsList);

    function renderFieldsList(){
      fieldsList.innerHTML = '';
      draftFields.forEach((f, idx) => {
        const wrapper = el('div', '');
        const row = el('div', 'schema-field-row');
        const labelInput = document.createElement('input');
        labelInput.type = 'text'; labelInput.value = f.label; labelInput.placeholder = 'Field label';
        labelInput.setAttribute('aria-label', 'Field ' + (idx + 1) + ' name');
        labelInput.oninput = () => { f.label = labelInput.value; };
        row.appendChild(labelInput);
        const typeSelect = document.createElement('select');
        typeSelect.setAttribute('aria-label', 'Field ' + (idx + 1) + ' type');
        Object.keys(FIELD_TYPES).forEach(tk => {
          const opt = document.createElement('option'); opt.value = tk; opt.textContent = FIELD_TYPES[tk].label;
          if (tk === f.type) opt.selected = true;
          typeSelect.appendChild(opt);
        });
        typeSelect.onchange = () => {
          // Re-render only on success: a refusal shows an error box in this
          // list, and re-rendering would wipe it before anyone saw it.
          if (attemptFieldTypeChange(f, typeSelect.value, typeSelect)) renderFieldsList();
        };
        row.appendChild(typeSelect);
        const rm = document.createElement('button');
        rm.className = 'rm-field'; rm.textContent = '✕'; rm.title = 'Remove field';
        rm.setAttribute('aria-label', 'Remove field ' + (f.label || (idx + 1)));
        rm.onclick = async () => { await attemptFieldRemoval(f, idx); };
        row.appendChild(rm);
        wrapper.appendChild(row);

        if (FIELD_TYPES[f.type] && FIELD_TYPES[f.type].isLink){
          const linkRow = el('div', 'schema-field-row');
          linkRow.style.marginTop = '-4px';
          const targetSelect = document.createElement('select');
          const noneOpt = document.createElement('option');
          noneOpt.value = ''; noneOpt.textContent = 'Links to… (choose a module)';
          targetSelect.appendChild(noneOpt);
          state.modules.forEach(m => {
            const opt = document.createElement('option'); opt.value = m.id; opt.textContent = m.name;
            if (f.targetModuleId === m.id) opt.selected = true;
            targetSelect.appendChild(opt);
          });
          targetSelect.onchange = () => { f.targetModuleId = targetSelect.value || null; };
          linkRow.appendChild(targetSelect);
          wrapper.appendChild(linkRow);
        }
        fieldsList.appendChild(wrapper);
      });
    }

    async function attemptFieldRemoval(f, idx){
      const recs = isEdit ? moduleRecords(mod.id) : [];
      const withData = recs.filter(r => r.fields[f.id] !== undefined && r.fields[f.id] !== '' && r.fields[f.id] !== false);
      if (withData.length){
        const ok = await confirmModal('<strong>' + withData.length + '</strong> record' + (withData.length===1?'':'s') +
          ' currently ' + (withData.length===1?'has':'have') + ' data in "<strong>' + escapeHtml(f.label) +
          '</strong>." Deleting this field removes that data permanently. Continue?');
        if (!ok) return;
      }
      draftFields.splice(idx, 1);
      renderFieldsList();
    }

    function attemptFieldTypeChange(f, newType, selectEl){
      const recs = isEdit ? moduleRecords(mod.id) : [];
      const badValues = [];
      const wasLink = FIELD_TYPES[f.type] && FIELD_TYPES[f.type].isLink;
      const willBeLink = FIELD_TYPES[newType] && FIELD_TYPES[newType].isLink;
      if (newType === 'number' || newType === 'date' || newType === 'time'){
        recs.forEach(r => {
          const v = r.fields[f.id];
          if (v === undefined || v === '' || v === null) return;
          if (newType === 'number' && isNaN(Number(v))) badValues.push({r, v});
          if (newType === 'date' && isNaN(Date.parse(v))) badValues.push({r, v});
          if (newType === 'time' && !/^\d{2}:\d{2}$/.test(v)) badValues.push({r, v});
        });
      }
      if (willBeLink && !wasLink){
        recs.forEach(r => { if (r.fields[f.id] !== undefined && r.fields[f.id] !== '') badValues.push({r, v: r.fields[f.id]}); });
      }
      if (wasLink && !willBeLink){
        recs.forEach(r => { if (linkFieldValueIds(f, r).length) badValues.push({r, v: '(a link)'}); });
      }
      if (badValues.length){
        showFieldTypeError(f, newType, badValues, mod);
        selectEl.value = f.type; // revert visually, edit refused
        return false;
      }
      f.type = newType;
      if (willBeLink && !f.targetModuleId) f.targetModuleId = null;
      if (newType === 'select' && !f.options) f.options = [];
      return true;
    }

    function showFieldTypeError(f, newType, badValues, mod){
      const box = el('div', 'error-box',
        'Can’t change "' + f.label + '" to ' + FIELD_TYPES[newType].label.toLowerCase() + ' — ' +
        badValues.length + ' record' + (badValues.length===1?'':'s') + ' ' + (badValues.length===1?'has':'have') +
        ' a value that doesn’t fit (e.g. "' + String(badValues[0].v) + '"). Fix that data first, or leave the field as it is.');
      fieldsList.appendChild(box);
      setTimeout(() => box.remove(), 6000);
    }

    renderFieldsList();

    const addBtn = document.createElement('button');
    addBtn.className = 'btn btn-secondary add-field-btn';
    addBtn.textContent = '+ Add field';
    addBtn.onclick = () => {
      draftFields.push({ id: uid('f'), label: 'New field', type: 'text' });
      renderFieldsList();
    };
    body.appendChild(addBtn);
    body.appendChild(el('div', 'field-hint', 'Every record also gets a built-in Notes field automatically — no need to add one.'));

    body._nameInput = nameInput;
    body._getDraft = () => ({ name: nameInput.value.trim(), shape: draftShape, fields: draftFields });
  }, buildSchemaFooter(mod, isEdit), { isDirty: () => schemaSig() !== startSchemaSig });
  const schemaBody = modalRoot.querySelector('.modal-body');
  const schemaSig = () => JSON.stringify(schemaBody._getDraft());
  const startSchemaSig = schemaSig();
}

function buildSchemaFooter(mod, isEdit){
  const buttons = [];
  if (isEdit){
    buttons.push(buttonEl('Delete module', 'btn-danger', async () => {
      const recs = moduleRecords(mod.id);
      const inboundLinks = backlinksForModule(mod);
      let msg;
      if (recs.length && inboundLinks){
        msg = 'This module has <strong>' + recs.length + '</strong> record' + (recs.length===1?'':'s') + ', and <strong>' + inboundLinks +
          '</strong> record' + (inboundLinks===1?'':'s') + ' elsewhere link' + (inboundLinks===1?'s':'') + ' to something in it. ' +
          'Deleting the module deletes all of it permanently and leaves those links broken. Continue?';
      } else if (recs.length){
        msg = 'This module has <strong>' + recs.length + '</strong> record' + (recs.length===1?'':'s') + '. Deleting the module deletes all of them permanently. Continue?';
      } else {
        msg = 'Delete this empty module?';
      }
      const ok = await confirmModal(msg);
      if (!ok) return;
      if (mod.shape === 'files'){
        for (const r of recs) if (r.attachment) await idbDeleteBlob(r.attachment.idbKey).catch(() => {});
      }
      state.modules = state.modules.filter(m => m.id !== mod.id);
      delete state.records[mod.id];
      closeModal();
      state.view = {type:'home'};
      render();
    }));
  }
  buttons.push(buttonEl('Cancel', 'btn-secondary', closeModal));
  buttons.push(buttonEl(isEdit ? 'Save' : 'Create module', 'btn-primary', () => {
    const draft = document.querySelector('.modal-body')._getDraft();
    if (!draft.name){ alert('Give the module a name.'); return; }
    if (isEdit){
      mod.name = draft.name;
      mod.fields = draft.fields;
      closeModal(); render();
    } else {
      const newMod = { id: uid('m'), name: draft.name, shape: draft.shape, role: null, fields: draft.fields, createdAt: Date.now() };
      state.modules.push(newMod);
      state.records[newMod.id] = [];
      closeModal();
      state.view = {type:'module', moduleId: newMod.id};
      render();
    }
  }));
  return buttons;
}

/* ---------- Record modal ---------- */
/* The file-upload field for a 'files'-shape record. Structural, like the
   built-in Notes field — not a configurable schema field, every record of
   this shape has exactly one. Nothing is written to IndexedDB until Save;
   picking a file here just stages it in `draft`. */
function buildAttachmentField(draft){
  const grp = el('div', 'field-group');
  grp.appendChild(el('label', 'field-label', 'File / photo'));
  const box = el('div', '');
  box.style.border = '1px solid var(--line-strong)'; box.style.borderRadius = '8px'; box.style.padding = '10px';

  function renderBox(){
    box.innerHTML = '';
    const hasCurrent = draft.attachment && !draft.removeAttachment;
    const hasPending = !!draft.pendingFile;
    if (hasPending){
      const row = el('div', ''); row.style.display = 'flex'; row.style.alignItems = 'center'; row.style.gap = '10px';
      row.appendChild(el('div', '', '📎 ' + draft.pendingFile.name + ' (' + humanFileSize(draft.pendingFile.size) + ') — will be saved'));
      box.appendChild(row);
    } else if (hasCurrent){
      const row = el('div', ''); row.style.display = 'flex'; row.style.alignItems = 'center'; row.style.gap = '10px';
      const isImg = (draft.attachment.mimeType || '').startsWith('image/');
      row.appendChild(el('div', '', (isImg ? '🖼️ ' : '📎 ') + draft.attachment.name + ' (' + humanFileSize(draft.attachment.size) + ')'));
      // A blob: URL runs with this page's origin, so an HTML or SVG file
      // opened in a tab could run script here and read every saved key on
      // this site. Only types that can't run script open in a tab; anything
      // else downloads instead.
      const mime = (draft.attachment.mimeType || '').toLowerCase();
      const opensInline = SAFE_INLINE_MIME.test(mime);
      const openBtn = buttonEl(opensInline ? 'Open' : 'Download', 'btn-text', async () => {
        const rec2 = await idbGetBlob(draft.attachment.idbKey);
        if (!rec2){ alert('Couldn\'t find this file locally — it may not have finished saving.'); return; }
        const url = URL.createObjectURL(new Blob([rec2.blob], { type: opensInline ? mime : 'application/octet-stream' }));
        if (opensInline){
          window.open(url, '_blank');
        } else {
          const a = document.createElement('a');
          a.href = url; a.download = draft.attachment.name || 'file';
          document.body.appendChild(a); a.click(); a.remove();
        }
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      });
      row.appendChild(openBtn);
      const rmBtn = buttonEl('Remove', 'btn-text', () => { draft.removeAttachment = true; renderBox(); });
      row.appendChild(rmBtn);
      box.appendChild(row);
    } else {
      box.appendChild(el('div', 'field-hint', 'No file attached yet.'));
    }
    const fileInput = document.createElement('input');
    fileInput.type = 'file'; fileInput.style.marginTop = '8px';
    fileInput.onchange = () => {
      const f = fileInput.files[0]; if (!f) return;
      draft.pendingFile = f; draft.removeAttachment = false;
      renderBox();
    };
    box.appendChild(fileInput);
  }
  renderBox();
  grp.appendChild(box);
  return grp;
}

function openRecordModal(mod, rec){
  const isEdit = !!rec;
  const draft = {
    fields: isEdit ? Object.assign({}, rec.fields) : {},
    notes: isEdit ? rec.notes : '',
    attachment: isEdit ? rec.attachment : null, // existing attachment metadata, unchanged unless replaced/removed below
    pendingFile: null,      // a newly chosen File, not yet written to IndexedDB
    removeAttachment: false,
  };

  openModal(isEdit ? ('Edit — ' + mod.name) : ('Add to ' + mod.name), (body) => {
    if (mod.shape === 'files'){
      body.appendChild(buildAttachmentField(draft));
    }
    mod.fields.forEach(f => {
      const grp = el('div', 'field-group');
      const labelEl = el('label', 'field-label', f.label);
      grp.appendChild(labelEl);
      let input;
      if (f.type === 'longtext'){
        input = document.createElement('textarea');
        input.value = draft.fields[f.id] || '';
        input.oninput = () => draft.fields[f.id] = input.value;
      } else if (f.type === 'select'){
        input = document.createElement('select');
        const opts = (f.options || []).slice();
        // What the box shows is what gets saved: an unpicked list starts on
        // its first option (it used to show that option but save nothing),
        // and a stored value that's no longer an option stays visible
        // rather than silently showing — and saving — a different one.
        const cur = draft.fields[f.id];
        if (cur && !opts.includes(cur)) opts.unshift(cur);
        if (!cur && opts.length) draft.fields[f.id] = opts[0];
        opts.forEach(opt => {
          const o = document.createElement('option'); o.value = opt; o.textContent = opt;
          if (draft.fields[f.id] === opt) o.selected = true;
          input.appendChild(o);
        });
        input.onchange = () => draft.fields[f.id] = input.value;
      } else if (f.type === 'checkbox'){
        input = document.createElement('input'); input.type = 'checkbox';
        input.checked = !!draft.fields[f.id];
        input.style.width = 'auto';
        input.onchange = () => draft.fields[f.id] = input.checked;
      } else if (f.type === 'date'){
        input = document.createElement('input'); input.type = 'date';
        input.value = draft.fields[f.id] || '';
        input.oninput = () => draft.fields[f.id] = input.value;
      } else if (f.type === 'time'){
        input = document.createElement('input'); input.type = 'time';
        input.value = draft.fields[f.id] || '';
        input.oninput = () => draft.fields[f.id] = input.value;
      } else if (f.type === 'number'){
        input = document.createElement('input'); input.type = 'number';
        input.value = draft.fields[f.id] || '';
        input.oninput = () => draft.fields[f.id] = input.value;
      } else if (f.type === 'link-one'){
        const targetMod = getModule(f.targetModuleId);
        input = document.createElement('select');
        if (!targetMod){
          input.disabled = true;
          input.appendChild(el('option','','(no target module set — edit this field in the schema first)'));
        } else {
          input.appendChild(el('option','','— none —'));
          moduleRecords(targetMod.id).forEach(r => {
            const o = document.createElement('option'); o.value = r.id; o.textContent = recordTitle(targetMod, r);
            if (draft.fields[f.id] === r.id) o.selected = true;
            input.appendChild(o);
          });
          input.onchange = () => draft.fields[f.id] = input.value || null;
        }
      } else if (f.type === 'link-many'){
        const targetMod = getModule(f.targetModuleId);
        input = el('div', '');
        input.style.border = '1px solid var(--line-strong)'; input.style.borderRadius = '8px';
        input.style.padding = '8px 10px'; input.style.maxHeight = '140px'; input.style.overflowY = 'auto';
        if (!targetMod || !moduleRecords(targetMod.id).length){
          input.appendChild(el('div', 'field-hint', targetMod ? 'No records in "' + escapeHtml(targetMod.name) + '" yet to link to.' : '(no target module set — edit this field in the schema first)'));
        } else {
          const current = new Set(Array.isArray(draft.fields[f.id]) ? draft.fields[f.id] : []);
          moduleRecords(targetMod.id).forEach(r => {
            const rowLabel = document.createElement('label');
            rowLabel.style.display = 'flex'; rowLabel.style.alignItems = 'center'; rowLabel.style.gap = '8px';
            rowLabel.style.padding = '4px 0'; rowLabel.style.fontSize = '13.5px';
            const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = current.has(r.id);
            cb.onchange = () => {
              if (cb.checked) current.add(r.id); else current.delete(r.id);
              draft.fields[f.id] = Array.from(current);
            };
            rowLabel.appendChild(cb);
            rowLabel.appendChild(document.createTextNode(recordTitle(targetMod, r)));
            input.appendChild(rowLabel);
          });
        }
      } else {
        input = document.createElement('input'); input.type = 'text';
        input.value = draft.fields[f.id] || '';
        input.oninput = () => draft.fields[f.id] = input.value;
      }
      linkLabel(labelEl, input);
      grp.appendChild(input);
      body.appendChild(grp);
    });

    if (isEdit){
      const backlinks = getBacklinks(mod, rec);
      if (backlinks.length){
        const blGrp = el('div', 'field-group');
        blGrp.appendChild(el('label', 'field-label', 'Linked from'));
        const box = el('div', '');
        box.style.border = '1px solid var(--line)'; box.style.borderRadius = '8px'; box.style.padding = '4px 10px'; box.style.background = 'var(--surface-sunk)';
        backlinks.forEach(({mod: bMod, rec: bRec, field: bField}) => {
          const row = el('div', 'item-row');
          row.style.borderBottom = '1px solid var(--line)';
          const mainDiv = el('div', 'item-main');
          const t = el('div', 'item-title', recordTitle(bMod, bRec));
          t.onclick = () => { closeModal(); openRecordModal(bMod, bRec); };
          mainDiv.appendChild(t);
          mainDiv.appendChild(el('div', 'item-meta', bMod.name + ' · via "' + bField.label + '"'));
          row.appendChild(mainDiv);
          box.appendChild(row);
        });
        blGrp.appendChild(box);
        body.appendChild(blGrp);
      }
    }

    const notesGrp = el('div', 'field-group');
    const notesLabel = el('label', 'field-label', 'Notes');
    notesGrp.appendChild(notesLabel);
    const notesArea = document.createElement('textarea');
    notesArea.value = draft.notes || '';
    notesArea.placeholder = 'Anything else about this specific record.';
    notesArea.oninput = () => draft.notes = notesArea.value;
    linkLabel(notesLabel, notesArea);
    notesGrp.appendChild(notesArea);
    body.appendChild(notesGrp);
  }, buildRecordFooter(mod, rec, draft), { isDirty: () => draftSignature(draft) !== startSig || !!draft.pendingFile || !!draft.removeAttachment });
  // Taken after the form is built, so defaults the form fills in (like a
  // Choice list's first option) don't count as a change.
  const startSig = draftSignature(draft);
}

/* A comparable fingerprint of a record draft, ignoring empty values — so
   typing something and deleting it again isn't "unsaved changes". */
function draftSignature(draft){
  const blank = v => v == null || v === '' || v === false || (Array.isArray(v) && !v.length);
  const keys = Object.keys(draft.fields).filter(k => !blank(draft.fields[k])).sort();
  return JSON.stringify([keys.map(k => [k, draft.fields[k]]), String(draft.notes || '').trim()]);
}

/* True if a new record has anything a person actually typed or chose —
   a Choice list's or checkbox's default alone doesn't count. */
function draftHasContent(mod, draft){
  if (draft.pendingFile) return true;
  if (String(draft.notes || '').trim()) return true;
  return mod.fields.some(f => {
    if (f.type === 'select' || f.type === 'checkbox') return false;
    const v = draft.fields[f.id];
    return Array.isArray(v) ? v.length > 0 : String(v == null ? '' : v).trim() !== '';
  });
}

/* Tie a <label> to its field so screen readers read the label with it. */
function linkLabel(labelEl, input){
  if (!input) return;
  const target = (input.tagName === 'INPUT' || input.tagName === 'SELECT' || input.tagName === 'TEXTAREA') ? input : null;
  if (target){
    if (!target.id) target.id = uid('f');
    labelEl.htmlFor = target.id;
  } else {
    // A group of checkboxes (link-many): name the group by the label.
    if (!labelEl.id) labelEl.id = uid('lbl');
    input.setAttribute('role', 'group');
    input.setAttribute('aria-labelledby', labelEl.id);
  }
}

/* Show a message at the top of the open modal's body. */
function showModalError(text){
  const body = modalRoot.querySelector('.modal-body');
  if (!body) return;
  const old = body.querySelector('.modal-save-error');
  if (old) old.remove();
  const box = el('div', 'error-box modal-save-error', text);
  box.setAttribute('role', 'alert');
  box.style.marginTop = '0'; box.style.marginBottom = '12px';
  body.prepend(box);
  body.scrollTop = 0;
}

function buildRecordFooter(mod, rec, draft){
  const buttons = [];
  if (rec){
    buttons.push(buttonEl('Delete', 'btn-danger', async () => {
      const backlinks = getBacklinks(mod, rec);
      const msg = backlinks.length
        ? '<strong>' + backlinks.length + '</strong> record' + (backlinks.length===1?'':'s') + ' link' + (backlinks.length===1?'s':'') +
          ' to this one. Deleting it leaves those links pointing at something that no longer exists — they’ll show as broken, not be cleaned up automatically. Delete anyway?'
        : 'Delete this record? This can’t be undone.';
      const ok = await confirmModal(msg);
      if (!ok) return;
      if (rec.attachment) await idbDeleteBlob(rec.attachment.idbKey).catch(() => {});
      state.records[mod.id] = moduleRecords(mod.id).filter(r => r.id !== rec.id);
      closeModal(); render();
    }));
  }
  buttons.push(buttonEl('Cancel', 'btn-secondary', closeModal));
  const saveBtn = buttonEl(rec ? 'Save' : 'Add', 'btn-primary', async () => {
    if (!rec && !draftHasContent(mod, draft)){
      showModalError(mod.fields.length
        ? 'Nothing to add yet — fill in at least one field first.'
        : 'Nothing to add yet — write something in Notes first.');
      return;
    }
    saveBtn.disabled = true;
    try {
      let attachment = draft.attachment;
      if (draft.pendingFile){
        // A new file replaces whatever was there before — clean up the old one.
        if (attachment) await idbDeleteBlob(attachment.idbKey).catch(() => {});
        const idbKey = uid('file');
        await idbPutBlob(idbKey, draft.pendingFile, draft.pendingFile.name, draft.pendingFile.type);
        attachment = { idbKey, name: draft.pendingFile.name, mimeType: draft.pendingFile.type, size: draft.pendingFile.size };
      } else if (draft.removeAttachment && attachment){
        await idbDeleteBlob(attachment.idbKey).catch(() => {});
        attachment = null;
      }
      if (rec){
        rec.fields = draft.fields; rec.notes = draft.notes; rec.attachment = attachment; rec.updatedAt = Date.now();
      } else {
        state.records[mod.id].push({ id: uid('r'), fields: draft.fields, notes: draft.notes, attachment, createdAt: Date.now(), updatedAt: Date.now() });
      }
      closeModal(); render();
    } catch(err){
      saveBtn.disabled = false;
      alert('Couldn\'t save the file (' + err.message + '). Everything else is unsaved too — try again.');
    }
  });
  buttons.push(saveBtn);
  return buttons;
}

function formatLastExported(){
  const ts = state.settings.lastExportedAt;
  if (!ts) return 'never';
  return formatDateTime(ts);
}

async function buildExportPayload(){
  // Deliberately excludes `settings` entirely — API keys and this device's
  // export schedule stay device-specific, never travel in a portable file.
  // File/photo attachments live in IndexedDB, not `state` — pull each one
  // in and base64-embed it so a single file is still the whole backup.
  // Known tradeoff, not hidden: lots of large photos means a large export
  // file. No attempt at compression or splitting into multiple files here.
  const modules = JSON.parse(JSON.stringify(state.modules));
  const records = JSON.parse(JSON.stringify(state.records));
  for (const mod of modules){
    if (mod.shape !== 'files') continue;
    for (const rec of (records[mod.id] || [])){
      if (!rec.attachment) continue;
      const stored = await idbGetBlob(rec.attachment.idbKey);
      if (stored) rec.attachment.data = await blobToBase64(stored.blob);
    }
  }
  return JSON.stringify({
    appVersion: 'note-goat-v1',
    exportedAt: Date.now(),
    modules,
    records,
  }, null, 2);
}

async function triggerExportDownload(auto){
  const payload = await buildExportPayload();
  const blob = new Blob([payload], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const dateStr = new Date().toISOString().slice(0, 10);
  const a = document.createElement('a');
  a.href = url; a.download = 'note-goat-backup-' + dateStr + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  state.settings.lastExportedAt = Date.now();
  saveState();
  showToast(auto ? 'Backup exported automatically.' : 'Backup exported.');
}

/* Checks a backup's shape before anything is replaced, so a damaged or
   hand-edited file is refused with a reason instead of being saved and
   then breaking the app on its next render. */
function backupProblem(parsed){
  const isObj = v => !!v && typeof v === 'object' && !Array.isArray(v);
  const ids = new Set();
  for (const mod of parsed.modules){
    if (!isObj(mod) || typeof mod.id !== 'string' || typeof mod.name !== 'string') return 'a module is missing its id or name';
    if (ids.has(mod.id)) return 'two modules share the id "' + mod.id + '"';
    ids.add(mod.id);
    if (!SHAPES[mod.shape]) return 'module "' + mod.name + '" has an unknown shape';
    if (!Array.isArray(mod.fields) || !mod.fields.every(f => isObj(f) && typeof f.id === 'string' && typeof f.label === 'string' && typeof f.type === 'string'))
      return 'module "' + mod.name + '" has a damaged field list';
    const recs = parsed.records[mod.id];
    if (recs === undefined){ parsed.records[mod.id] = []; continue; }
    if (!Array.isArray(recs)) return 'records for "' + mod.name + '" aren\'t a list';
    for (const rec of recs){
      if (!isObj(rec) || typeof rec.id !== 'string' || !isObj(rec.fields)) return 'a record in "' + mod.name + '" is damaged';
      if (rec.attachment !== undefined && rec.attachment !== null && !isObj(rec.attachment)) return 'a file in "' + mod.name + '" is damaged';
    }
  }
  return null;
}

function openImportPicker(onDone){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'application/json,.json';
  input.onchange = async () => {
    const file = input.files[0]; if (!file) return;
    let parsed;
    try {
      const text = await file.text();
      parsed = JSON.parse(text);
      if (!parsed || !Array.isArray(parsed.modules) || !parsed.records || typeof parsed.records !== 'object') throw new Error('not a Note Goat backup file');
      const problem = backupProblem(parsed);
      if (problem) throw new Error(problem);
    } catch(e){
      alert('Couldn\'t read that file as a Note Goat backup (' + e.message + ').');
      return;
    }
    const ok = await confirmModal('This replaces <strong>everything</strong> currently in Note Goat — ' +
      state.modules.length + ' module' + (state.modules.length===1?'':'s') + ' — with what\'s in this file (from ' +
      (parsed.exportedAt ? formatDateTime(parsed.exportedAt) : 'an unknown time') + '). This can\'t be undone. Continue?');
    if (!ok) return;
    await applyBackupData(parsed);
    saveState();
    render();
    showToast('Import complete.');
    if (onDone) onDone();
  };
  input.click();
}

/* Puts a parsed, already-checked backup into state, replacing modules and
   records. Used by Import and by Drive sync. Settings are never touched. */
async function applyBackupData(parsed){
    // Attachments carry as base64 inside the file; re-store each one into
    // this device's IndexedDB under a fresh key (never trust an imported
    // key to still be free) before dropping the metadata into state.
    for (const mod of parsed.modules){
      if (mod.shape !== 'files') continue;
      for (const rec of (parsed.records[mod.id] || [])){
        if (!rec.attachment || !rec.attachment.data) continue;
        const blob = base64ToBlob(rec.attachment.data, rec.attachment.mimeType);
        const newKey = uid('file');
        try { await idbPutBlob(newKey, blob, rec.attachment.name, rec.attachment.mimeType); }
        catch(e){ console.warn('Could not restore attachment for', rec.id, e); }
        rec.attachment = { idbKey: newKey, name: rec.attachment.name, mimeType: rec.attachment.mimeType, size: rec.attachment.size };
      }
    }
    state.modules = parsed.modules;
    state.records = parsed.records;
}

/* Checked once at startup: if a schedule is set and enough time has
   passed since the last export, export right now, quietly. Never prompts
   — the whole point of choosing a schedule over Manual is not having to
   decide each time. */
function checkScheduledExport(){
  const sched = state.settings.exportSchedule;
  if (!sched || sched === 'manual') return;
  const intervalMs = sched === 'daily' ? 24*60*60*1000 : 7*24*60*60*1000;
  const last = state.settings.lastExportedAt || 0;
  if (Date.now() - last >= intervalMs) triggerExportDownload(true);
}

function showToast(text){
  const t = document.createElement('div');
  t.textContent = text;
  t.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);' +
    'background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:20px;font-size:12.5px;' +
    'box-shadow:0 8px 24px rgba(0,0,0,0.2);z-index:200;opacity:0;transition:opacity .2s;';
  document.body.appendChild(t);
  requestAnimationFrame(() => { t.style.opacity = '1'; });
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 250); }, 3000);
}

/* Google's sign-in and API scripts load only when Google is set up: on
   page open if a Google Client ID is saved (for the Drive sync bar), or
   when Connections or a module's Sync window opens. With no Client ID,
   using the app contacts no Google site. Loading early means the sign-in
   popup isn't delayed (and blocked) by a script download after the tap. */
const GOOGLE_SCRIPTS = ['https://accounts.google.com/gsi/client', 'https://apis.google.com/js/api.js'];
const googleScriptLoads = {};
function loadGoogleScripts(){
  return Promise.all(GOOGLE_SCRIPTS.map(src => {
    // One load per script; a failed one is forgotten so a later try retries
    // only that script, never re-adding one that already loaded.
    if (!googleScriptLoads[src]) googleScriptLoads[src] = new Promise((resolve, reject) => {
      const tag = document.createElement('script');
      tag.src = src; tag.async = true;
      tag.onload = resolve;
      tag.onerror = () => { tag.remove(); delete googleScriptLoads[src]; reject(new Error('Could not load ' + src)); };
      document.head.appendChild(tag);
    });
    return googleScriptLoads[src];
  }));
}
function preloadGoogleScripts(){
  if (state.settings.googleClientId) loadGoogleScripts().catch(() => {});
}

/* =========================================================
   Drive sync — this device <-> one file in the person's own Drive
   One file, "Note Goat Sync.json" (tagged appProperties.noteGoatSync=1),
   in the Note Goat folder (tagged appProperties.noteGoatFolder=1, found by
   tag anywhere in Drive). It holds exactly what Export produces (modules +
   records, attachments as base64, never settings). Whole-file only: Drive
   newer -> load it; this device newer -> save it; both changed since this
   device's last sync -> the person picks one copy, seeing what differs.
   Never merged, never overwritten without asking in that case.
   Every sync first lists all tagged files: more than one, or one that
   isn't this device's syncFileId, stops and asks which to use.
   Signing in is one tap per session (Google tokens last about an hour and
   aren't stored). Uses plain fetch with its own drive.file-only token, so
   it never mixes with the Sheets/Docs/Calendar connection.
   Device-only markers in settings: syncFileId, syncRev (the Drive copy's
   revision marker this device last saw), syncLastHash (this device's data
   at last sync), syncBase (per-record fingerprints at last sync, for the
   "what differs" summary), syncDataHash + dataChangedAt (this device's
   data now), syncLastSyncedAt.
   ========================================================= */
const SYNC_FILE_NAME = 'Note Goat Sync.json';
const SYNC_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const SYNC_DEBOUNCE_MS = 4000;
const SYNC_LARGE_BYTES = 10 * 1024 * 1024;
const SYNC_SIMPLE_MAX = 5 * 1024 * 1024;
const SYNC_KEEPALIVE_MAX = 60 * 1024; // browsers cap keepalive request bodies at 64 KB
const DRIVE_FILES = 'https://www.googleapis.com/drive/v3/files';
const DRIVE_UPLOAD = 'https://www.googleapis.com/upload/drive/v3/files';
const DRIVE_META = 'id,name,modifiedTime,trashed,size,appProperties';
const NG_FOLDER_Q = "appProperties has { key='noteGoatFolder' and value='1' } and mimeType='application/vnd.google-apps.folder' and trashed=false";
const syncRt = { token:null, expiryTimer:null, timer:null, busy:false, conflict:null, copies:null,
  kind:'', text:'Tap to sync', reason:'', sizeNote:'' };

const syncBarEl = document.createElement('button');
syncBarEl.type = 'button';
syncBarEl.onclick = () => onSyncBarTap();
// kind: '' (idle), 'ok', 'busy', 'err'. reason: short words kept when the
// bar switches to the unsynced-changes warning.
function setSyncStatus(kind, text, reason){ syncRt.kind = kind; syncRt.text = text; syncRt.reason = reason || ''; paintSyncBar(); }
function paintSyncBar(){
  let kind = syncRt.kind, text = syncRt.text;
  if (!syncRt.conflict && !syncRt.copies && kind !== 'busy' && kind !== 'ok' && hasUnsyncedChanges()){
    if (kind === 'err') text += ' Unsynced changes on this device.';
    else { kind = 'warn'; text = 'Unsynced changes on this device. Tap to sync' + (syncRt.reason ? ' · ' + syncRt.reason : ''); }
  }
  syncBarEl.className = 'sync-bar' + (kind ? ' ' + kind : '');
  syncBarEl.innerHTML = '';
  syncBarEl.appendChild(el('span', 'sync-dot', ''));
  syncBarEl.appendChild(el('span', '', text + (syncRt.sizeNote ? ' · ' + syncRt.sizeNote : '')));
}

function strHash(str){
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return str.length.toString(36) + '.' + h.toString(36);
}
// Cheap fingerprint of modules + records, to tell whether this device's data changed.
function dataHash(){ return strHash(JSON.stringify([state.modules, state.records])); }
function noteDataChange(){
  const h = dataHash();
  if (h === state.settings.syncDataHash) return;
  state.settings.syncDataHash = h;
  state.settings.dataChangedAt = Date.now();
  if (syncRt.token) scheduleDriveSave(); else paintSyncBar();
}
function localChangedSinceSync(){ return state.settings.syncDataHash !== state.settings.syncLastHash; }
// Changes this device has that aren't in Drive yet (only once it has synced at least once).
function hasUnsyncedChanges(){ return !!state.settings.syncFileId && localChangedSinceSync(); }
function localIsEmpty(){ return state.modules.every(m => !moduleRecords(m.id).length); }
function remoteRev(meta){ return (meta && meta.appProperties && meta.appProperties.noteGoatRev) || null; }
function timeOnly(ts){ return new Date(ts).toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' }); }
function sizeNoteFor(bytes){
  return bytes > SYNC_LARGE_BYTES ? ('sync file is ' + humanFileSize(bytes) + ', which is large — syncing will be slow (photos are the usual cause)') : '';
}

/* Per-record fingerprints, for "what differs". An attachment counts by its
   name/type/size only: its IndexedDB key differs per device, and the Drive
   copy carries the bytes inline. */
function recFingerprint(rec){
  const r = Object.assign({}, rec);
  if (r.attachment) r.attachment = { name: r.attachment.name, mimeType: r.attachment.mimeType, size: r.attachment.size };
  return strHash(JSON.stringify(r));
}
function snapshotOf(modules, records){
  const out = {};
  modules.forEach(m => {
    const r = {};
    (records[m.id] || []).forEach(rec => { r[rec.id] = recFingerprint(rec); });
    out[m.id] = { name: m.name, r };
  });
  return out;
}
// Per module: records added / removed / changed going from `from` to `to`.
function diffSnapshots(from, to){
  const res = [];
  const ids = Object.keys(from).concat(Object.keys(to).filter(k => !(k in from)));
  ids.forEach(mid => {
    const a = (from[mid] || {}).r || {}, b = (to[mid] || {}).r || {};
    let added = 0, removed = 0, changed = 0;
    Object.keys(b).forEach(k => { if (!(k in a)) added++; else if (a[k] !== b[k]) changed++; });
    Object.keys(a).forEach(k => { if (!(k in b)) removed++; });
    res.push({ id: mid, name: (to[mid] || from[mid]).name, added, removed, changed });
  });
  return res;
}

function syncError(code){ const e = new Error(code); e.code = code; return e; }
function showSyncError(e){
  console.warn('Drive sync', e);
  const c = e && e.code;
  if (c === 'offline') setSyncStatus('', 'Offline — working on this device only. Tap to sync when you’re back online.', 'offline');
  else if (c === 'expired') setSyncStatus('', 'Not signed in — Google sign-in expired. Changes stay on this device. Tap to sync.', 'Google sign-in expired');
  else if (c === 'signin') setSyncStatus('', 'Not signed in — sign-in didn’t finish (closed, or a popup was blocked). Working on this device only. Tap to try again.', 'sign-in didn’t finish');
  else if (c === 'denied') setSyncStatus('', 'Not signed in — Google Drive access wasn’t allowed. Working on this device only. Tap to try again.', 'Drive access not allowed');
  else if (c === 'copies') setSyncStatus('err', syncRt.copies && syncRt.copies.length > 1
    ? 'Not synced — found ' + syncRt.copies.length + ' Note Goat sync files in Drive. Nothing was saved. Tap to choose which one to use.'
    : 'Not synced — found a Drive sync file this device hasn’t used before. Nothing was saved. Tap to choose whether to use it.');
  else if (c === 'network') setSyncStatus('err', 'Error: couldn’t reach Google. Working on this device only. Tap to try again.');
  else if (e && e.status === 403) setSyncStatus('err', 'Error: Google refused (' + e.message + '). Check the Drive API is enabled on your Google Cloud project. Tap to try again.');
  else setSyncStatus('err', 'Error: ' + ((e && e.message) || 'unknown problem') + '. Working on this device only. Tap to try again.');
}

async function driveFetch(url, opts){
  opts = opts || {};
  const headers = Object.assign({ Authorization: 'Bearer ' + syncRt.token }, opts.headers || {});
  let res;
  try { res = await fetch(url, Object.assign({}, opts, { headers })); }
  catch(e){ throw syncError(navigator.onLine === false ? 'offline' : 'network'); }
  if (res.status === 401){ syncSignedOut(); throw syncError('expired'); }
  if (!res.ok){
    let msg = '';
    try { const j = await res.json(); msg = (j.error && j.error.message) || ''; } catch(e){}
    const err = new Error(msg || ('Google Drive answered ' + res.status)); err.status = res.status;
    throw err;
  }
  return res;
}
async function driveGetMeta(id){
  try {
    const m = await (await driveFetch(DRIVE_FILES + '/' + encodeURIComponent(id) + '?fields=' + DRIVE_META)).json();
    return m.trashed ? null : m;
  } catch(e){ if (e.status === 404) return null; throw e; }
}
async function driveListSyncFiles(){
  const q = "appProperties has { key='noteGoatSync' and value='1' } and trashed=false";
  const j = await (await driveFetch(DRIVE_FILES + '?q=' + encodeURIComponent(q) +
    '&orderBy=modifiedTime%20desc&pageSize=50&fields=' + encodeURIComponent('files(' + DRIVE_META + ')'))).json();
  return j.files || [];
}
/* The one agreed sync file, or null if there is none. More than one, or
   one this device hasn't agreed to, throws 'copies' — never picked silently. */
async function resolveSyncFile(){
  const files = await driveListSyncFiles();
  if (!files.length) return null;
  if (files.length === 1 && files[0].id === state.settings.syncFileId) return files[0];
  syncRt.copies = files;
  throw syncError('copies');
}
// The Note Goat folder, found by its tag anywhere in Drive (so a moved folder
// is reused). An older untagged one at the top level gets tagged; otherwise one is made.
async function driveFolderId(){
  const tagged = await (await driveFetch(DRIVE_FILES + '?q=' + encodeURIComponent(NG_FOLDER_Q) + '&fields=files(id)')).json();
  if (tagged.files && tagged.files.length) return tagged.files[0].id;
  const q = "mimeType='application/vnd.google-apps.folder' and name='Note Goat' and trashed=false and 'root' in parents";
  const j = await (await driveFetch(DRIVE_FILES + '?q=' + encodeURIComponent(q) + '&fields=files(id)')).json();
  if (j.files && j.files.length){
    await driveFetch(DRIVE_FILES + '/' + encodeURIComponent(j.files[0].id) + '?fields=id', { method:'PATCH',
      headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ appProperties:{ noteGoatFolder:'1' } }) });
    return j.files[0].id;
  }
  const made = await (await driveFetch(DRIVE_FILES + '?fields=id', { method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ name:'Note Goat', mimeType:'application/vnd.google-apps.folder', parents:['root'], appProperties:{ noteGoatFolder:'1' } }) })).json();
  return made.id;
}
// Creates (fileId null) or replaces the sync file. Every save carries a new
// revision marker, so another device can tell the copy changed. `urgent`
// (page being left) sends small saves with keepalive so they survive the page closing.
async function driveUpload(fileId, body, rev, urgent){
  const meta = { appProperties: { noteGoatSync:'1', noteGoatRev: rev } };
  if (!fileId){ meta.name = SYNC_FILE_NAME; meta.mimeType = 'application/json'; meta.parents = [await driveFolderId()]; }
  const target = DRIVE_UPLOAD + (fileId ? '/' + encodeURIComponent(fileId) : '');
  const method = fileId ? 'PATCH' : 'POST';
  if (new Blob([body]).size <= SYNC_SIMPLE_MAX){
    const b = '==NoteGoat' + Math.random().toString(36).slice(2);
    const multipart = '--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(meta) +
      '\r\n--' + b + '\r\nContent-Type: application/json\r\n\r\n' + body + '\r\n--' + b + '--';
    const keepalive = !!urgent && new Blob([multipart]).size <= SYNC_KEEPALIVE_MAX;
    return (await driveFetch(target + '?uploadType=multipart&fields=' + DRIVE_META, { method, keepalive,
      headers:{ 'Content-Type':'multipart/related; boundary=' + b }, body: multipart })).json();
  }
  // Bigger than 5 MB: Drive wants a resumable upload, sent here in one piece.
  const start = await driveFetch(target + '?uploadType=resumable&fields=' + DRIVE_META, { method,
    headers:{ 'Content-Type':'application/json; charset=UTF-8', 'X-Upload-Content-Type':'application/json' },
    body: JSON.stringify(meta) });
  const loc = start.headers.get('Location');
  if (!loc) throw new Error('Google Drive didn’t return an upload address');
  return (await driveFetch(loc, { method:'PUT', headers:{ 'Content-Type':'application/json' }, body })).json();
}

function syncSignedOut(){
  syncRt.token = null;
  clearTimeout(syncRt.expiryTimer); clearTimeout(syncRt.timer);
}
function syncSignIn(){
  return new Promise((resolve, reject) => {
    const go = () => {
      let client;
      try {
        client = google.accounts.oauth2.initTokenClient({
          client_id: state.settings.googleClientId,
          scope: SYNC_SCOPE, // only files this app made — not the rest of your Drive
          callback: (resp) => {
            if (resp && resp.access_token && google.accounts.oauth2.hasGrantedAllScopes(resp, SYNC_SCOPE)){
              syncRt.token = resp.access_token;
              clearTimeout(syncRt.expiryTimer);
              const secs = Math.max(60, (parseInt(resp.expires_in, 10) || 3600) - 60);
              syncRt.expiryTimer = setTimeout(() => {
                syncSignedOut();
                if (!syncRt.busy) showSyncError(syncError('expired'));
              }, secs * 1000);
              resolve();
            } else reject(syncError('denied'));
          },
          error_callback: () => reject(syncError('signin')),
        });
      } catch(e){ reject(new Error('Google sign-in couldn’t start (' + e.message + ')')); return; }
      client.requestAccessToken();
    };
    if (window.google && google.accounts && google.accounts.oauth2) go();
    else loadGoogleScripts().then(go, () => reject(syncError(navigator.onLine === false ? 'offline' : 'network')));
  });
}

async function onSyncBarTap(){
  if (syncRt.busy) return;
  if (!state.settings.googleClientId){
    setSyncStatus('', 'Not set up — add your Google Client ID under Settings to sync.', 'Google not set up');
    openConnectionsModal();
    return;
  }
  if (navigator.onLine === false){ showSyncError(syncError('offline')); return; }
  try {
    if (!syncRt.token){ setSyncStatus('busy', 'Signing in…'); await syncSignIn(); }
    if (syncRt.conflict){ openSyncChooser(syncRt.conflict); paintSyncBar(); return; }
    await syncCompare();
  } catch(e){ showSyncError(e); }
}

async function syncCompare(){
  syncRt.busy = true;
  syncRt.copies = null;
  setSyncStatus('busy', 'Checking Google Drive…');
  try {
    const s = state.settings;
    let remote;
    try { remote = await resolveSyncFile(); }
    catch(e){ if (e.code !== 'copies') throw e; showSyncError(e); openCopiesChooser(syncRt.copies); return; }
    if (!remote){ await pushToDrive(null); return; }
    const known = remote.id === s.syncFileId && !!s.syncRev;
    const remoteChanged = !known || remoteRev(remote) !== s.syncRev;
    const localChanged = localChangedSinceSync();
    syncRt.sizeNote = sizeNoteFor(parseInt(remote.size, 10) || 0);
    if (!remoteChanged && !localChanged){
      if (!s.syncBase) s.syncBase = snapshotOf(state.modules, state.records);
      markSynced(remote); return;
    }
    if (!remoteChanged){ await pushToDrive(remote.id); return; }
    // First sync on a device with nothing in it: nothing to lose, just load.
    if (!localChanged || (!known && localIsEmpty())){ await pullFromDrive(remote); return; }
    syncRt.conflict = remote;
    setSyncStatus('err', 'Not synced — this device and the Drive copy both changed. Tap to choose which to keep.');
    openSyncChooser(remote);
  } finally { syncRt.busy = false; }
}

function markSynced(meta){
  const s = state.settings;
  s.syncFileId = meta.id;
  s.syncRev = remoteRev(meta);
  s.syncLastSyncedAt = Date.now();
  saveState();
  setSyncStatus('ok', 'Synced at ' + timeOnly(s.syncLastSyncedAt));
}

async function pushToDrive(fileId, urgent){
  setSyncStatus('busy', 'Saving…');
  const hashAtBuild = state.settings.syncDataHash;
  const baseAtBuild = snapshotOf(state.modules, state.records);
  const payload = await buildExportPayload();
  const meta = await driveUpload(fileId, payload, uid('rev'), urgent);
  syncRt.sizeNote = sizeNoteFor(new Blob([payload]).size);
  state.settings.syncLastHash = hashAtBuild;
  state.settings.syncBase = baseAtBuild;
  markSynced(meta);
  if (localChangedSinceSync()) scheduleDriveSave(); // changed again while saving
}

async function downloadSyncCopy(id){
  const text = await (await driveFetch(DRIVE_FILES + '/' + encodeURIComponent(id) + '?alt=media')).text();
  let parsed;
  try {
    parsed = JSON.parse(text);
    if (!parsed || !Array.isArray(parsed.modules) || !parsed.records || typeof parsed.records !== 'object') throw new Error('not a Note Goat backup');
    const problem = backupProblem(parsed);
    if (problem) throw new Error(problem);
  } catch(e){
    throw new Error('the Drive copy couldn’t be read (' + e.message + '). Nothing on this device was changed');
  }
  return parsed;
}

async function pullFromDrive(remote){
  setSyncStatus('busy', 'Loading the Drive copy…');
  const parsed = await downloadSyncCopy(remote.id);
  closeModal();
  await applyBackupData(parsed);
  // What just loaded is now this device's synced starting point.
  const s = state.settings;
  s.syncDataHash = dataHash();
  s.dataChangedAt = Date.parse(remote.modifiedTime) || Date.now();
  s.syncLastHash = s.syncDataHash;
  s.syncBase = snapshotOf(state.modules, state.records);
  markSynced(remote);
  render();
  showToast('Loaded the newer copy from Google Drive.');
}

/* More than one tagged sync file, or one this device hasn't used: the
   person picks. The others are renamed "(not in use)" and untagged — never
   deleted — so they stop being found. */
function openCopiesChooser(files){
  const s = state.settings;
  let picked = files[0].id;
  openModal(files.length > 1 ? 'More than one sync file' : 'Use this sync file?', (body) => {
    body.appendChild(el('div', 'confirm-msg', files.length > 1
      ? 'Google Drive has ' + files.length + ' Note Goat sync files. Using more than one lets your devices drift apart, so nothing was saved. Choose the one to keep syncing with. The others aren’t deleted: they’re renamed “(not in use)” and no longer used.'
      : 'This device hasn’t synced with this Drive file before, so nothing was saved yet. Use it as the sync file? Next, it’s compared with this device, and you’re asked before anything is replaced.'));
    const list = el('div', ''); list.style.margin = '12px 0';
    files.forEach((f, i) => {
      const row = el('label', 'checklist-row'); row.style.cursor = 'pointer';
      const rb = document.createElement('input'); rb.type = 'radio'; rb.name = 'syncCopy'; rb.checked = i === 0;
      rb.onchange = () => { picked = f.id; };
      row.appendChild(rb);
      const t = el('div', 'item-main');
      t.appendChild(el('div', 'item-title', f.name || SYNC_FILE_NAME));
      const when = Date.parse(f.modifiedTime);
      t.appendChild(el('div', 'item-meta', 'Last saved ' + (when ? formatDateTime(when) : 'at an unknown time') +
        (f.size ? ' · ' + humanFileSize(parseInt(f.size, 10)) : '') + (f.id === s.syncFileId ? ' · this device’s sync file until now' : '')));
      row.appendChild(t);
      list.appendChild(row);
    });
    body.appendChild(list);
  }, [
    buttonEl('Decide later', 'btn-secondary', closeModal),
    buttonEl(files.length > 1 ? 'Use selected' : 'Use this file', 'btn-primary', () => { closeModal(); useSyncCopy(picked, files); }),
  ]);
}
async function useSyncCopy(id, files){
  if (syncRt.busy) return;
  syncRt.busy = true;
  setSyncStatus('busy', 'Setting the sync file…');
  try {
    if (!syncRt.token) await syncSignIn();
    for (const f of files){
      if (f.id === id) continue;
      const when = Date.parse(f.modifiedTime);
      const stamp = when ? new Date(when).toISOString().slice(0, 16).replace('T', ' ') : 'unknown date';
      await driveFetch(DRIVE_FILES + '/' + encodeURIComponent(f.id) + '?fields=id', { method:'PATCH',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ name: 'Note Goat Sync (not in use, saved ' + stamp + ').json', appProperties:{ noteGoatSync: null } }) });
    }
    const s = state.settings;
    if (id !== s.syncFileId){ s.syncFileId = id; s.syncRev = null; s.syncBase = null; }
    syncRt.copies = null;
    saveState();
  } catch(e){ syncRt.busy = false; showSyncError(e); return; }
  syncRt.busy = false;
  try { await syncCompare(); } catch(e){ showSyncError(e); }
}

function diffLine(d){
  const parts = [];
  if (d.added) parts.push(d.added + ' added');
  if (d.removed) parts.push(d.removed + ' removed');
  if (d.changed) parts.push(d.changed + ' changed');
  return parts.length ? parts.join(', ') : 'no changes';
}
async function fillSyncDiff(box, remote){
  box.textContent = 'Comparing the two copies…';
  let parsed;
  try { parsed = await downloadSyncCopy(remote.id); }
  catch(e){ box.textContent = 'Couldn’t load the Drive copy to compare (' + (e.code ? 'connection problem' : e.message) + ').'; return; }
  const localSnap = snapshotOf(state.modules, state.records);
  const remoteSnap = snapshotOf(parsed.modules, parsed.records);
  const base = state.settings.syncBase;
  box.innerHTML = '';
  const known = base && remote.id === state.settings.syncFileId;
  if (known){
    const mine = diffSnapshots(base, localSnap), theirs = diffSnapshots(base, remoteSnap);
    const ids = mine.map(d => d.id).concat(theirs.map(d => d.id).filter(id => !mine.some(d => d.id === id)));
    let any = false;
    ids.forEach(id => {
      const a = mine.find(d => d.id === id) || { added:0, removed:0, changed:0 };
      const b = theirs.find(d => d.id === id) || { added:0, removed:0, changed:0 };
      if (!(a.added || a.removed || a.changed || b.added || b.removed || b.changed)) return;
      any = true;
      const row = el('div', 'item-row');
      const m = el('div', 'item-main');
      m.appendChild(el('div', 'item-title', (localSnap[id] || remoteSnap[id] || base[id]).name));
      m.appendChild(el('div', 'item-meta', 'This device: ' + diffLine(a)));
      m.appendChild(el('div', 'item-meta', 'Drive: ' + diffLine(b)));
      row.appendChild(m); box.appendChild(row);
    });
    if (!any) box.appendChild(el('div', 'item-meta', 'No record differences found — only module settings (fields, names) differ.'));
  } else {
    box.appendChild(el('div', 'field-hint', 'This device hasn’t synced with this file before, so this compares the two copies directly.'));
    let any = false;
    diffSnapshots(localSnap, remoteSnap).forEach(d => {
      if (!(d.added || d.removed || d.changed)) return;
      any = true;
      const parts = [];
      if (d.removed) parts.push(d.removed + ' only on this device');
      if (d.added) parts.push(d.added + ' only in Drive');
      if (d.changed) parts.push(d.changed + ' different');
      const row = el('div', 'item-row');
      const m = el('div', 'item-main');
      m.appendChild(el('div', 'item-title', d.name));
      m.appendChild(el('div', 'item-meta', parts.join(', ')));
      row.appendChild(m); box.appendChild(row);
    });
    if (!any) box.appendChild(el('div', 'item-meta', 'No record differences found — only module settings (fields, names) differ.'));
  }
}

async function resolveSyncConflict(keep){
  if (syncRt.busy) return;
  syncRt.busy = true;
  try {
    if (!syncRt.token){ setSyncStatus('busy', 'Signing in…'); await syncSignIn(); }
    syncRt.conflict = null;
    let remote;
    try { remote = await resolveSyncFile(); }
    catch(e){ if (e.code !== 'copies') throw e; showSyncError(e); openCopiesChooser(syncRt.copies); return; }
    if (keep === 'drive' && remote) await pullFromDrive(remote);
    else await pushToDrive(remote ? remote.id : null);
  } catch(e){ showSyncError(e); }
  finally { syncRt.busy = false; }
}

// After a sync, every change saves to Drive a few seconds after the last edit
// (straight away if the page is being left).
function scheduleDriveSave(){
  if (!syncRt.token || syncRt.conflict || syncRt.copies) return;
  clearTimeout(syncRt.timer);
  setSyncStatus('busy', 'Saving…');
  const leaving = document.visibilityState === 'hidden';
  syncRt.timer = setTimeout(() => driveAutoSave(leaving), leaving ? 0 : SYNC_DEBOUNCE_MS);
}
async function driveAutoSave(urgent){
  if (!syncRt.token || syncRt.conflict || syncRt.copies) return;
  if (syncRt.busy){ scheduleDriveSave(); return; }
  if (!localChangedSinceSync()){ setSyncStatus('ok', 'Synced at ' + timeOnly(state.settings.syncLastSyncedAt || Date.now())); return; }
  if (navigator.onLine === false){
    setSyncStatus('', 'Offline — changes are kept on this device and will save to Drive when you’re back online.', 'offline');
    return;
  }
  syncRt.busy = true;
  try {
    const s = state.settings;
    const remote = await resolveSyncFile();
    if (remote && remoteRev(remote) !== s.syncRev){
      // Another device saved meanwhile — ask, never overwrite.
      syncRt.conflict = remote;
      setSyncStatus('err', 'Not synced — the Drive copy was changed on another device. Tap to choose which copy to keep.');
      return;
    }
    await pushToDrive(remote ? remote.id : null, urgent);
  } catch(e){ showSyncError(e); }
  finally { syncRt.busy = false; }
}
// Leaving the page (switching apps, closing the tab): save now, not in 4 seconds.
function saveNowIfLeaving(){
  if (!syncRt.token || syncRt.conflict || syncRt.copies || !localChangedSinceSync()) return;
  clearTimeout(syncRt.timer);
  driveAutoSave(true);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNowIfLeaving(); });
window.addEventListener('pagehide', saveNowIfLeaving);
window.addEventListener('online', () => {
  if (syncRt.token && !syncRt.conflict && !syncRt.copies && localChangedSinceSync()) scheduleDriveSave();
  else if (!syncRt.token) setSyncStatus('', 'Tap to sync');
});
window.addEventListener('offline', () => {
  if (!syncRt.busy) setSyncStatus('', 'Offline — working on this device only.', 'offline');
});

function tryInitGoogle(promptSignIn, onConnected, onFailed, _attempt){
  _attempt = _attempt || 0;
  if (!state.settings.googleClientId || !state.settings.googleApiKey){
    if (onFailed) onFailed('Google isn\'t configured — add a Client ID and API key in Settings first.');
    return;
  }
  if (typeof gapi === 'undefined' || typeof google === 'undefined' || !google.accounts){
    // Load Google's scripts on first use, then try once more. Report failure
    // (offline, blocked) rather than retrying forever.
    const fail = () => { if (onFailed) onFailed('Couldn\'t reach Google\'s sign-in — check your connection and try again.'); };
    if (_attempt >= 1){ fail(); return; }
    loadGoogleScripts().then(() => tryInitGoogle(promptSignIn, onConnected, onFailed, 1), fail);
    return;
  }
  if (googleRt.tokenClient){
    if (promptSignIn) googleRt.tokenClient.requestAccessToken();
    return;
  }
  gapi.load('client', async () => {
    try {
      await gapi.client.init({
        apiKey: state.settings.googleApiKey,
        discoveryDocs: [
          'https://sheets.googleapis.com/$discovery/rest?version=v4',
          'https://www.googleapis.com/discovery/v1/apis/drive/v3/rest',
          'https://docs.googleapis.com/$discovery/rest?version=v1',
          'https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest',
        ],
      });
    } catch(e){
      console.warn('Google client init failed', e);
      if (onFailed) onFailed('Couldn\'t set up the Google connection (' + (e.message || 'check your API key') + ').');
      return;
    }
    googleRt.tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: state.settings.googleClientId,
      // drive.file: only files this app creates (its folder, Sheet, Docs) —
      // not the rest of your Drive. Sheets and Docs APIs accept it for those files.
      scope: 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/calendar.events',
      callback: (resp) => {
        if (resp.access_token){
          googleRt.accessToken = resp.access_token;
          googleRt.connected = true;
          gapi.client.setToken({ access_token: resp.access_token });
          if (onConnected) onConnected();
        }
      },
      error_callback: (err) => {
        console.error('Google sign-in error', err);
        if (onFailed) onFailed('Google sign-in didn\'t complete. If your browser blocked a popup, allow popups for this site and try again.');
        else alert('Google sign-in didn\'t complete. If your browser blocked a popup, allow popups for this site and try again.');
      },
    });
    if (promptSignIn) googleRt.tokenClient.requestAccessToken();
  });
}

/* ---------- Claude API (BYOK) ---------- */
const CLAUDE_API_URL = 'https://api.anthropic.com/v1/messages';
async function callClaude({ system, userContent, maxTokens }){
  if (!state.settings.anthropicKey) throw new Error('NO_KEY');
  const res = await fetch(CLAUDE_API_URL, {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': state.settings.anthropicKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-sonnet-5',
      max_tokens: maxTokens || 1024,
      system: system,
      messages: [{ role: 'user', content: userContent }],
    }),
  });
  if (!res.ok){
    let detail = '';
    try { detail = (await res.json()).error?.message || ''; } catch(e){}
    throw new Error(detail || ('HTTP ' + res.status));
  }
  const json = await res.json();
  const block = (json.content || []).find(b => b.type === 'text');
  return block ? block.text : '';
}

function syncStatus(box, text, isError){
  box.innerHTML = '';
  box.appendChild(el('div', isError ? 'error-box' : 'shape-note', text));
}

async function runSync(mod, target, statusBox){
  if (!state.settings.googleClientId || !state.settings.googleApiKey){
    syncStatus(statusBox, 'Google isn\'t configured yet — add your Client ID and API key in Settings first.', true);
    return;
  }
  if (!googleRt.connected){
    syncStatus(statusBox, 'Connecting to Google…', false);
    tryInitGoogle(true,
      () => runSync(mod, target, statusBox),
      (msg) => syncStatus(statusBox, msg, true));
    return;
  }
  syncStatus(statusBox, 'Syncing…', false);
  try {
    if (target === 'sheets') await syncModuleToSheets(mod);
    else if (target === 'docx') await syncModuleToDocx(mod);
    else if (target === 'calendar') await syncModuleToCalendar(mod);
    saveState();
    syncStatus(statusBox, 'Synced just now.', false);
  } catch(err){
    console.error('Sync failed', err);
    saveState(); // keep ids of anything already pushed, so a retry updates instead of duplicating
    // Google API errors arrive as { result: { error: { message } } }, not as Error objects.
    const why = (err && err.result && err.result.error && err.result.error.message) || (err && err.message) || 'unknown error';
    syncStatus(statusBox, 'Sync didn\'t go through (' + why + '). Nothing was changed here locally.', true);
  }
}

function fieldValueForExport(f, rec){
  if (f.type === 'link-one' || f.type === 'link-many') return linkFieldDisplay(f, rec);
  if (f.type === 'date') return rec.fields[f.id] ? formatDate(rec.fields[f.id]) : '';
  if (f.type === 'checkbox') return rec.fields[f.id] ? 'Yes' : 'No';
  return rec.fields[f.id] || '';
}

async function findOrCreateFolder(name, parentId){
  // The app's own top-level "Note Goat" folder carries a tag and is found by
  // it anywhere in Drive, so a folder that was moved is reused, not duplicated.
  const isAppFolder = name === 'Note Goat' && !parentId;
  if (isAppFolder){
    const tagged = await gapi.client.drive.files.list({ q: NG_FOLDER_Q, fields: 'files(id)' });
    if (tagged.result.files && tagged.result.files.length) return tagged.result.files[0].id;
  }
  const safeName = name.replace(/'/g, "\\'");
  const parentClause = parentId ? (" and '" + parentId + "' in parents") : " and 'root' in parents";
  const q = "mimeType='application/vnd.google-apps.folder' and name='" + safeName + "' and trashed=false" + parentClause;
  const listRes = await gapi.client.drive.files.list({ q, fields: 'files(id,name)' });
  if (listRes.result.files && listRes.result.files.length){
    const id = listRes.result.files[0].id;
    if (isAppFolder) await gapi.client.drive.files.update({ fileId: id, resource: { appProperties: { noteGoatFolder: '1' } }, fields: 'id' });
    return id;
  }
  const createRes = await gapi.client.drive.files.create({
    resource: Object.assign({ name, mimeType: 'application/vnd.google-apps.folder', parents: parentId ? [parentId] : [] },
      isAppFolder ? { appProperties: { noteGoatFolder: '1' } } : {}),
    fields: 'id',
  });
  return createRes.result.id;
}

async function syncModuleToSheets(mod){
  if (!state.settings.spreadsheetId){
    const folderId = await findOrCreateFolder('Note Goat', null);
    const res = await gapi.client.sheets.spreadsheets.create({ properties: { title: 'Note Goat Sync' } });
    state.settings.spreadsheetId = res.result.spreadsheetId;
    await gapi.client.drive.files.update({ fileId: state.settings.spreadsheetId, addParents: folderId, removeParents: 'root', fields: 'id,parents' });
  }
  const ssId = state.settings.spreadsheetId;
  const meta = await gapi.client.sheets.spreadsheets.get({ spreadsheetId: ssId });
  const existingTitles = (meta.result.sheets || []).map(s => s.properties.title);
  const tabName = mod.name.slice(0, 95); // Sheets tab title limit
  if (!existingTitles.includes(tabName)){
    await gapi.client.sheets.spreadsheets.batchUpdate({
      spreadsheetId: ssId,
      resource: { requests: [{ addSheet: { properties: { title: tabName } } }] },
    });
  }
  const headers = mod.fields.map(f => f.label).concat('Notes');
  const rows = moduleRecords(mod.id).map(rec => mod.fields.map(f => fieldValueForExport(f, rec)).concat(rec.notes || ''));
  // Clear the tab first so rows for deleted records, and columns for
  // removed fields, don't linger below or beside the new data.
  await gapi.client.sheets.spreadsheets.values.clear({ spreadsheetId: ssId, range: "'" + tabName + "'", resource: {} });
  await gapi.client.sheets.spreadsheets.values.update({
    spreadsheetId: ssId,
    range: "'" + tabName + "'!A1",
    valueInputOption: 'RAW',
    resource: { values: [headers, ...rows] },
  });
}

async function syncModuleToDocx(mod){
  if (!mod.docId){
    const folderId = await findOrCreateFolder('Note Goat', null);
    const res = await gapi.client.docs.documents.create({ resource: { title: 'Note Goat — ' + mod.name } });
    mod.docId = res.result.documentId;
    await gapi.client.drive.files.update({ fileId: mod.docId, addParents: folderId, removeParents: 'root', fields: 'id,parents' });
  }
  const doc = await gapi.client.docs.documents.get({ documentId: mod.docId });
  const content = doc.result.body.content || [];
  const endIndex = content.length ? content[content.length - 1].endIndex : 1;
  const requests = [];
  if (endIndex > 2) requests.push({ deleteContentRange: { range: { startIndex: 1, endIndex: endIndex - 1 } } });
  const parts = moduleRecords(mod.id).map(rec => {
    const title = recordTitle(mod, rec);
    const body = rec.notes || (mod.fields.map(f => f.label + ': ' + fieldValueForExport(f, rec)).join('\n'));
    return title + '\n' + body;
  });
  const text = parts.length ? parts.join('\n\n---\n\n') + '\n' : '(no records yet)\n';
  requests.push({ insertText: { location: { index: 1 }, text } });
  await gapi.client.docs.documents.batchUpdate({ documentId: mod.docId, resource: { requests } });
}

// A "local" YYYY-MM-DDTHH:MM:SS string (no offset/Z) for a date+time
// that's `hours` after dateVal/timeVal, read back using the wall-clock
// components — the timeZone field on the request is what pins it to a
// real instant, not this string.
function addHoursToLocalDateTime(dateVal, timeVal, hours){
  const [y, mo, d] = dateVal.split('-').map(Number);
  const [h, mi] = timeVal.split(':').map(Number);
  const dt = new Date(y, mo - 1, d, h, mi, 0);
  dt.setHours(dt.getHours() + hours);
  const pad = n => String(n).padStart(2, '0');
  return dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate()) +
    'T' + pad(dt.getHours()) + ':' + pad(dt.getMinutes()) + ':00';
}

async function syncModuleToCalendar(mod){
  const df = dateField(mod);
  if (!df) throw new Error('this module has no date field');
  const tf = timeField(mod);
  const keep = new Set();
  for (const rec of moduleRecords(mod.id)){
    const dateVal = rec.fields[df.id];
    if (!dateVal){
      // Date cleared since the last sync — take its event off the calendar.
      if (rec.calendarEventId){ await deleteCalendarEvent(rec.calendarEventId); delete rec.calendarEventId; }
      continue;
    }
    const timeVal = tf ? rec.fields[tf.id] : '';
    let eventResource;
    if (timeVal){
      // Has a time of day too — push as a timed, 1-hour event instead of
      // all-day, in the browser's own timezone.
      const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
      eventResource = {
        summary: recordTitle(mod, rec),
        description: rec.notes || '',
        start: { dateTime: dateVal + 'T' + timeVal + ':00', timeZone },
        end: { dateTime: addHoursToLocalDateTime(dateVal, timeVal, 1), timeZone },
      };
    } else {
      // Date only — keep the existing all-day behavior.
      eventResource = {
        summary: recordTitle(mod, rec),
        description: rec.notes || '',
        start: { date: dateVal },
        end: { date: dateVal },
      };
    }
    // Reminder minutes are measured from event start, so a timed event
    // (start = the actual time) needs a longer lead than an all-day one
    // (start = midnight) to land at a sensible moment.
    if (mod.calendarReminder !== false){
      eventResource.reminders = {
        useDefault: false,
        overrides: [{ method: 'popup', minutes: timeVal ? CALENDAR_REMINDER_MINUTES_TIMED : CALENDAR_REMINDER_MINUTES_ALLDAY }],
      };
    }
    // Tagged so a later sync can find this module's events, including ones
    // whose record has since been deleted here.
    eventResource.extendedProperties = { private: { noteGoatModule: mod.id, noteGoatRecord: rec.id } };
    if (rec.calendarEventId){
      try {
        await gapi.client.calendar.events.update({ calendarId: 'primary', eventId: rec.calendarEventId, resource: eventResource });
      } catch(e){
        if (!isGoneError(e)) throw e;
        delete rec.calendarEventId; // deleted on the Google side — make it again
      }
    }
    if (!rec.calendarEventId){
      const res = await gapi.client.calendar.events.insert({ calendarId: 'primary', resource: eventResource });
      rec.calendarEventId = res.result.id;
    }
    keep.add(rec.calendarEventId);
  }
  // Remove events this module made for records that no longer exist here.
  const stale = [];
  let pageToken;
  do {
    const res = await gapi.client.calendar.events.list({ calendarId: 'primary',
      privateExtendedProperty: 'noteGoatModule=' + mod.id, maxResults: 250, pageToken });
    (res.result.items || []).forEach(ev => { if (!keep.has(ev.id)) stale.push(ev.id); });
    pageToken = res.result.nextPageToken;
  } while (pageToken);
  for (const id of stale) await deleteCalendarEvent(id);
}

function isGoneError(e){
  const status = e && (e.status || (e.result && e.result.error && e.result.error.code));
  return status === 404 || status === 410;
}
async function deleteCalendarEvent(eventId){
  try { await gapi.client.calendar.events.delete({ calendarId: 'primary', eventId }); }
  catch(e){ if (!isGoneError(e)) throw e; } // already gone is fine
}

/* =========================================================
   Small helpers
   ========================================================= */
function el(tag, cls, text){
  const e = document.createElement(tag || 'div');
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const WC_PALETTE = ['var(--wc-1)','var(--wc-2)','var(--wc-3)','var(--wc-4)','var(--wc-5)','var(--wc-6)'];
function colorForKey(str){
  const s = String(str || '');
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return WC_PALETTE[h % WC_PALETTE.length];
}
function formatDate(iso){
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return iso;
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
}
function formatDateTime(ts){
  const d = new Date(ts);
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric' }) + ', ' + d.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
}

/* =========================================================
   Manual — a self-contained document (its own <style>, own fonts) since
   it's rendered in an iframe via srcdoc and inherits nothing from the
   parent page. Colors are Note Goat's own tokens, not copied from
   any sibling app's manual, so it reads as part of this app.
   ========================================================= */
let manualLoaded = false;
document.getElementById('openManualBtn').onclick = () => {
  const frame = document.getElementById('manualFrame');
  if (!manualLoaded){ frame.srcdoc = MANUAL_HTML; manualLoaded = true; }
  manualReturnFocus = document.activeElement;
  document.getElementById('manualOverlay').classList.add('open');
  try { document.getElementById('manualCloseBtn').focus({ preventScroll: true }); } catch(e){}
};
let manualReturnFocus = null;
function closeManual(){
  document.getElementById('manualOverlay').classList.remove('open');
  if (manualReturnFocus && manualReturnFocus.isConnected){ try { manualReturnFocus.focus({ preventScroll: true }); } catch(e){} }
  manualReturnFocus = null;
}
document.getElementById('manualCloseBtn').onclick = closeManual;
document.getElementById('manualCloseBtn').setAttribute('aria-label', 'Close the Manual');
document.getElementById('manualOverlay').onclick = (e) => { if (e.target.id === 'manualOverlay') closeManual(); };
// Escape inside the Manual's own frame closes it too (it's same-origin srcdoc).
